country: Mauritius
iso3: MUS
indicator: PPI
tier: 2
source_type: xlsx
agency: Statistics Mauritius
publication_code: Economic and Social Indicators - Producer Price Index - Manufacturing (quarterly)
frequency: quarterly
expect_rows: 400

# Two hops: the Indices page lists the latest ESI page first
# (ESI/Manufacturing/PPIM/PPIM_2Qtr26.aspx), which links the xlsx.
discover:
  method: two_hop_scrape
  index_url: "https://statsmauritius.govmu.org/Pages/Statistics/By_Subject/Indices/SB_Indices.aspx"
  page_link_contains: ["ESI/Manufacturing/PPIM/PPIM_"]
  file_link_contains: [".xlsx"]
  base_url: "https://statsmauritius.govmu.org"

parser: mauritius_ppim_esi_ppi
geography: National

notes: >
  The % changes the historical series does not print, by industry group:
  month-on-month for the last three months (Tab 1(a)-(c)) and
  quarter-on-quarter / year-on-year for the last four quarters (Tab 3(a)-(c)).
  Each quarterly ESI adds its window; earlier issues (back to 1999,
  Documents/Statistics/ESI/<year>/EI<no>/) would extend the change series.
  CROSS-CHECK (verbatim, 2nd Qr 2026 issue): total manufacturing Mar-Apr 26
  0.3, Apr-May 26 1.3, May-Jun 26 0.3; 2nd Qr 25 to 2nd Qr 26 7.3.
