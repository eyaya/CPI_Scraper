parser: egypt_capmas_ppi
geography: National

notes: >
  INVENTORY. One PPI (replacing the Wholesale Price Index from September
  2007), by ISIC section (A B C D E H I J), division/group/product detail,
  major groups by end use and by stage of processing, and (from 2021)
  selected CPC products. Bases as printed: "2004/2005=100" (Sep 2007 -
  mid-2017 issues) and "Jan 2016 = 100" (from 2017). Each issue prints the
  previous month, the current month and the same month a year earlier, plus
  m/m and y/y changes. Span: Sep 2006 (year-ago column of the first issue) -
  Aug 2026.
  NOT READ: 49 PDF issues -- 2010-01 .. 2016-11 except 2013-09, 2015-05/07,
  2016-03/09 are SCANNED (no text layer; no OCR), and some 2018-2020 issues'
  Table (1) pages do not yield all sections; from PDFs only Table (1) (all
  items and sections) is read, its five-number order (y/y, m/m, year-ago,
  current, previous) proved per issue on ALL ITEMS. All-items months still
  missing: 86, nearly all 2010-2016.
  DROPPED CELLS: July 2025's Table 1 prints B Mining's and D Electricity's
  year-ago index and y/y change as other rows' figures (580.6 vs Table 3's
  284.8; 615.7 vs Table 5's 419.3): both copies of each dropped; one
  impossible printed index (-632.8, Finished goods, Jan 2025) not read.
  Labels follow the NEWEST issue's English for each (table, Arabic label).
  CROSS-CHECK (verbatim): Aug 2026 all items 654.6 (Jul 646.2, Aug 2025
  586.7, m/m 1.3, y/y 11.6), C Manufacturing 778.9, rice 402.6; Jan 2021 all
  items 201.480529977961; Jan 2008 all items 141.9 (base 2004/2005);
  Jul 2015 all items 202.3, B 118.2; May 2019 all items 208.7, y/y 10.2.
