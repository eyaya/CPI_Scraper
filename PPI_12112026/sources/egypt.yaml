country: Egypt
iso3: EGY
indicator: PPI
tier: 2
source_type: excel
agency: Central Agency for Public Mobilization and Statistics (CAPMAS)
publication_code: "Producers Price Index (publication 87)"
frequency: monthly
expect_rows: 90000
