parser: morocco_hcp_ppi
geography: National

notes: >
  INVENTORY. One index, three generations: (1) old nomenclature (sections C
  extractives / D manufacturing / E electricity and water, divisions 11-41),
  monthly notes July 2007 - October 2013, NO BASE PRINTED (base_period blank;
  section codes kept as series_code "NMA:C" since they are not ISIC Rev.4
  letters); (2) base 2010, ISIC Rev.4 / NMA 2010 (B C D E, divisions 06-36),
  notes October 2013 - December 2020 (base printed in the notes of Nov 2013 -
  May 2018; the notes of Jan-Apr 2018 and Jun 2018 - Dec 2020 print none and
  are filed under it: same nomenclature, continuous values, and the Jan 2021
  note announces base 2018); (3) base 2018, workbooks Jan 2019 - latest
  (monthly by section and branch; annual average by section 2019-2025).
  Section C is printed as "Industries manufacturières" until Sep 2017 and as
  "... hors raffinage de pétrole" from Apr 2016 (refining stopped): two
  series, both as printed. Base-2018 notes are read only to VERIFY the
  workbooks whose sheet names are truncated before the base ("(Base 100  2"):
  their figures equal the notes' for the same label and month.
  GAPS: only September 2007 and June 2008 (old series) have no index -- the
  Sept/Oct/Dec 2007 and Jul/Dec 2008 articles carry no attachment, the others
  are covered as the next note's "previous month"; the July 2007 PDF note is
  refused (its text layer interleaves labels and numbers: 5 rows' labels do
  not match their codes). Base 2010 and base 2018 have every month.
  Base-2010 and old notes give each month and its m/m change only (no y/y).
  CROSS-CHECK (verbatim): Sept 2026 C excl. refining 119,0, chemicals 141,3,
  other manufacturing 217,1; annual 2025 C 117,7, B 100,4; July 2014 (base
  2010) C 108,6, refining 129,5; Feb 2008 (old) D 145,5*, refining 300,2,
  chemicals 191,7; Dec 2012 (old) refining 422,0.
