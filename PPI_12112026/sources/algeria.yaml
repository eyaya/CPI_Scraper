geography: National

notes: >
  INVENTORY. One Laspeyres index, base and reference 1989 (TTC), computed
  quarterly from ONS's survey of PUBLIC-sector industrial enterprises, by
  aggregate (Industries hors hydrocarbures, Industries manufacturières),
  sector (NSA 02-14) and branch (NAPR); ONS's nomenclature, not ISIC, so
  codes are kept as series_code ("NSA:02", "NAPR:07"). An indicative
  PRIVATE-sector index ("le taux de réponse est faible") is printed in the
  notes until 2016 and in compilation N° 175: a separate index_name. A page
  is filed private only under its own title ("PRIVE", also set with doubled
  letters "PPrriivvéé"); a page showing the private total "Indice Général"
  without a title is not read. 1989 weights are
  read where printed (an NSA weight is its share of total industry, a NAPR
  weight its share within its sector).
  SPAN: annual 2001-2024 (compilations + notes' annual averages), y/y annual
  2001-2022; quarterly public 2002-Q1 .. 2025-Q2 (aggregates continuous from
  2009-Q1); private quarterly 2002-Q1 .. 2016-Q2 (with gaps), annual 2001-2015.
  NOT READ (SKIPPED in the parser): the 1998-2000 notes and IPPI1t014 (no
  NSA/NAPR codes, labels wrapped across lines), and 8 notes whose variation
  header could not be paired (1T07, 4T07, 2T10, 4T10, 2T11, 4T13, 2T14,
  3T22-type splits); their quarters are mostly republished by the next
  note. Rows whose number count differs from the header (a misgrouped
  "1 2002,8" in 3T22) are dropped, never repaired. Semester / nine-month
  changes have no measure here.
  CROSS-CHECK (verbatim): 2T25 hors hydrocarbures 1 777,9 (1T25 1 761,9,
  q/q 0,9, y/y 0,1); 2T25 NAPR 20 phosphate 30 652,6; 3T12 manufacturières
  1159,1 (weight 72,40); 2022 hors hydrocarbures 1 785,1 (+13,3); 2022 NSA
  05 mines 11 286,0 (+95,9); 2001 hors hydrocarbures 829,3 (N° 175).
