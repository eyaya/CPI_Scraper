agency: Office National des Statistiques (ONS), Direction Technique chargée des Statistiques d'Entreprises et du suivi de la Conjoncture
publication_code: "Indice des prix à la production industrielle (IPPI), base et référence 1989"
frequency: quarterly
expect_rows: 12000
expect_periods: 100
# ons.dz serves an INCOMPLETE certificate chain (no intermediate). Instead of
# disabling verification (as the CPI descriptor does), this bundle holds the
# missing Sectigo intermediate (from the leaf's own AIA URL) and its root, so
# every download is verified. Path relative to the repo root.
verify_ssl: indicators/ppi/certs/ons_dz_ca_bundle.pem

# PRIMARY: the latest quarterly note (article 3106, "Indice des prix à la
# production industrielle au 2ème trimestre 2025"). EXTRAS: every document
# ONS's own site search returns for "prix à la production industrielle" /
# "IPPI" (125 articles: quarterly notes 1998-2025 and the ten-year
# "Collections Statistiques, Série E" compilations 2001-2011 .. 2013-2022),
# resolved from each spip.php?article page. Back issues never change.
