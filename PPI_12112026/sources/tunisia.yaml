notes: >
  INVENTORY. One producer price index, "prix de vente industriels" (IPVI),
  base 2010 = 100, monthly, by branch of the NAP 1986 (Ensemble, industrie
  manufacturière with its sectors and branches, mines, énergie); the notes
  also print a CTP 2002 product view (not read: same total, other grouping).
  SPAN: monthly 2015-01 .. 2019-12 by branch (workbooks; branch weights read
  as measure weight, period 2010), 2016-01 .. 2019-03 Ensemble m/m and y/y
  (notes), 2025-10 .. 2026-06 by sector (page); annual 2016 .. 2024 (page).
  GAP: monthly 2020-01 .. 2025-09 -- ins.tn lists no IPVI publication after
  March 2019 and the page keeps only the latest 9 months; the annual indices
  cover those years. Accumulates as the page is re-read (merge-on-write).
  Totals printed as ENSEMBLE / INDICE ENSEMBLE / Indice d'ensemble are one
  series. Also published, not collected: "Indice des prix à la production
  industrielle" is not a separate INS series (IPVI is it).
  CROSS-CHECK (verbatim): June 2026 Indice d'ensemble 218.5, Chimie 276.0,
  Mines 177.8; Jan 2015 industrie manufacturière 117.2 (weight 84.8);
  Dec 2019 ensemble 149.264444; March 2019 ENSEMBLE 146,8 (m/m 0,1, y/y 8,5),
  March 2018 135,3.
