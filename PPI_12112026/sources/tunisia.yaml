country: Tunisia
iso3: TUN
indicator: PPI
tier: 2
source_type: html
agency: Institut National de la Statistique (INS)
publication_code: "Indice des prix de vente industriels (IPVI), base 2010 = 100"
frequency: monthly
expect_rows: 3000
expect_periods: 70

# PRIMARY: INS's statistics page "Indices des Prix de Vente Industriels, IPVI"
# (statistiques/89): the latest 9 months by sector and the annual indices
# 2016 - latest year, as HTML tables. EXTRAS: the files attached to every IPVI
# publication INS lists (/publication/indice-des-prix-de-vente-industriels-*,
# March 2017 - March 2019): the monthly notes (PDF) and the "IPVI-Diff"
# workbooks (monthly by branch since January 2015; the 2019 final workbook).
# Downloaded with TLS verification ON (the CPI descriptor's verify_ssl: false
# was not needed for these files, 2026-11-05). The host is slow and drops
# connections: long timeout, cache.
discover:
  method: static_url
  url: "https://www.ins.tn/statistiques/89"
  save_as: Tunisia_IPVI.html
  download_timeout: 600
extras_cache: true
