# The "Data/Historical Series" link under Producer Price Index - Manufacturing
# on Statistics Mauritius' Indices page; the file name carries the quarter and
# release date (HS_PPIM_2Qtr26_280826.xlsx), so it is found by its prefix.
discover:
  method: page_scrape
  page_url: "https://statsmauritius.govmu.org/Pages/Statistics/By_Subject/Indices/SB_Indices.aspx"
  link_contains: ["HS_PPIM_"]
  base_url: "https://statsmauritius.govmu.org"

