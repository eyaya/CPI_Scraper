notes: >
  INVENTORY: INE's IPP since 2018 (old site: quarterly "Folha de Informação
  Rápida" I-II Trimestre 2018 and an annual 2017 edition, base 2015 -- listed
  in the Wayback index of www.ine.gov.ao but the PDFs are not archived);
  on the current site: quarterly issues 2020-Q4 to 2024-Q4 (base 2015=100, CAE
  2010; each prints the quarter, the previous quarter and the quarter a year
  earlier, with y/y and q/q), annual editions 2020, 2022, 2023, 2024 (yearly
  indices 2018-2024 and annual-average changes), and monthly issues from May
  2025 (base 2019=100, CAE 2019; 13-month windows from May 2024, index, m/m,
  y/y). Collected: quarterly 2019-Q4 - 2024-Q4, annual 2018-2024 (2015=100),
  monthly May 2024 - September 2026 (2019=100), by CAE section/division and
  goods category, with weights. Gap: 2019-Q1..Q3 and earlier quarters (the
  2018 issues are not archived). The "III Trimestre 2024" file repeats the II
  Trimestre 2024 tables (2023-Q2..2024-Q2); 2024-Q3 comes from the IV
  Trimestre 2024 issue. Three monthly issues print "Jan-24" (Oct-Dec 2025)
  and the September 2026 issue "Jan-25" inside a consecutive Quadro 3 header
  whose Quadros 4-5 print the right month; read as the sequence month.
  "0,0" index cells (categories with no production) are not collected.
  CROSS-CHECK (verbatim): Set-26 total 283,37, m/m 28,70, y/y 57,07; Jan-26
  173,16; 2022_T4 307,7, y/y -9,7, q/q -12,9; annual 2023 290,8, -17,6.
