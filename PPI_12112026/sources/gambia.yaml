notes: >
  INVENTORY. GBoS publishes one PPI (industrial/manufacturing producers' output,
  quarterly report with monthly indices). Base "2009 = 100" in the reports of
  2012-Q1..2017-Q3 (monthly 2011-03..2017-09); base "September 2017 = 100" from
  the March 2018 report (monthly 2017-09..2025-09, complete). The two bases have
  different baskets (2009: Cereals, Bread, Meat ... product groups; 2017:
  Stone, Sand, Processed and preserved fish ... ) and are kept as two series.
  The data portal (gbosdata.org/data/14-producer-price-index, PPPI_IX) has only
  the headline and no table export; the reports are the source.
  LAYOUTS AND PROOFS: see parsers/gambia_gbos_ppi.py. Each report's columns are
  mapped by template and proved by its own printed changes (point-to-point,
  one-month, three-month, quarterly), never by the printed month headers, which
  carry typos (Dec 2020: "Oct | Dec | Sept 2020" for Oct/Nov/Dec).
  DROPPED: the December 2021 report (its PDF table shifts every row from
  "Leather" down by one against its label; disagrees with both neighbouring
  reports on 16 industries -- its months are reprinted by March 2022); the
  September 2024 rows labelled "Non-food items" (the food aggregate is printed
  under that label as well as the non-food one); December 2024's year-ago column
  and point-to-point change (its All-items point-to-point prints 0.05 where its
  own index gives 4.87). Weights of the 2009 base are printed per ten thousand
  (All items 10000.00) and are not kept; the 2017 base's percent weights are.
  GAPS (2009 base): 2011-04/05/07..11 (only reached as year-ago columns),
  2012-07/08 All items (September 2012 prints no All-items row), 2016-10/11
  (no December 2016 report on the site).
  REVISIONS: later reports restate earlier months (March 2021 prints Oct/Nov/Dec
  2020 all as 113.2 where December 2020 printed 113.16/113.20/113.23; the
  annual-inflation table of 2014 gives December 2012 y/y 1.95 where the
  December 2012 report printed 1.82); the newest report wins.
  CROSS-CHECKS (verbatim): Sep 2025 All items 167.96, Q3 2025 quarterly
  inflation 1.34, point-to-point 4.07; Mar 2014 All items 164.84 (2009=100),
  point-to-point 16.43; Sep 2022 Clothing 196.57; Mar 2018 Stone 106.25;
  Dec 2012 Cereals 136.94; 2017 weights: Clothing 29.87, Non-food 53.30,
  All food 25.83, Drinks 17.95.
