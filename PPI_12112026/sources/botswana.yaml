notes: >
  Two indices, 2017=100: Mining (diamond, coal, gold, soda ash, salt, quarry)
  and Utilities (electricity by customer group, potable water). Headline index,
  q/q and y/y 2018-Q1 .. 2026-Q2 (no gaps); component indices 2019-Q4 ..
  2026-Q2 for mining (2023-Q1 and Q2 missing: those releases' text layers break
  the component rows) and 2025-Q4 .. 2026-Q2 for utilities (first published in
  Q1 2026); weights (reference year 2017). All 21 releases are read and the
  NEWEST value per quarter kept (heavy revisions: Mining 2019-Q2 99.2 in the
  Q2 2019 release, 84.5 later). Cross-check (verbatim, Q2 2026 release): Mining
  2026-Q2 93.4, q/q -12.9, y/y -21.1; Diamond 90.7; Utilities 138.0; Electricity
  -- Government 170.7; (2020 release) Diamond 2020-Q1 71.8, Gold 2020-Q4 179.4;
  Mining 2018-Q1 88.1. Identity: the six mining group weights sum to 100.0, and
  the validator's y/y guard holds on every quarter. "Portable Water" and
  "Bussiness & Industrial" are Statistics Botswana's spellings.
