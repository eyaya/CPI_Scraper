country: South_Africa
iso3: ZAF
indicator: PPI
tier: 2
source_type: excel
agency: Statistics South Africa (Stats SA)
publication_code: P0142.1 Producer price index -- time-series archive (2000=100)
frequency: monthly
expect_rows: 85000
expect_periods: 500

# Stats SA's own time-series zip, fetched as a Wayback `id_` copy: statssa.gov.za
# now answers every request (pages AND the timeseriesdata files the CPI
# descriptor probes) with an Incapsula bot challenge (2026-11-05), which is
# never bypassed. The archive is read whole (`unzip: false`).
discover:
  method: static_url
  url: "http://web.archive.org/web/20250529095035id_/https://www.statssa.gov.za/timeseriesdata/Excel/P0142.1%20PPI%20to%202012%20-%20discontinued.zip"
  save_as: statssa_ppi_to_2012_discontinued.zip
  unzip: false
  download_timeout: 600

parser: south_africa_statssa_ppi
geography: Total country

notes: >
  Stats SA P0142.1, base 2000=100, 1970-01..2012-12. The DISCONTINUED 2000=100 series, 1970-2012, four SAS-HTML workbooks (1970-79, 1980-89, 1990-99, 2000-12). Collected: domestic output of SA industry groups (output), output for SA consumption (domestic_market), exported (export) and imported (import) commodities. NOT collected: 'Commodities for South African consumption' -- the headline PPI before 2012 -- whose kind (domestic output + imports for local consumption) has no INDEX_VARIANT yet (the parser takes it as soon as 'domestic_consumption' exists); 'selected materials' / 'materials used in certain industries' (input-price indices). 666 cells printed 0.0 for months a series was not compiled are skipped. Cross-check (verbatim): domestic output All groups 1970-01 4.1, 2000-01 96.3, 2000-02 96.9; Agriculture 1970-01 6.0. Identity: the 2000 average of all 362 collected series is 100.0 (+-0.15).
  Every edition re-references the whole history to its own base and all are
  kept (base_period is in the merge key); the series_id carries the base, so
  each base is its own series. Inventory of bases: 2000=100 (to 2012), 2012=100
  (editions to Dec 2016), Dec 2016=100 (2017-03 .. 2020-09), Dec 2020=100
  (2021-09 .. 2022-12), Dec 2023=100 (2026-06, current).
