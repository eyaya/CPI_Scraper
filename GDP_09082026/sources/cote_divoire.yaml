country: Cote_dIvoire
iso3: CIV
indicator: GDP
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Agence Nationale de la Statistique (ANStat)
frequency: quarterly
verify_ssl: false

# --- discover ---
# anstat.ci is a SPA; its searchPublicationByCritere endpoint lists publication
# cards. We take the newest 'Comptes Nationaux Trimestriels' card whose PDF
# (File_val_indicateur<id>.pdf) is actually available (the very newest card is
# often listed before its file is uploaded).
discover:
  method: anstat_ci_publication
  search_url: "https://anstat.ci/publication/searchPublicationByCritere"
  file_base: "https://anstat.ci/assets/publications/files"
  title_contains: "COMPTES NATIONAUX TRIMESTRIELS"

# ANNUAL back series (extras; parsers/ci_ins_annual.py): the former INS's own
# national-accounts workbooks. ins.ci is offline, so these are Wayback `id_`
# copies of the INS files themselves. Three vintages, none chained: 1996-2015
# synthesis (SNA 2008 base 2015 retropolated AND SNA 1993 base 1996
# definitive, side by side), 2015-2022 accounts (2021 definitive, 2022
# provisional), 1996-2016 constant 2009 prices. A fourth file
# (compte_nationaux_2019.xls) has only a corrupt capture and is not used.
# anstat.ci itself now sits behind a Cloudflare challenge (2026-10-13): the
# quarterly discovery above will fail until it is lifted; not bypassed.
extras_cache: true
extra_urls:
  - url: "https://web.archive.org/web/20231028063213id_/http://www.ins.ci/documents/cnt/SYNTHESE%20DES%20COMPTES%20NATIONAUX%201996_2015%20RETROPOLES.xlsx"
    save_as: "INS_CI_Synthese_Comptes_Nationaux_1996_2015_retropoles.xlsx"
  - url: "https://web.archive.org/web/20240906122516id_/https://www.ins.ci/documents/compte_nationaux_2021CD_2022CP.xlsx"
    save_as: "INS_CI_comptes_nationaux_2021CD_2022CP.xlsx"
  - url: "https://web.archive.org/web/20211123011254id_/http://www.ins.ci/documents/ComptesNationauxAnnuel_prix2009.xlsx"
    save_as: "INS_CI_ComptesNationauxAnnuel_prix2009.xlsx"


# FALLBACK (2026-10-14): anstat.ci serves a bot-challenge page to every client, which
# is not bypassed. When live discovery fails, the run reads the copy of the
# last-discovered primary retained in source_data/ (recorded with its published
# URL) so the back-series extras can still be read. Live discovery is always
# tried first.
fallback:
  discover:
    method: retained_copy
    url: "https://anstat.ci/assets/publications/files/File_val_indicateur1774993334.pdf"
parser: ci_anstat_gdp
geography: National

notes: >
  ANStat Côte d'Ivoire quarterly national-accounts (CNT) PDF. GDP by branch of
  activity (production approach), from two annex tables: 'PIB CVS trimestriel en
  volume' (constant chained volume, reference 2015, seasonally adjusted) and 'PIB
  trimestriel en valeur' (current prices, with an annual TOTAL column per year).
  We emit the value LEVELS (8 quarters + annual totals for the current table);
  history accumulates across quarterly notes. Two headline aggregates are
  published: 'PIB' (market prices) and 'PIB au coût des facteurs'. Units billion
  XOF (FCFA); French number format. Verified: PIB (market) 2024 current = 52.8tn
  FCFA. The contribution-to-growth tables and the % variation columns are left for
  a later pass. Everything as published; nothing derived.
