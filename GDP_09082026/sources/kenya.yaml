country: Kenya
iso3: KEN
indicator: GDP
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Kenya National Bureau of Statistics (KNBS)
frequency: quarterly
verify_ssl: false            # KNBS serves an incomplete TLS certificate chain

# --- discover ---
# KNBS lists the quarterly GDP report PDFs newest-first on its quarterly-GDP page;
# we scrape the first 'Quarterly-Gross-Domestic-Product … .pdf' link.
discover:
  method: page_scrape
  page_url: "https://www.knbs.or.ke/quarterly-gdp/"
  link_contains:
    - "Quarterly-Gross-Domestic-Product"
    - ".pdf"

# ANNUAL back series (extras; parsers/kenya_knbs_annual.py and
# kenya_knbs_abstract_pdf.py). Each edition is its own vintage: Kenya rebased in
# 2014 (2001 -> 2009) and 2021 (2009 -> 2016) and each rebasing revised current-
# price levels too, so `category_group` names the edition and table, and
# constant levels carry their own base. Nothing is chained. The 2009-2011
# Abstracts are image scans (no text layer) and are not read (no OCR).
extras_cache: true
extra_urls:
  - url: "https://www.knbs.or.ke/wp-content/uploads/2025/02/National-Accounts.xlsx"
    save_as: "KNBS_Statistical_Abstract_2024_National_Accounts.xlsx"   # 2014-2023, 2016 prices
  - url: "https://www.knbs.or.ke/wp-content/uploads/2023/09/2018-Statistical-Abstract.pdf"
    save_as: "KNBS_Statistical_Abstract_2018.pdf"                      # 2011-2017, 2009 prices
  - url: "https://www.knbs.or.ke/wp-content/uploads/2023/09/2013-Statistical-Abstract.pdf"
    save_as: "KNBS_Statistical_Abstract_2013.pdf"                      # 2007-2012, 2001 prices

parser: kenya_knbs_gdp
geography: National

notes: >
  KNBS Quarterly GDP report (Tier 3 PDF). The statistical-annex tables are rendered
  MIRROR-REVERSED (every token stored right-to-left); the parser reverses each
  token, then reads the by-activity grid where each year-column cell packs that
  year's quarters (visual Q1..Q4, which the whole-cell reversal flips to Qn..Q1, so
  the newest partial year's single value is Q1). Tables: 1 current prices, 2
  constant 2016 prices, 3 growth rates (real). Production/by-activity approach
  (Agriculture … plus All Industries at basic prices, Taxes on products, FISIM,
  GDP at market prices, and the seasonally-adjusted GDP series); no expenditure
  approach in this report. Units KES million (levels) / percent (growth). Verified:
  nominal GDP-at-market 2024 = KSh 16.23tn, real (constant 2016) = KSh 10.9tn,
  real growth 2024-Q4 = 5.4%. Everything as published; nothing derived.
