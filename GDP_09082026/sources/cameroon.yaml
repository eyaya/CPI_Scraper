country: Cameroon
iso3: CMR
indicator: GDP
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique (INS)
frequency: quarterly
verify_ssl: false

# --- discover (two hops) ---
# INS publishes a quarterly national-accounts analysis note; the statistics page
# lists each release ('les-comptes-nationaux-<Ne>-trimestre-<year>'), and the note
# page hosts the CNT PDF (Note-danalyse-CNT_T<n>_<year>.pdf). We take the first
# (newest) such note page and its PDF.
discover:
  method: two_hop_scrape
  index_url: "https://ins-cameroun.cm/statistique/"
  page_link_contains:
    - "comptes-nationaux"
    - "trimestre"
  file_link_contains:
    - "CNT"
    - ".pdf"

# BACK ISSUES (INS media library, 2014 onward). Each note prints six quarters;
# the parser reads newest first and takes from each note only the quarters no
# newer note gave, tagged in category_group. 2012-2016 notes in an older layout
# (CNT-4T2012, T4_2013, T4_2014, T3_2015, T4_2016) are not read -- the parser
# refuses them -- so 2015-Q2..2016-Q1 is a gap. Immutable, cached when complete.
extras_cache: true
extra_urls:
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/CNT_INS_Cameroun_T1_2015.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/CNT_T2_2017.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_Analyse_CNT_T4_2020_Revision_10_-mai_-2021_Final-1.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_analyse_CNT_T3_2017.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_d_analyse_des_CNT_T1_2019_final.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/07/Note_danalyse_CNT_T1_2023_F.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/07/Note_danalyse_CNT_T1_2024_Final.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_danalyse_CNT_T3_2018_version_du_18_01_2019.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/07/Note_danalyse_CNT_T3_2020.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_danalyse_CNT_T3_2021.pdf"
  - url: "https://ins-cameroun.cm/wp-content/uploads/2025/06/Note_danalyse_CNT_T4_2021.pdf"

parser: cameroon_ins_gdp
geography: National

notes: >
  INS Cameroun quarterly 'Note d'analyse CNT'. The annex tables give the quarterly
  GDP (PIB) breakdown by branch/sector (production) and by expenditure component,
  at current prices and in chained-volume constant prices, both gross (brut) and
  seasonally/working-day adjusted (CVS-CJO). We emit the value LEVELS (six quarters
  per note; history accumulates across notes), in billion XAF (FCFA). Verified: PIB
  current 2025 = 34.4tn FCFA (nominal), constant chained-volume = 26.6tn. Numbers
  use French formatting (space thousands, comma decimal). The YoY/QoQ growth blocks
  differ between the brut (T/T-4) and CVS-CJO (T/T-1) tables, so growth is left for
  a later pass to avoid mislabelling. Everything as published; nothing derived.
