country: Central African Republic
iso3: CAF
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Ministère des Finances et du Budget, Direction de la Dette Publique et Extérieure (DDPE), Central African Republic
publication_code: Bulletin statistique de la dette publique (trimestriel)
frequency: quarterly
verify_ssl: false
coverage: "Dette publique de l'Etat (DDPE; entreprises publiques et Mairie de Bangui publiées séparément)"

# --- discover ---
# finances.gouv.cf/finances/Dette%20publique lists every bulletin as a Drupal
# file under /sites/default/files/<YYYY-MM>/, but the file NAMES follow no
# pattern ("Bul.Stat_.T3-2024.pdf", "RCA T2 DEF  Bulletin_Statistique_ Revisé
# 03092026.pdf"), and no existing discovery method sorts by the upload folder.
# Pinned to the newest (T2 2026, revised 3 Sept 2026); update when the next
# bulletin is posted. Earlier bulletins use a different table layout, which
# the parser refuses rather than misreads.
discover:
  method: static_url
  url: "https://www.finances.gouv.cf/sites/default/files/2026-09/RCA%20T2%20DEF%20%20Bulletin_Statistique_%20Revis%C3%A9%2003092026.pdf"
  save_as: RCA_Bulletin_Statistique_Dette_T2_2026.pdf

parser: central_african_republic_ddpe_debt
geography: National

notes: >
  DDPE quarterly bulletin, 2026 layout: Tableau 3 stock (encours + arriérés)
  and Tableau 2 encours, each by creditor class / domestic instrument with
  shares, for the previous and current quarter (milliards FCFA); Tableau 1
  debt-to-GDP. The bulletin's own figures differ by a last digit between
  tables (515,81 vs 515,82); sums are checked to 0,15 milliard.
  CROSS-CHECK T2 2026: total stock 1 136,53 (61,20% of GDP).
