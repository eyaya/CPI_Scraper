country: Mauritius
iso3: MUS
indicator: Public_Debt
tier: 2
source_type: excel
agency: Ministry of Finance, Mauritius (Public Debt Management Unit)
publication_code: Quarterly Public Sector Debt Statistics (QPSDS), Table 1
frequency: quarterly
verify_ssl: false
# Table 1 builds the public sector up in layers and the parser sets coverage PER
# ROW (Budgetary Central Government, Extra Budgetary Units, Central Government,
# Local Government, Rodrigues Regional Assembly, General Government, Public
# Corporations, Public Sector). This default only fills a row a parser leaves
# blank -- it never does here.
coverage: "Public Sector (per-row perimeter set by the parser)"

# --- discover ---
# mof.govmu.org/Pages/Debt-Data.aspx links every quarterly workbook, NEWEST
# FIRST ("QPSDS June2026.xlsx", "QPSDS Mar2026.xlsx", "qpsds Dec 2025.xlsx",
# ...). Each workbook carries the whole history back to June 2003, so the
# newest one is all that is needed; merge-on-write keeps any revision.
discover:
  method: page_scrape
  page_url: "https://mof.govmu.org/Pages/Debt-Data.aspx"
  link_contains:
    - "qpsds"
    - ".xlsx"

parser: mauritius_mof_debt
geography: National

notes: >
  Ministry of Finance QPSDS, Table 1 "Public Sector Debt", Rs million and % of
  GDP (cells stored as fractions under a 0.0% format; emitted as the displayed
  percent). End-June 2003-2007, then quarterly from June 2008 to the latest
  quarter; newest columns flagged Provisional.

  NOT COLLECTED: consolidation adjustment (a negative adjustment), cash and
  equity deduction, GDP memo row, "Note 6/8" placeholders (net debt computed
  only Sept 2015 - June 2025); Tables 1a-20.

  CROSS-CHECK (Jun 2026): public sector debt after consolidation 669,635.86
  (86.2% of GDP); BCG total 615,813 (79.3%); Jun 2003 BCG total 96,121 (62.5%).
