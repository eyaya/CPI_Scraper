country: South Sudan
iso3: SSD
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Ministry of Finance and Planning (MoFP), South Sudan
frequency: annual
coverage: "Central government domestic debt (all held by the Bank of South Sudan)"
verify_ssl: false

# --- discover ---
# mofp.gov.ss is WordPress; /wp-json/wp/v2/media?search=debt lists the 2025
# Debt Policy and Medium-Term Debt Strategy report (uploaded 2025-06-26).
discover:
  method: wp_media_named
  api_url: "https://mofp.gov.ss/wp-json/wp/v2/media?search=debt&per_page=50"
  name_contains: "Debt-Policy-and-Medium-term-Debt-Strategy"
  extension: ".pdf"
  download_timeout: 300

parser: south_sudan_mofp_debt
geography: National

