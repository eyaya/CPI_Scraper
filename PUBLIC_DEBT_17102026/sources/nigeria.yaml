country: Nigeria
iso3: NGA
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Debt Management Office (DMO), Nigeria
publication_code: "Nigeria's Total Public Debt as at <date> (quarterly)"
frequency: quarterly
coverage: "Public debt of the Federal Government, 36 States and FCT (row labels state each component's own perimeter)"
verify_ssl: false

# --- discover ---
# dmo.gov.ng/debt-profile/total-public-debt lists one single-page PDF per
# quarter (newest first, 20 per page, ?limit=20&limitstart=N). Each link is
# /<id>-<slug>/file and the id rises with every upload, so the newest report
# is the largest id among "public-debt" links (Eurobond price sheets on the
# same page carry no "public-debt" in their slug). The DMO's WAF refuses a
# short user-agent as "Malware detected"; the harness's full browser UA passes.
discover:
  method: largest_id_link
  page_url: "https://www.dmo.gov.ng/debt-profile/total-public-debt"
  link_contains:
    - "public-debt"
    - "/file"
  save_as: nigeria_dmo_total_public_debt_latest.pdf

