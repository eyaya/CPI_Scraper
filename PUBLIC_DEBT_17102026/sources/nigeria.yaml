parser: nigeria_dmo_debt
geography: National

notes: >
  DMO quarterly Total Public Debt reports, December 2012 to the latest quarter
  (55 quarters as of 2026-Q2): stocks in US$ and N (as printed: millions;
  September 2023 in US$ billion and N trillion) and, from late 2018, each
  component's % of total. Labels kept as printed -- the perimeter of "Total"
  changed (June 2013 "Total" = FGN external + FGN domestic only, excluding
  states' domestic debt; from 2014 "Grand-Total (A+B)" adds states' domestic
  debt; from December 2018 "Total Public Debt (A+B)" covers FGN + 36 States +
  FCT, external and domestic). States' domestic debt is often as at an earlier
  date than the quarter (each report's footnote).

  NOT COLLECTED: state-by-state stocks (the DMO's separate sub-national
  reports; the schema has no geography column and the series is not needed
  for the national total). Debt service.

  CROSS-CHECK: 2026-Q2 total US$120,932.71m / N166,788,480.19m; 2013-Q2
  "Total" US$50,905.65m; 2022-Q4 domestic FGN N22,210,364.60m; 2018-Q1
  "Total (A+D)" N22,707,203.79m. External + domestic = total holds in every
  quarter that prints all three.
