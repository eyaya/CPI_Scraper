country: Kenya
iso3: KEN
indicator: Public_Debt
tier: 2
source_type: csv
agency: Central Bank of Kenya (CBK)
publication_code: Government Finance Statistics -- Domestic Debt by Instrument (CSV)
frequency: monthly
coverage: "Government domestic debt, gross (perimeter not stated by CBK)"
verify_ssl: false

# --- discover ---
# Same page as kenya.yaml. It links TWO "Domestic Debt by Instrument" files:
# the current one first (to 2026-08 when checked 2026-10-08) and an older
# vintage below it (to 2026-06, different "other domestic debt"). find_download
# _link returns the FIRST match, which is the current file.
discover:
  method: page_scrape
  page_url: "https://www.centralbank.go.ke/statistics/government-finance-statistics/"
  link_contains:
    - "domestic debt by instrument"
    - ".csv"
  save_as: CBK_Domestic_Debt_by_Instrument.csv

parser: kenya_cbk_debt
geography: National

notes: >
  CBK domestic debt by instrument (KSh million), monthly from 1999-09:
  Treasury bills (incl. frozen government debt), Treasury bonds, Government
  stocks, overdraft at CBK, advances from commercial banks, other domestic
  debt, total (gross -- includes IMF funds on-lent by CBK to Government from
  June 2023, per CBK's footnote). Instruments sum to the total, checked every
  month. CROSS-CHECK: 2026-08 Treasury bonds 6 365 634.08, total 7 676 024.025.
