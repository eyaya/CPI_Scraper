country: Ghana
iso3: GHA
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Bank of Ghana (BoG)
publication_code: Summary of Economic and Financial Data (bi-monthly), Public Debt block
frequency: monthly
# Each issue states (or omits) its own perimeter in a footnote; the parser
# sets coverage per row from that footnote. This default is used only if a
# row arrives without one.
coverage: "Public debt (perimeter not stated in this BoG issue)"
verify_ssl: false

# --- discover ---
# A SECOND Ghana descriptor beside sources/ghana.yaml (GSS StatsBank). BoG's
# WordPress media API lists every upload; wp_media_latest takes the newest
# "Summary-of-Economic-and-Financial-Data-<Month>-<YYYY>.pdf" by the month and
# year in its FILE NAME (the /uploads/<y>/<m>/ path is the upload date, and the
# companion "...Charts..." PDFs do not match the name).
discover:
  method: wp_media_latest
  api_url: "https://www.bog.gov.gh/wp-json/wp/v2/media?search=Summary%20of%20Economic%20and%20Financial%20Data&per_page=100"
  name_contains: "Summary-of-Economic-and-Financial-Data"
  lang: en

