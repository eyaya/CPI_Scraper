parser: ghana_bog_debt
geography: National

notes: >
  Bank of Ghana, Summary of Economic and Financial Data, "Public Debt" block:
  total public debt (USD and GHC billion, % of GDP), external debt (USD, GHC,
  % of GDP), domestic debt (GHC, % of GDP), monthly, March 2016 to the latest
  issue. A SEPARATE series from GSS StatsBank (sources/ghana.yaml): own
  publisher, units and series_code; never chained.

  COVERAGE IS PER ISSUE, from each issue's footnote: "excluding ESLA bonds"
  (2021-22), "Central Government debt excluding SOE/SPV debt" (2023),
  "including SOE/SPV debt" (2024); recent issues state none. The same month
  under two definitions is kept twice, told apart by coverage.

  CROSS-CHECK: 2026:07 total USD 62.8bn / GHC 733.9bn / 45.9% of GDP;
  domestic GHC 396.7bn (September 2026 issue). 2024:06 total GHC 742.0bn
  incl. SOE/SPV (July 2024 issue) vs 744.8bn perimeter not stated (July 2025).
