country: Tunisia
iso3: TUN
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Ministère des Finances, Tunisie (D.G.R.E.) — Résultats provisoires de l'exécution du Budget de l'Etat
frequency: monthly
coverage: "Dette publique (Etat) -- the State-budget bulletin's 'Encours de la Dette Publique', as published by the Ministère des Finances"
verify_ssl: false

# --- discover ---
# finances.gov.tn (Drupal) lists every download newest first at /fr/telechargement
# (the title filter is ignored; the list is the whole catalogue, 100+ pages).
# The monthly bulletin is "Résultats provisoires de l'exécution du Budget à fin
# <mois> <année>"; the first such link is the newest issue.
discover:
  method: page_scrape
  page_url: "https://www.finances.gov.tn/fr/telechargement?title=provisoires&field_secteur_et_domaines_target_id=All"
  link_contains:
    - "provisoires"
    - ".pdf"
  save_as: tn_mof_resultats_provisoires_latest.pdf
  download_timeout: 300

# Back issues (catalogue pages 0-3, 2023-10 .. 2025-11). Each issue prints the
# current and previous month for this year and last, plus past year-ends, so
# together they give the monthly series; merge-on-write keeps it. "BULLETIN MAI
# 2025" is a scan with no text layer and is left out; January issues head their
# columns in Arabic only and are skipped by the parser with a message.
# finances.gov.tn is heavily throttled (~2 MB per 5-7 min); the 25 back issues
# never change, so complete copies already on disk are reused (core/run.py).
extras_cache: true

