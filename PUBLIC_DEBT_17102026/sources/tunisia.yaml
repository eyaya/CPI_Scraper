geography: National

notes: >
  Ministère des Finances monthly budget bulletin, page "Public debt / Dette
  publique", section II "Encours de la Dette Publique" (MDT = TND million):
  outstanding public debt and its % of GDP, domestic and foreign debt and
  their % shares. Columns dated from the bulletin's own header geometry
  ("End <month>" groups = monthly; LF/LFR budget-forecast columns never
  collected; unlabelled right-hand columns = past year-end outturns).
  Checked every issue: domestic + foreign = total and shares sum to 100.

  CROSS-CHECK (December 2025 issue): encours end-Dec 2025 141 665,4 MDT
  (82,1% of GDP); domestic 86 178,0 (60,8%); foreign 55 487,3 (39,2%);
  end-2022 114 895,7.
