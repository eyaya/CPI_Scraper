# --- discover ---
# finances.gouv.td answers 404 to every path (2026-10-14). WAYBACK id_ COPIES
# of the ministry's own K2 attachments (item 689/690, "Bulletin statistique de
# la dette publique quatrième trimestre 2023"). Only four attachments were
# archived; the 2021 and 2024-2025 bulletins' PDFs were not.
discover:
  method: static_url
  url: "https://web.archive.org/web/20250712190939id_/http://finances.gouv.td/index.php/component/k2/item/download/423_c4505b3159ff26bf4ae7165241724e1a"
  save_as: DD_bulletin_2023_T4.pdf
  download_timeout: 300

extras_cache: true
extra_urls:
  # item 624 "Bulletins statistiques de la dette n°2 et 3 2020" (n°2 only archived)
  - url: "https://web.archive.org/web/20210501094112id_/https://finances.gouv.td/index.php/component/k2/item/download/335_32b0092eee024838b53b1073c98f5022"
    save_as: DD_bulletin_2020_T2.pdf
  # item 611 "Bulletin statistique ... du premier trimestre 2020"
  - url: "https://web.archive.org/web/20201031103249id_/https://finances.gouv.td/index.php/component/k2/item/download/293_fdb92fd5e3d1faa84b841deaca0bee85"
    save_as: DD_bulletin_2020_T1.pdf
  # item 612 "Rapport de gestion de la dette pour l'exercice 2019"
  - url: "https://web.archive.org/web/20201031103048id_/https://finances.gouv.td/index.php/component/k2/item/download/294_4404dc3c6e8828abd027506593f54863"
    save_as: DD_rapport_gestion_2019.pdf

parser: chad_dd_debt
geography: National

notes: >
  The Treasury's Direction de la Dette, beside chad.yaml (INSEED yearbook
  ratios 2023-2024). Three tables, each its own series code, never chained:
  the 2019 report's Tableau 8 (encours 2016-2019, by creditor and instrument,
  with debt ratios); the 2020 bulletins' encours table (2019-Q1..2020-Q2); the
  Q4 2023 bulletin's Tableau 1.1 (stock = encours + arrears, 2021-2022 and
  2023 Q1-Q4, FCFA and USD). See the parser. CROSS-CHECK: end-2019 dette
  publique 2 797,3 milliards FCFA (41,6 % of GDP); end-2023 stock 3 327,8.
