country: Chad
iso3: TCD
indicator: Public_Debt
tier: 3
source_type: pdf
agency: "Ministère des Finances et du Budget, Direction Générale des Services du Trésor et de la Comptabilité Publique -- Direction de la Dette (DD), Chad"
publication_code: Bulletin statistique de la dette publique (trimestriel) + Rapport de gestion de la dette (annuel)
frequency: quarterly
verify_ssl: false
