country: Benin
iso3: BEN
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Caisse Autonome de Gestion de la Dette (CAGD), Ministère de l'Economie et des Finances
publication_code: Bulletin statistique de la dette publique (trimestriel)
frequency: quarterly
verify_ssl: false
# Tableau 1's "Encours dette publique" -- the debt the CAGD manages for the
# State. Guarantees, SOE bank debt and on-lent loans are shown separately in
# the bulletin and are not part of this total.
coverage: "Dette publique gérée par la CAGD (hors garanties et dette des entreprises publiques)"

# --- discover ---
# Each issue is a post under /category/dette-publique/bulletin-statistique-de-la-dette/
# whose PDF sits inside an embedded viewer (viewer.html?file=...) -- not an
# anchor, so page_scrape/two_hop_scrape cannot see it. Pinned to the newest
# issue; on a new quarter, open the newest post and copy the file= URL.
discover:
  method: static_url
  url: "https://www.cagd.bj/wp-content/uploads/2026/08/Bulletin-statistique-dette-publique-2eme-Trimestre-2026_06.08.2026.pdf"
  save_as: BJ_CAGD_bulletin_dette_T2_2026.pdf


# BACK ISSUES (cagd.bj wp/v2/media listing, 2026-10-14): one French issue per
# quarter from 2020-Q2, read by the parser's layout-B reader (quarterly
# windows of up to 8 quarters, stocks + debt/GDP). Newest issue wins on
# overlap. Not listed: the English editions; issues before 2020-Q2 (different
# Tableau 1); 2023-Q1/Q2 and 2025-Q3/Q4 (not posted); 2024-Q2 (both copies
# print a different row set) and 2021-Q3 (its foreign-currency rows do not
# sum to the printed total) -- every quarter of those windows is printed by a
# neighbouring issue.
extras_cache: true
