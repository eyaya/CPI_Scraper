country: Togo
iso3: TGO
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Direction de la Dette Publique et du Financement (DDPF), Direction Générale du Trésor et de la Comptabilité Publique (DGTCP), Ministère de l'Economie et des Finances
publication_code: Bulletin statistique de la dette de l'Administration centrale (trimestriel) + Rapport analytique de la dette publique (annuel)
frequency: quarterly
verify_ssl: false
coverage: "Dette de l'Administration centrale (intérieure et extérieure)"

# --- discover ---
# The Treasury's site (tresorpublic.gouv.tg, WordPress) posts each quarterly
# bulletin as a media item "BULLETIN-STATISTIQUE-DE-FIN-<MOIS>-<YYYY>-...pdf";
# the newest is taken by the month and year in its filename.
discover:
  method: wp_media_latest
  api_url: "https://tresorpublic.gouv.tg/wp-json/wp/v2/media?search=BULLETIN-STATISTIQUE-DE-FIN&per_page=100"
  name_contains: "BULLETIN-STATISTIQUE-DE-FIN"
  lang: fr
  download_timeout: 300

# BACK ISSUES (same site, wp/v2/media listing, 2026-10-14): every quarterly
# bulletin from 31 March 2020 (30 June 2020 is not posted; the 1st-semester
# 2019 bulletin and one Dec-2024 copy are dead links), plus the annual
# "Rapport analytique de la dette publique", 2019-2025 editions. Saved under
# dated names: the parser reads them oldest first, so the newest issue wins.
extras_cache: true
