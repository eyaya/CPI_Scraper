geography: National

notes: >
  Successor of togo.yaml's 2013-2017 DDPF bulletin, same directorate, own
  series codes. Quarterly: Tableau 3 (QPDS Tableau 4) gross total, by currency
  and by creditor residence, XOF million, 2019-Q1 onward. Annual: the reports'
  "Situation de la dette" table, total / external / domestic, FCFA milliards,
  2017 onward. Instrument/maturity rows not read (cells wrap and merge in the
  text layer). PINNED: 2023-Q2/Q3 "Dette brute totale" misprinted as the
  local-currency figure in four issues (see parser). CROSS-CHECK: 30 June
  2026 gross debt 4 458 115,04 XOF million; end-2025 4 312,64 milliards.
