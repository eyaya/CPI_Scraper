notes: >
  MoF Quarterly Debt Bulletins, SCR million: Table 1 by residency (domestic /
  external, each split government / guaranteed) with the current quarter's
  % of GDP; Table 2 by guarantee status; external debt by creditor category
  and by instrument; domestic debt by instrument. Q4 2020 - Q4 2024 (each
  issue prints the previous and the current quarter). "% Diff" columns are
  computed changes and not collected. Tables found by caption (numbering
  shifts in Q4 2021). Domestic instrument labels changed over time ("Treasury
  Bills" in early issues, "T-bills" later) and are kept as printed.

  PINNED MISPRINT: Q1 2024 Table 2 prints Total Debt 17,873 against its own
  parts and Table 1 (17,918).

  CROSS-CHECK: Q4 2024 total 18,885 (60.8% of GDP), external 9,604,
  multilateral 7,829; Q1 2021 total 20,024 (89.5% of GDP).
