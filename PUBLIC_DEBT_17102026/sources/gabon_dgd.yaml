country: Gabon
iso3: GAB
indicator: Public_Debt
tier: 3
source_type: pdf
agency: Direction Générale de la Dette (DGD), Ministère de l'Economie, des Finances, de la Dette et des Participations, Gabon (dette.ga)
publication_code: Situation à fin <mois> (rapport statistique mensuel), page "Résumé encours de la dette publique" (SYGADE)
frequency: monthly
verify_ssl: false
coverage: "Dette publique (DGD/SYGADE): extérieure, garantie et directe, et intérieure"

# --- discover ---
# dette.ga (Drupal) lists the monthly reports one year per page
# (/publications/rapport-statistique/<YYYY>); the 2026 page is still empty.
# Pinned to the newest posted (fin novembre 2025); on a new month, copy its
# link from the current year's page and move this one into extra_urls.
discover:
  method: static_url
  url: "https://dette.ga/sites/default/files/2025-12/11%20SITUATION%20A%20FIN%20NOVEMBRE%202025.pdf"
  save_as: DGD_situation_2025_11.pdf
  download_timeout: 300

