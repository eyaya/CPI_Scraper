parser: gabon_dgd_debt
geography: National

notes: >
  The DGD's own compilation, beside gabon.yaml's INSTAT yearbook reprint
  (2016-2020, annual, own series code). Read: the SYGADE stock summary page
  of each monthly report -- G.TOTAL, EXTERIEURE (GARANTIE / DIRECTE or NON
  GARANTIE, by creditor class), INTERIEURE (by instrument), XAF million at the
  month-end rate, component = the printed path. Every page reconciles node =
  sum of parts; pinned exceptions: 2017-06 INTERIEURE misprint, Mar-Dec 2022
  commercial sub-split. Debt service (the reports' other pages) not read.
  CROSS-CHECK: 30/11/2025 G.TOTAL 8 547 237,70 (EXTERIEURE 4 201 521,96;
  INTERIEURE 4 345 715,74); 31/12/2010 G.TOTAL 1 291 218,52.
