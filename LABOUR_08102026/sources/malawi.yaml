notes: >
  Malawi NSO 2018 census economic activity (Series D tables). Three topics:
  activity status (Table D1 — of the 15-64 population, the economically active and
  the employed, by sex), industry (Table D7) and occupation (Table D9) of the
  employed. National level. Adds a 2nd country to labour (with Ghana), with industry
  and occupation aligning to Ghana's topics. Deferred: the urban/rural and
  age-group tables (D2-D6, D8) and the derived unemployment rate.
