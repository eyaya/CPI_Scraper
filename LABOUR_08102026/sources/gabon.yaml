parser: gabon_labour
geography: Total country

notes: >
  RGPL-2013 Résultats globaux, chapter 5.4: Tableau 71 situation dans
  l'occupation (employment_status) and Tableau 72 secteur institutionnel
  (sector), shares of the employed aged 16-65, by milieu and sex. Columns are
  Gabon | Urbain | Rural | Hommes | Femmes (settled by the Effectif rows).

  "Non déclaré" is 10,0% of status and 11,2% of sector (20,9% rural sector),
  flagged by the report itself as high. Collected as published.

  NOT COLLECTED: Effectif rows (levels); activity-status tables 64-70. No
  occupation or branch table in this volume. Formal-employment bulletins
  (payroll) and EGEP 2017 (no composition tables) considered and rejected.

  CROSS-CHECK: employé rémunéré 56,4; privé 34,3; public État 19,6.
