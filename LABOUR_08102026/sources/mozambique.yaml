notes: >
  INE IOF 2022 (household budget survey, twelve months of collection, weights
  at 1 July 2022), chapter 6: Quadro 6.5 ramos de actividade económica (10
  groups -> industry) and Quadro 6.6 posição no processo laboral (11
  categories, status crossed with the employer's sector -> employment_status),
  each as the distribution of the employed 15+ within each group: Total, sex,
  urban/rural, 11 provinces (Maputo province and Cidade de Maputo separately),
  education. National groupings (the methodology codes ramos with CAE Rev.2,
  but the tables print ten aggregates under no scheme name).

  ROTATED HEADERS: the column names extract reversed and interleaved; they are
  re-read from page geometry every run and must equal the published list.

  NOT COLLECTED: the N columns (employed levels, `unemployment`'s territory).
  They also disagree between the two tables for education "Desconhecido"
  (81 369 vs 37 138) and "Nunca frequentou escola" (2 854 968 vs 2 899 198).
  Quadros 6.1-6.4 and 6.7+ are rates. Anuário labour tables are administrative
  (registered unemployed, INEFP) and rejected. No INE labour force survey
  exists more recently.

  CROSS-CHECK: agricultura, silvicultura e pesca 74,7 (rural 89,2); urban
  comércio e finanças 21,0; conta própria sem empregados 72,0; nível superior
  in administração pública 64,1.
