country: Uganda
iso3: UGA
indicator: MPI
tier: 3
source_type: pdf
agency: Uganda Bureau of Statistics (UBOS)
publication_code: NPHC 2024 Monograph Volume 5
frequency: ad_hoc
verify_ssl: false
expect_metrics: 3

# --- discover ---
# NOTE THE HOST. The census monographs live on statistics.ubos.org, a DIFFERENT
# host from www.ubos.org where UBOS's other publications sit. The listing at
# statistics.ubos.org/nphc/report carries absolute PDF URLs for all 19 census
# reports plus the monographs.
#
# www.ubos.org serves an incomplete TLS chain; verify_ssl is off for both hosts.
discover:
  method: static_url
  url: "https://statistics.ubos.org/nphc/monographs/MPI-Census-Monograph-2024-Volume-5-Report.pdf"
  save_as: uganda_mpi_census_2024.pdf

parser: uganda_mpi
geography: Total country

notes: >
  UBOS "National Population and Housing Census 2024 Monograph: Multidimensional
  Poverty Index Volume 5", disseminated March 2026. Population base 44,138,557.

  NATIONAL measure: 4 dimensions each weighted 1/4 — Education, Health, BASIC
  SERVICES and Living Standards — 13 indicators, k = 40%. Alkire-Foster dual
  cutoff; the household is the identification unit and the individual the unit
  of analysis.

  TWO EDITIONS, NOT ONE SERIES. UBOS also published an MPI in 2022 from UNHS
  2019/20 (4 dimensions, 12 indicators, k = 40%, at
  www.ubos.org/wp-content/uploads/publications/08_2022Multi_Poverty_Dimensional_Index_Report_2022.pdf).
  They are NOT comparable: the Employment and financial inclusion dimension was
  dropped and Basic Services added, the indicator count changed, and the data
  source moved from a survey to a census. Keep them as separate descriptors and
  never chain them. The 2022 edition is not yet collected.

  ⚠️ A widely circulated press figure of "27% of Ugandans" does NOT match this
  report, which reports 53.1%. Do not wire that number in.

  Also published and not yet captured: censored headcount ratios and both
  indicator and dimension contributions (Basic Services 33.8%, Health 25.3%,
  Living Standards 21.8%, Education 19.2%).

  CROSS-CHECK: National 53.1 / 50.9 / 0.270; Urban 39.1 / 49.3 / 0.193;
  Rural 61.1 / 51.5 / 0.315; Male-headed 51.9 / 50.5 / 0.262; Female-headed
  55.9 / 51.8 / 0.289; Kampala 19.5 / 45.3 / 0.088; Karamoja 91.4 / 62.3 / 0.569.
