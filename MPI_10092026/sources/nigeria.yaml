geography: Total country

notes: >
  NBS Nigeria MPI 2022 — the largest MPI exercise in Africa, disaggregated to
  36 states plus the FCT and 109 senatorial districts.

  NATIONAL measure: 4 dimensions (Health, Education, Living Standards, Work and
  Shocks), 15 indicators (D2/D3 list 15), k = 25% ("more than a quarter of weighted
  indicators"). The Work and Shocks dimension has no global-MPI analogue.

  THE ONE GLOBAL-MPI REPUBLICATION FOUND ANYWHERE. Across all 54 countries this
  is the only case of an NSO reprinting its own country's OPHI global MPI: the
  report quotes Nigeria's 2018 global figures (H 46.4%, MPI 0.254) as a
  comparison line. That row is an OPHI estimate, not an NBS national figure. It
  is NOT captured. Its exact printed form could not be read before delivery,
  and a speculative layout for a single comparison line is not worth the risk of
  silently mixing an OPHI estimate into a national series. The schema is ready
  for it — `mpi_type: global`, enforced at 3 dimensions and 10 indicators — so
  adding it later is a small change. See README section 4.

  COLLECTED SINCE 2026-10-07 from Appendix D (parsers/nigeria_appendix_d.py):
  all 37 States (D6) and the 109 senatorial districts (D7), with M0/H/A and
  their 95% bounds; the bounds for the body's area, zone, disability and age
  cuts; the Nigeria MPI for children under 5 (D9); and the CHILD MPI as its own
  measure ("Nigeria Child MPI": children 0-4, 5 dimensions -- Child survival and
  development added -- 23 indicators, k = 21% per D27) by area, zone, State,
  district and disability (D30-D34). Under-5 headcount 83.5%.

  PUBLISHED DEFECTS HANDLED: D7 prints "Osun West" twice with identical cells
  (kept once); FCT Abuja is printed as a State and as its single district with
  the same cells (kept once, as the State); two Child MPI H upper bounds exceed
  100% (Bayelsa West 100.5, Borno North 101.1 -- normal-approximation
  artefacts) and are left out by name.

  The body layout's column order IS verified against the printed tables
  (MPI | H | A | population share | number poor); see parsers/nigeria_mpi.py.

  CROSS-CHECK: national H 63% (133 million people), A ≈41%, MPI 0.257;
  Rural H 72% / A 42%; Urban H 42% / A 37%.
