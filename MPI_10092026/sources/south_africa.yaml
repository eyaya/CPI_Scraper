# --- discover ---
# USE http://, NOT https://. Stats SA answers this path over plain HTTP but
# returns repeated 504s and 403s over HTTPS through its Incapsula WAF — the
# reverse of the usual situation, and confirmed on repeated attempts.
#
# There is only ever ONE edition: the filename pattern is
# Report-03-10-08<YYYY>.pdf and a probe of ...082016.pdf returns 404.
discover:
