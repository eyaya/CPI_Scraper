# =====================================================================
# BLOCKED -- THE PUBLICATION IS A MAP ATLAS, NOT A SET OF TABLES.
#
# The download works and is stable (hcp.ma/file/244249/). What arrives is 263
# pages and 307 MB, and that size IS the finding: it is cartography. Scanning
# every page of it for a line carrying six or more numbers returns ELEVEN, and
# all eleven are sentences --
#
#     "Marrakech-Safi (de 26,0% a 19,2%) et a Fes-Meknes (de 20,1% a ..."
#
# -- except one small vulnerability-band table on page 49. The regional and
# provincial IPM figures exist only inside the maps and charts, as images. The
# nine-column region table this layout was written against is not in the file.
#
# THE CROSS-CHECK VALUES IN parsers/morocco_mpi.py WERE READ OUT OF PROSE, not
# off a table, which is why they look right and parse to nothing.
#
# NOR IS THERE A COMPANION WITH TABLES. HCP's October 2025 per-region volumes
# (e.g. "RGPH 2024, Region de Rabat-Sale-Kenitra", hcp.ma/file/245986/, a much
# more tractable 1.3 MB over 14 pages) were checked directly: same shape --
# narrative text around chart images, no tabular rows. The whole HCP IPM series
# is published this way.
#
# CONSEQUENCES FOR DISK: source_data/Morocco/ holds a 307 MB PDF backing zero
# output rows -- roughly four fifths of this indicator's source_data. It is
# left in place rather than deleted, because deleting a retained primary source
# is the repository owner's call, not the collector's. It is re-downloadable
# from the URL below at any time.
#
# THE FIX IS OCR over the atlas plates, or HCP publishing the underlying table.
# Not a looser layout. parsers/morocco_mpi.py is kept whole for that day.
# =====================================================================

country: Morocco
iso3: MAR
indicator: MPI
tier: 3
source_type: pdf
agency: Haut-Commissariat au Plan (HCP)
publication_code: Cartographie de la pauvreté multidimensionnelle 2025
frequency: ad_hoc
expect_metrics: 3

# --- discover ---
# HCP publications are served from /file/<6-digit id>/ and press notes from
# /attachment/<7-digit id>/, with ids increasing over time. The listing page
# /Pauvrete-vulnerabilite_r493.html renders properly (unlike the /downloads/
# topic pages, which come back empty) and carries the article ids.
#
# The full report is >30 MB; the pipeline streams it without trouble.
discover:
  method: static_url
  url: "https://www.hcp.ma/file/244249/"
  save_as: morocco_cartographie_ipm_2025.pdf

parser: morocco_mpi
geography: Total country

notes: >
  HCP "Cartographie de la pauvreté multidimensionnelle, paysage territorial et
  dynamique" (May 2025), built on the RGPH 2014 and RGPH 2024 censuses.

  NATIONAL measure: 3 dimensions each at 1/3 — Éducation, Santé, Conditions de
  vie — 10 indicators, k = 33%. Despite matching the global MPI's 3-dimension /
  10-indicator / ~33% shape, this is NOT the global MPI: it has no nutrition
  indicator, and "handicap" and "moyen de communication" are Morocco-specific
  substitutions made to fit census data. Tagged national accordingly.

  ⚠️ M0 IS PRINTED AS A PERCENTAGE, not a decimal in [0,1]: the national IPM
  for 2024 is 2,5 — meaning 2,5%. The layout declares `unit: percent` on the
  M0 columns and the schema range-checks them against 0..100 rather than 0..1.
  NOTHING IS RESCALED: converting it to the usual convention would be
  recomputing a published figure.

  ⚠️ NINE NUMERIC COLUMNS, not three. Each of H, A and IPM is split
  Urbain / Rural / Ensemble, in that order.

  A TIER-2 UPGRADE EXISTS: HCP publishes the underlying database as a workbook
  at https://www.hcp.ma/file/245096/. That is the better long-run source once
  its sheet layout has been read.

  Per-region notes are published on REGIONAL SUBSITES with their own attachment
  namespace, e.g. hcp.ma/region-marrakech/attachment/<7-digit>/ — enumerate the
  region subdomains, not just the main site, to get all twelve.

  ⚠️ A separate HCP indicator page (/Taux-de-pauvrete-multidimensionnelle_a3166.html)
  shows 5,7% for 2022, which is inconsistent with the 6,8% RGPH-2024 figure —
  likely a different, survey-based series. Do not blend the two.

  CROSS-CHECK (national 2024, Urbain / Rural / Ensemble): H 3,0 / 13,1 / 6,8;
  A 35,3 / 39,1 / 36,7; IPM 1,1 / 5,1 / 2,5. National 2014 ensemble:
  H 11,9; A 38,1; IPM 4,5.
