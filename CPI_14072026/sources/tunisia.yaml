country: Tunisia
iso3: TUN
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: html
agency: Institut National de la Statistique (INS)
frequency: monthly
verify_ssl: false            # INS serves an incomplete TLS certificate chain

# --- discover ---
# INS renders the monthly IPC-by-group table directly into its statistics page
# (a stable URL); we download that page and parse its HTML table.
discover:
  method: static_url
  url: "https://www.ins.tn/statistiques/90"
  save_as: Tunisia_IPC.html
  download_timeout: 900         # applies to the extra too: the workbook trickles in at ~7 KB/s

# --- back series ---
# The monthly results workbook posted with the CPI note (publication page
# /publication/indice-des-prix-la-consommation-<mois>-<annee>); its 'COICOP'
# sheet holds every month since January 2015 at full precision. Pinned to the
# September 2026 issue; the HTML window carries the newer months. The host is
# slow (~4 MB in ~10 min), hence the long timeout and the cache.
extras_cache: true
extra_urls:
  - url: "https://www.ins.tn/sites/default/files-ftp3/files/publication/pdf/R%C3%A9sultats_d%C3%A9finitifs_IPC_Base_2015_Septembre_2026.xlsx"
    save_as: Resultats_definitifs_IPC_Base_2015_Septembre_2026.xlsx

parser: tunisia_ins
geography: National
expect_divisions: 13          # Ensemble (All items) + 12 COICOP-1999 groups

notes: >
  INS Tunisia's 'Indice mensuel des prix à la consommation familiale' (base
  2015 = 100), served as an HTML table: COICOP-1999 groups down the rows, a
  rolling window of recent months across the columns, plus an 'Ensemble' all-items
  row (00). We read it with pandas.read_html and emit the index for each month
  column (history accumulates across runs). A richer time series is available from
  the INS data portal (dataportal.ins.tn) for later. French labels as published.
