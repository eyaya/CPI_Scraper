country: Cameroon
iso3: CMR
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique (INS)
frequency: monthly
verify_ssl: false            # INS serves an incomplete TLS certificate chain

# --- discover (two hops) ---
# The 'statistique' feed lists the monthly 'note-mensuelle ... prix' articles
# newest-first; each article page hosts the 'Note-sur-les-prix ....pdf'.
discover:
  method: two_hop_scrape
  index_url: "https://ins-cameroun.cm/statistique/"
  page_link_contains:
    - "note-mensuelle"
    - "prix"
  file_link_contains:
    - "note-sur-les-prix"
    - ".pdf"

parser: cameroon_ins
geography: National
expect_divisions: 13          # INDICE GENERAL (All items) + 12 COICOP functions

notes: >
  CEMAC harmonised CPI (IHPC, base 2022 = 100). INS publishes only a monthly PDF
  note (Tier 3). Its 'Tableau 2' has ~12 monthly index columns + 1-/3-/12-month
  variations by COICOP function, but doesn't extract as a grid, so the parser
  reconstructs rows from word coordinates: >=12-number rows are data rows (indices
  = nums[:-3], MoM nums[-3], YoY nums[-1]); wrapped division labels (01
  Produits alimentaires…, 04 Logement…, 05 Meubles…) are carried forward to their
  number-only row. First COICOP-function match wins over its sub-groups. Opens the
  Central-Africa / CEMAC region. French labels kept as published.

# BACK ISSUES (added 2026-10-13): the national 'Note sur les prix au Cameroun'
# PDFs in INS's WordPress media library (wp-json/wp/v2/media?search=prix).
# Each prints 10-12 consecutive monthly indices, dated from the report month
# and checked against the header. Not listed: 2023-05 and 2023-08 (older
# layout, no Tableau 2 the parser reads), 2023-11 and 2025-09 (a division
# label is lost in extraction) -- their months are reprinted by later notes.
# Yaoundé/Douala city notes (2018-2022) are a different geography; not read.
extras_cache: true
