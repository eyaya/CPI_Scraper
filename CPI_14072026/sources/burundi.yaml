country: Burundi
iso3: BDI
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique du Burundi (INSBU)
frequency: monthly
verify_ssl: false

# --- discover ---
# Burundi's NSO (formerly ISTEEBU, now INSBU — insbu.bi) is a SPA over a Laravel
# API; /api/publications lists the monthly reports with a document_url. We take the
# newest 'Indice des Prix à la Consommation' publication.
discover:
  method: insbu_latest
  api_url: "https://api.insbu.bi/api/publications"
  # The standalone monthly IPC note is posted ~5 weeks before the 'Bulletin
  # mensuel des prix' that reprints its table, so it is the primary (2026-10-14).
  title_contains: "Indice des Prix à la Consommation des ménages au Burundi"
  save_as: INSBU_IPC_Burundi.pdf

parser: burundi_insbu
geography: National
expect_divisions: 13          # Ensemble + 12 COICOP-1999 functions

notes: >
  Monthly IPC report, base 100 = 2016/2017, COICOP-1999. 'Tableau 1' gives 'TOUS
  LES PRODUITS' (code 0) + the 12 functions with three monthly indices then three
  inflation columns (moyenne annuelle, mensuel, glissement annuel): indices
  m-12, m-1, m = nums[-6:-3], MoM nums[-2], YoY nums[-1]. Functions carry a leading code
  digit (wrapped 04/05 show only the digit); dotted sub-items and analytical
  aggregates are skipped. Report month from the header. The old ISTEEBU domain
  (isteebu.bi) is now a parked/hijacked domain — insbu.bi is the live NSO site.

# BACK ISSUES (added 2026-10-14) from the INSBU publications API. Each prints
# m-12, m-1 and m, dated from the report month and checked against the printed
# monthly and annual variations. Notes 2025-02 .. 2026-08; bulletins only where
# no note reads (2024, 2025-07, 2026-02) -- read from their first 25 pages.
# Not listed (table unreadable: wrapped 04/05 labels or an image table; their
# months are reprinted as m-1 by the next issue): notes 2025-03, 2025-05,
# 2025-08, 2026-02, 2026-04; bulletins 2024-03, -06, -07, -08, -09, -10. The
# API's "janvier 2025" note is the February file, so it is not listed.
extras_cache: true
