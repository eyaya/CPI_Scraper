country: Botswana
iso3: BWA
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Statistics Botswana
frequency: monthly
verify_ssl: false            # Statistics Botswana serves an incomplete TLS chain

# --- discover ---
# The prices-statistics page lists the monthly 'Consumer Price Index <Month>
# <Year>' report newest-first; we scrape the first one.
discover:
  method: page_scrape
  page_url: "https://www.statsbots.org.bw/prices-statistics"
  link_contains:
    - "consumer price index"
    - ".pdf"

# BACK ISSUES. The listing page shows only the newest reports, but older ones
# stay at /sites/default/files/publications/Consumer Price Index <Month>
# <Year>.pdf. These 35 (Feb 2020 - Jul 2026) were found to exist on
# 2026-10-12 by probing every month; Statistics Botswana did not upload every
# month. Each issue dates ~5 months, so together they give the monthly series
# from 2019-02 (base Dec 2018 = 100). Reused from disk when complete.
extras_cache: true
