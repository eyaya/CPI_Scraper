country: Ethiopia
iso3: ETH
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Ethiopian Statistical Service (ESS)
frequency: monthly
verify_ssl: false

# --- discover ---
# ESS links the latest monthly 'inflation report' PDF from its home page.
discover:
  method: page_scrape
  page_url: "https://ess.gov.et/"
  link_contains:
    - "inflation-report"
    - ".pdf"

parser: ethiopia_ess
geography: National
expect_divisions: 1           # national all-items (General) only


# --- back issues (2026-10-13) ---
# ESS's WordPress media API is closed (401), but its /price/ page lists every CPI
# bulletin as a WP Download Manager package (?cp=2..8 pages back to 2019), and
# '/download/<slug>/?wpdmdl=<id>' serves the PDF itself. The 2019-2023 bulletins
# carry 'Table 1a' -- the INDEX (December 2016 = 100) for General + 12 COICOP-1999
# divisions -- read by the parser; the 2025-26 bulletins add their rate tables.
# Left out: the 2023-24 old-format rate-only bulletins (cpi_<mon>_2023/2024,
# Aug 2024), which the rate reader misaligns (a weights row read as a 100.0 % rate,
# months shifted by one), and 4 bulletins with no readable table (Dec 2020,
# Jun/Nov 2021, May 2023). The download host flaps: extras_cache.
extras_cache: true
