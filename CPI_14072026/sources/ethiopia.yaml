country: Ethiopia
iso3: ETH
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Ethiopian Statistical Service (ESS)
frequency: monthly
verify_ssl: false

# --- discover ---
# ESS links the latest monthly 'inflation report' PDF from its home page.
discover:
  method: page_scrape
  page_url: "https://ess.gov.et/"
  link_contains:
    - "inflation-report"
    - ".pdf"

parser: ethiopia_ess
geography: National
expect_divisions: 1           # national all-items (General) only

notes: >
  PARTIAL capture. ESS shows its full COICOP index only as bar charts; the clean
  tabular data are the headline series, so we capture national all-items (General)
  year-on-year and month-on-month inflation as a 13-month series. Dates use the
  Ethiopian fiscal-year tag (EFY); we map the report month to Gregorian (Ethiopian
  year N → Sep N+7 … Sep N+8) and anchor the last table row to it (ESS occasionally
  mislabels an intermediate month). By-division figures are not captured.
