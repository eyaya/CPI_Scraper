country: DR_Congo
iso3: COD
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Banque Centrale du Congo (BCC)   # INS-RDC (NSO) is WAF-blocked; BCC is the fallback
frequency: annual
verify_ssl: false

# --- discover ---
# The NSO (INS-RDC) site is WAF-blocked, so we use the central bank's stable
# annual CPI workbook.
discover:
  method: static_url
  url: "https://www.bcc.cd/system/files_force/statistiques/ipc_annuel_bcc.xlsx/?download=1"
  save_as: BCC_IPC_Annuel.xlsx

parser: drc_bcc
geography: National
expect_divisions: 1           # national all-items only

notes: >
  PARTIAL capture. INS-RDC (the NSO) is unreachable (WAF-403), so this uses the
  Banque Centrale du Congo 'ipc_annuel_bcc.xlsx' — the national all-items CPI as an
  ANNUAL series (index base 2012 = 100 + year-on-year inflation). Limitations:
  all-items only (no COICOP breakdown), annual frequency, and the file ends in 2020.
  Annual values are dated to year-end (YYYY-12) to fit the monthly period schema.
