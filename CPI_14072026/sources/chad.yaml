country: Chad
iso3: TCD
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique, des Études Économiques et Démographiques (INSEED)
frequency: monthly
verify_ssl: false

# --- discover ---
# inseed.td is a SPA over a Node API (inseed.ssn-tchad.td). Its /api/publications
# feed lists the monthly 'Bulletin-INHPC-<MM>-<YYYY>' PDFs; we take the newest.
discover:
  method: inseed_tchad_latest
  api_base: "https://inseed.ssn-tchad.td"
  title_contains: "INHPC"
  save_as: Bulletin_INHPC_Chad.pdf   # API file URLs are opaque (publication-<id>.pdf)

parser: chad_inseed
geography: National
expect_divisions: 13          # INDICE GLOBAL + 12 COICOP-1999 functions

notes: >
  CEMAC harmonised CPI (INHPC), base 2022, covering eight cities. 'Tableau 2' lists
  the 12 COICOP-1999 functions (Roman I–XII) + INDICE GLOBAL, with detailed
  sub-items (I.1, I.1.1, …) interleaved: (weight +) five monthly indices then 1-/3-/
  12-month variations, so the five indices are nums[-8:-3], MoM nums[-3], YoY nums[-1].
  Functions are identified by a leading Roman numeral (a following '.' marks a
  sub-item). Report month is the latest 'mois-YY' token in the table.

# BACK ISSUES (added 2026-10-13): every bulletin INSEED's API lists, 2024-01 on
# (2024-07/08 and 2025-01..04 are not posted). Each issue prints five monthly
# indices (m-12, m-3, m-2, m-1, m), dated from the table's own header; the
# issues to 12-2024 are base 2019, from 2025 base 2022 (base_period per row).
# The newest issue wins on overlap.
extras_cache: true
