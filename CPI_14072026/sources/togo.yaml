parser: togo_inseed_ihpc
geography: National
expect_divisions: 14          # All items (Global) + 13 COICOP-2018 divisions

notes: >
  WAEMU/UEMOA harmonised CPI (IHPC, base 2023 = 100), but INSEED publishes only a
  monthly PDF note (no série-de-données Excel), so this is Tier 3 rather than the
  shared waemu_ihpc Excel parser. The note's division table (Roman numerals
  I..XIII, spanning the first two pages) and the 'Global' row of Tableau 3 give,
  per COICOP-2018 division, the current-month index plus 1-/3-/12-month %
  variations; we emit index + inflation_mom + inflation_yoy. One PDF = one month;
  history accumulates across runs. French labels; comma decimals.
