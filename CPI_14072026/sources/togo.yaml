country: Togo
iso3: TGO
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique et des Études Économiques et Démographiques (INSEED)
frequency: monthly

# --- discover ---
# INSEED (WordPress download manager) lists the monthly IHPC notes newest-first
# on its inflation-prix page as '/download/<id>/'. The report links read 'IHPC
# (Indice Harmonisé ...)'; the first such link is the newest month. (The 'Excel'
# série de données is not published on the site — only these PDFs.)
discover:
  method: page_scrape
  page_url: "https://inseed.tg/inflation-prix/"
  link_contains:
    - "indice harmonis"
    - "/download/"
  save_as: Togo_IHPC.pdf

parser: togo_inseed_ihpc
geography: National
expect_divisions: 14          # All items (Global) + 13 COICOP-2018 divisions

notes: >
  WAEMU/UEMOA harmonised CPI (IHPC, base 2023 = 100), but INSEED publishes only a
  monthly PDF note (no série-de-données Excel), so this is Tier 3 rather than the
  shared waemu_ihpc Excel parser. The note's division table (Roman numerals
  I..XIII, spanning the first two pages) and the 'Global' row of Tableau 3 give,
  per COICOP-2018 division, the current-month index plus 1-/3-/12-month %
  variations; we emit index + inflation_mom + inflation_yoy. One PDF = one month;
  history accumulates across runs. French labels; comma decimals.
