country: Togo
iso3: TGO
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique et des Études Économiques et Démographiques (INSEED)
frequency: monthly

# --- discover ---
# INSEED (WordPress download manager) lists the monthly IHPC notes newest-first
# on its inflation-prix page as '/download/<id>/'. The report links read 'IHPC
# (Indice Harmonisé ...)'; the first such link is the newest month. (The 'Excel'
# série de données is not published on the site — only these PDFs.)
discover:
  method: page_scrape
  page_url: "https://inseed.tg/inflation-prix/"
  link_contains:
    - "indice harmonis"
    - "/download/"
  save_as: Togo_IHPC.pdf

# BACK ISSUES (added 2026-10-12): every document on INSEED's inflation-prix
# page, older than the newest. Each note prints five months of index, so the
# set rebuilds the monthly series back to base 2014; a document that is not
# an IHPC note fails the shared reader's table checks and is skipped with a
# message (parsers/ihpc_note_pdf.py). Complete copies are reused.
extras_cache: true
# (download/2236 omitted: inseed.tg answers HTTP 500 for it, 2026-10-12.)
