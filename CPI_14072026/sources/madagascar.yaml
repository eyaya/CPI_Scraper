country: Madagascar
iso3: MDG
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Institut National de la Statistique (INSTAT)
frequency: monthly
verify_ssl: false

# --- discover ---
# instat.mg is a SPA: the home page links each monthly NIPC *page* (…/p/nipc-…),
# which in turn links the .xlsx under /documents/upload/main/. First match = newest.
discover:
  method: two_hop_scrape
  index_url: "https://www.instat.mg/"
  page_link_contains:
    - "/p/nipc-nouvel-indice"
  file_link_contains:
    - "INSTAT_NIPC"
    - ".xlsx"

parser: madagascar_instat
geography: National
expect_divisions: 13          # Ensemble + 12 COICOP-1999 FONCTION divisions

notes: >
  NIPC workbook, base 100 = moyenne 2016. The 'IPC' sheet is a wide monthly index
  series (2016-01–latest); we capture the official COICOP-1999 block — 'Ensemble'
  (all items) + the 12 'FONCTION' divisions — as index for every reported month.
  Madagascar-specific analytical aggregates (RIZ/ORIGINE/ENERGIE/PPN/SECTEUR) and
  the 7 city series remain in the retained source .xlsx.
