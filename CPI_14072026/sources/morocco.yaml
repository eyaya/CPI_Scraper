country: Morocco
iso3: MAR
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Haut-Commissariat au Plan (HCP)
frequency: monthly

# --- discover ---
# HCP publishes the IPC as Google Sheets it updates monthly and links from its
# IPC pages. The by-division workbook (two 'mensuel' tabs = COICOP 01..06 and
# 07..12) is linked from the 'par divisions Groupe 1 Mensuel' page as 'le fichier
# de donnees'; we scrape that Google Sheets export link. The general index (00)
# is a separate workbook, added via extra_urls. Sheet IDs are stable (HCP edits
# them in place), so the export URL persists across monthly updates.
discover:
  method: gsheet_from_page
  page_url: "https://www.hcp.ma/Indice-des-prix-a-la-consommation-IPC-2017-par-divisions-Groupe-1-Mensuel_a2514.html"
  save_as: Morocco_IPC_divisions.xlsx

extra_urls:
  - url: "https://docs.google.com/spreadsheets/d/1k44NVnQvbBaMUFQij_FkOa2bk2bA8omrbG81kxD5FCg/export?format=xlsx"
    save_as: Morocco_IPC_general.xlsx     # 'grandes divisions' workbook -> Indice General (00)

parser: morocco_hcp
geography: National
expect_divisions: 13          # Indice General (00) + 12 COICOP-1999 divisions

notes: >
  Index levels only (base 2017 = 100), a wide monthly time series from 2017. The
  by-division workbook holds COICOP-1999 divisions 01..12 across two 'mensuel'
  tabs; the general index (00) comes from the separate 'grandes divisions'
  workbook (extra_urls). The sheets carry no YoY/MoM (derivable downstream). HCP
  also publishes the IPC by city and a monthly note d'information PDF (general +
  divisions + cities) — available for later. Source labels are kept in French.
