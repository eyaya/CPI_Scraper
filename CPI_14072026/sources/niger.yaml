country: Niger
iso3: NER
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique (INS)
frequency: monthly
verify_ssl: false            # INS serves an incomplete TLS certificate chain

# --- discover ---
# INS (WordPress rebuild, 2026) publishes the monthly IHPC note as
# IHPCB2023_<Mois>_<Année>_VF.pdf under a stable /wp-content/uploads/ folder and
# lists every issue on the IHPC publication page. The home page no longer links
# the PDF directly, so we scrape that page and pick the newest by the French
# month+year in the filename. NB the filename carries the base year (…B2023…) too,
# so the month+year must be parsed as an adjacent pair — latest_named_month_file
# does exactly that (unlike a bare page_scrape, which took the first link).
discover:
  method: latest_named_month_file
  page_url: "https://www.stat-niger.org/?pub_eco=lindice-harmonise-des-prix-a-la-consommation-ihpc"
  lang: fr
  url_contains:
    - "ihpcb2023"
    - ".pdf"
  require_text: true          # skip issues published as a pure scan (see notes)
  lookback: 6

# BACK ISSUES (added 2026-10-12): every base-2023 note (IHPCB2023_*) on INS's
# IHPC page. Each prints five months of index. Notes published as a pure scan
# (no text layer, e.g. Juillet 2026) are skipped with a message; base-2014
# notes (IHPCB2014_*, to 2024-12) use another layout and are not read.
extras_cache: true
extra_urls:
  - url: "https://www.stat-niger.org/wp-content/uploads/indices/indice_harmonise_prix_consommation/IHPCB2023_Aout_2025_VF.pdf"
