notes: >
  Spanish-language monthly note, base period 2008 (weights from the January 2006
  EEH household survey), Laspeyres, computed on AFRISTAT's PHOENIX since Jan 2017.
  Covers the national aggregate + the 5 surveyed cities (weights: Bata 39%, Malabo
  36%, Ebibeyin 10%, Mongomo 9%, Evinayong 6%), all carried in `geography`. We take
  two annexes — 'Índices de precios mensuales' (index) and 'Variación mensual del
  IPC' (MoM) — matched on CAPTION TEXT, not annex number: INEGE ships two different
  annexes both numbered 'Anexo 4'.
  NOT captured — the 'Inflación nacional y por ciudad' annex. Despite its name it is
  NOT year-on-year: it is the CEMAC multilateral-surveillance measure, a 12-month
  MOVING AVERAGE (May 2026 = 2,3% national, while the same report states a true
  interanual of 3,5%). The schema has no measure for a moving average, so it is
  dropped rather than mislabelled as inflation_yoy. Consequence: this country has
  NO annual measure. Adding an `inflation_ma12` measure to schema.py would let us
  capture INEGE's own headline — worth considering, it's the figure they lead with.
  Only one month of index per issue, so YoY can't be derived locally either.
  Source-data quirk: individual cells are occasionally malformed in the PDF itself
  ('-1,' with the decimal digit missing — Ropa y calzados / Nacional, May 2026).
  Those cells are skipped, never guessed; a row must still carry one token per
  geography or the parse fails loudly, since a dropped cell would silently shift
  every later column onto the wrong city.
  WITHDRAWN ISSUES: INEGE takes reports down again. The June 2026 report was
  collected on 16 July 2026 (retained under source_data/) but by September 2026 it,
  and July's, were gone from every upload-month/name variant, leaving May 2026 as
  the newest served — so a run can legitimately return an OLDER month than the one
  already on disk. That is INEGE withdrawing the file, not a discovery fault.
