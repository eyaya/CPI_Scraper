country: Equatorial_Guinea
iso3: GNQ
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Instituto Nacional de Estadística de Guinea Ecuatorial (INEGE)
frequency: monthly

# --- discover ---
# inege.org is Cloudflare-gated: EVERY html route answers 403 (/, ?page_id=404,
# /wp-json/, even /robots.txt), so there is no listing to scrape and no site to
# crawl. The published PDFs under /wp-content/uploads/ are served normally — but
# only to a browser-like TLS fingerprint, so both the probe and the download go
# through curl_cffi (`impersonate`). A plain `requests` call is refused whatever
# User-Agent it sends; the handshake, not the header, is what's inspected.
# We therefore construct the URL and walk back month by month. WordPress files the
# PDF under its UPLOAD month, normally the month after the data month, so each
# candidate is probed at a +1 / +2 / +0 offset.
discover:
  method: inege_ipc_latest
  url_template: "https://inege.org/wp-content/uploads/{pub_year}/{pub_month}/Informe__IPC_{month}_{year}.pdf"
  # Tried in order until one isn't refused. Which fingerprints pass is NOT stable —
  # Cloudflare scores per fingerprint, and the Chrome profiles were observed going
  # from working to 403 within the hour while Firefox/Safari kept succeeding — so
  # keep more than one here.
  impersonate:
    - chrome124
    - firefox133
    - safari17_0
  lookback_months: 6

parser: equatorial_guinea_inege
geography: National
expect_divisions: 13          # IPC general + 12 CEMAC/NCAC (COICOP-1999) functions


# --- back issues (2026-10-13) ---
# INEGE files its monthly reports in a WP File Download library; the search page
# (?s=IPC) lists each with an admin-ajax download link, served (via the same
# browser impersonation) as the PDF itself. May 2022 - Dec 2025 issues use the
# older per-geography layout (one 'Índices de precios mensuales de la ciudad de
# <City>' / '... a nivel nacional' table each, previous + report month), which
# the parser reads as a fallback. Left out: the quarterly/annual reports
# 2015-2021 (no monthly index table), 'ENERO 2022' (the file is the January 2024
# report, mislabelled), and Jan/Feb/Mar 2026 (an interim grid whose caption and
# table the reader cannot pair -- not read rather than guessed).
extras_cache: true
