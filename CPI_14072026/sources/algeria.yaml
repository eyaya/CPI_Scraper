country: Algeria
iso3: DZA
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Office National des Statistiques (ONS)
frequency: monthly
verify_ssl: false            # ONS serves an incomplete TLS certificate chain

# --- discover ---
# The IPC section (SPIP rubrique 124) links the latest monthly IPC note PDF.
discover:
  method: page_scrape
  page_url: "https://www.ons.dz/spip.php?rubrique124="
  link_contains:
    - "ipc"
    - ".pdf"

parser: algeria_ons
geography: National
expect_divisions: 9           # Ensemble + 8 ONS national groups (NOT COICOP)

notes: >
  CAPTURED AS REPORTED — Algeria's ONS does NOT use the COICOP 12/13 divisions; it
  publishes a NATIONAL 8-group nomenclature (Transports & Communication combined;
  Education-Culture-Loisirs combined; 'Divers (N.D.A.)' a catch-all). We keep the
  native French labels and native grouping; the `coicop_code` (00 = Ensemble,
  01..08) is an Algeria-internal ordering, NOT a COICOP code — do not join it to
  other countries' COICOP codes. Base 2001 = 100. The note's headline table gives
  the group index + MoM + YoY for the report month. TWO GEOGRAPHIES since
  2026-10-14: 'National' = the national group table (page 7); "Ville d'Alger" =
  the Algiers table (page 2, 'Alimentation' label wraps, positional extraction).
  Rows filed as 'National' before 2026-10-14 were in fact the Algiers index. A product-type
  breakdown (agricoles frais / manufacturés / services) is also in the note.

# BACK SERIES (added 2026-10-14). (1) ONS yearbook "Indice des prix a la
# consommation 2014-2023" (Collections Statistiques n. 238): every month 2014-2023,
# 8 groups + Ensemble, national and Algiers, index + monthly variation. (2) the
# monthly notes ONS still links from its spip articles (2023-10 .. 2026-06; found
# by walking spip.php?article2955-3160). A month's own note wins over history.
extras_cache: true
