parser: egypt_capmas
geography: Total              # 'Table 1' also carries Urban and Rural side by side
expect_divisions: 13          # All items + 12 COICOP-1999 divisions

notes: >
  Authoritative NSO source (Tier 2). The bulletin's 'Table 1' gives the CPI by
  COICOP-1999 division for THREE geographies side by side — Urban, Rural and
  Total Egypt — each as index level + month-on-month % + year-on-year %, base
  2018/2019 = 100. We emit all three measures for the report month, for each
  geography (keyed on the `geography` column: Urban / Rural / Total). The table
  also nests sub-groups and, in Tables 2/4, a governorate breakdown (Cairo,
  Alexandria, ...) — available for later. One workbook = one report month;
  history accumulates across monthly runs. Full period history (from 2000) is
  listed by /api/Publication/PublicationPeriods?publicationId=32.

  The CBE inflation-note PDF (parser egypt_cbe) remains as a Tier-3 fallback; it
  is urban-only by division but additionally carries the CBE 'core CPI' series.
