country: Egypt
iso3: EGY
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Central Agency for Public Mobilization and Statistics (CAPMAS)
frequency: monthly

# --- discover ---
# CAPMAS's public site is a SPA backed by a JSON API on port 8080. Each monthly
# 'Consumer Price Index' bulletin is publication id 32; GET /api/Publication/32
# returns the newest issue's Excel URL (a GUID-named file on the same host).
discover:
  method: capmas_publication
  api_base: "https://www.capmas.gov.eg:8080"
  publication_id: 32
  prefer: excel

# BACK ISSUES (added 2026-10-12): every monthly workbook from January 2021,
# resolved through CAPMAS's own front-end API
# (/api/Publication/SearchPublicationDetail?PublicationId=32&Year=Y&Month=M).
# One month per workbook, base 2018/2019 = 100. March 2025 and everything before
# 2021 are PDF-only and not read. Complete copies on disk are reused.
extras_cache: true
