country: Kenya
iso3: KEN
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Kenya National Bureau of Statistics (KNBS)
frequency: monthly
verify_ssl: false            # KNBS serves an incomplete TLS certificate chain

# --- discover ---
# KNBS posts one monthly PDF press release. The listing page shows all months;
# we parse '<Month> <Year>' from each link and take the newest.
discover:
  method: latest_dated
  page_url: https://www.knbs.or.ke/cpi-and-inflation-rates/
  link_contains:
    - "consumer-price-indices-and-inflation-rates"
    - ".pdf"

parser: kenya_knbs_cpi
geography: National
expect_divisions: 14          # All items (Total) + 13 COICOP-2018 divisions

notes: >
  KNBS publishes inflation RATES by division, not index levels. From 'Table 1'
  of the monthly PDF we extract, per division, the month-on-month and
  year-on-year % change (measures inflation_mom / inflation_yoy). One PDF =
  one month; history is built by accumulating monthly runs. The retained source
  is the PDF itself.

# --- fallback ---
# KNBS occasionally goes down (HTTP 500) for extended periods. When the primary
# collection fails, fall back to the Central Bank of Kenya's headline inflation
# table. This is a DEGRADED fallback: CBK publishes only the all-items 12-month
# inflation (no divisions, no index level), so we get just the national headline
# YoY series (long history) — enough to keep Kenya reporting while KNBS is down.
fallback:
  agency: Central Bank of Kenya (CBK) — headline-inflation fallback
  source_type: html
  verify_ssl: true
  discover:
    method: static_url
    url: "https://www.centralbank.go.ke/inflation-rates/"
    save_as: Kenya_CBK_inflation.html
  parser: cbk_kenya
  expect_divisions: 1           # CBK gives only All items (00) headline YoY
