country: Sierra_Leone
iso3: SLE
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Statistics Sierra Leone (Stats SL)
frequency: monthly
verify_ssl: false            # Stats SL serves an incomplete TLS certificate chain

# --- discover ---
# Stats SL links the latest monthly 'CPI Press Release' PDF from its home page.
discover:
  method: latest_dated
  page_url: "https://www.statistics.sl/"
  link_contains:
    - "press_release"
    - ".pdf"
  # statistics.sl refuses `requests` by TLS fingerprint (403, 2026-10-13).
  impersonate: [chrome124, safari17_0]

# --- back issues ---
# Every release on the December 2021 = 100 base (2022 on) from the archive page
# /index.php/cpi.html. Releases 2008-2021 (2008 = 100, another layout) are not
# listed; the parser skips any issue that does not state the 2021 base.
extras_cache: true
extra_urls:
  - url: "https://www.statistics.sl/images/StatisticsSL/Documents/cpi/2022/August_2022_CPI_Press_Release.pdf"
    save_as: sl_2022_August_2022_CPI_Press_Release.pdf
