notes: >
  'Table 1: National CPI and rates of inflation by main COICOP functions
  (December 2021 = 100)'. The letter-spaced header is unreadable, but each row's
  trailing three numbers are the 1-/3-/12-month % changes, so the current index is
  nums[-4], MoM nums[-3], YoY nums[-1]. We emit index + inflation_mom +
  inflation_yoy for the report month (from the filename). One PDF = one month.
