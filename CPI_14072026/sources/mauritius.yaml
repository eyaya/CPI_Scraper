country: Mauritius
iso3: MUS
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Statistics Mauritius
frequency: monthly
verify_ssl: false            # govmu.org serves an incomplete TLS certificate chain

# --- discover ---
# The Monthly-CPI page lists the notes (CPI_M_<Mon><YY>_<ddmmyy>.pdf) newest-first;
# we scrape the first one.
discover:
  method: page_scrape
  page_url: "https://statsmauritius.govmu.org/Pages/Statistics/Monthly/Monthly-CPI.aspx"
  link_contains:
    - "cpi_m"
    - ".pdf"

# BACK ISSUES (added 2026-10-12): every monthly note on the archive page
# (Pages/Statistics/Monthly/Arch-Mthly-CPI.aspx), 2014-2025, plus the 2026
# notes. Each prints the previous and the current month, so together they give
# the monthly series from late 2013. Three bases (Jan-Dec 2012, 2017, 2023 =
# 100) are kept on their own rows; where two cover a month the newest wins
# (see parsers/mauritius_cpi.py). Back issues never change, so complete copies
# already on disk are reused.
extras_cache: true
