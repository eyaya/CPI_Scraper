parser: mauritius_cpi
geography: National
expect_divisions: 14          # All Divisions (All items) + 13 COICOP-2018 divisions

notes: >
  Statistics Mauritius' monthly CPI note (base Jan–Dec 2023 = 100). Its 'Division'
  table extracts cleanly: per COICOP-2018 division (1..13) and 'All Divisions'
  (00), the index for the previous and current month — so one note yields two
  months (history accumulates across runs). Index levels only. Labels use the
  canonical COICOP-2018 map. A by-group/sub-index breakdown is also in the note
  for later.
