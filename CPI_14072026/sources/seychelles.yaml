country: Seychelles
iso3: SYC
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: National Bureau of Statistics (NBS)
frequency: monthly
verify_ssl: false

# --- discover ---
# NBS links the latest 'Consumer Price Index Time Series <Month> <Year>' .xlsx
# from its home page; latest_dated picks the newest dated link.
discover:
  method: latest_dated
  page_url: "https://www.nbs.gov.sc/"
  link_contains:
    - "consumer-price-index-time-series"
    - "download"
  save_as: Seychelles_CPI_Time_Series.xlsx   # the /download route carries no filename

parser: seychelles_nbs
geography: National
expect_divisions: 13          # ALL ITEMS + 12 COICOP-1999 divisions

notes: >
  'CPI_Series' sheet, base 2014 = 100. Several stacked blocks repeat the same row
  labels; the first (index) block carries the 12 COICOP-1999 divisions + ALL ITEMS
  laid out under a Food/Non-food grouping. We take each division's first occurrence
  and emit index for every reported month (2007-01–latest). Period header: row 2
  month, row 3 year; interleaved weight columns are skipped.
