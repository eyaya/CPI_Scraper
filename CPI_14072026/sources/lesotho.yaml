country: Lesotho
iso3: LSO
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Lesotho Bureau of Statistics (BOS)
frequency: monthly
verify_ssl: false            # bos.gov.ls serves an incomplete TLS certificate chain

# --- discover ---
# BOS links the latest monthly CPI release from its home page. It is now shipped
# ZIPPED ('CPI_<Month>_<Year>.zip') rather than as a bare PDF, so we match the
# archive and let the harness unzip the single PDF inside it.
discover:
  method: latest_dated
  page_url: "https://www.bos.gov.ls/"
  link_contains:
    - "cpi"
    - ".zip"
  inner_suffix: ".pdf"

# --- back issues ---
# Every monthly archive on the 2022 = 100 base (January 2023 on), same URL
# pattern as the current issue. Reports 2017-2022 are also online but state no
# base, so they are not listed (the parser would skip them anyway).
extras_cache: true
extra_urls:
  - url: "https://www.bos.gov.ls/BoS_reports/Copy%20of%20Economics/CPI_January_2023.zip"
    save_as: CPI_January_2023.zip
