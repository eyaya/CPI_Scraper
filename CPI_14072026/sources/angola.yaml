country: Angola
iso3: AGO
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Instituto Nacional de Estatística (INE)
frequency: monthly
verify_ssl: false

# --- discover ---
# ine.gov.ao's time-series database bakes the IPC .xlsx path into an obfuscated
# inline script (the 'Download Excel' button); we regex it out of the page source.
discover:
  method: regex_on_page
  page_url: "https://www.ine.gov.ao/inicio/preview?value=inflacao"
  pattern: "/Arquivos/SeriesTemporais/+Carregados/[^'\"]+\\.xlsx"
  base_url: "https://www.ine.gov.ao"
  save_as: Angola_IPC_SeriesTemporais.xlsx

parser: angola_ine
geography: National
expect_divisions: 1           # national all-items YoY series only (no COICOP breakdown here)

notes: >
  INE's 'Base de Dados de Séries Temporais' publishes, for inflation, only the
  national all-items year-on-year change ('Variação Homóloga'), monthly from
  2015-12. We capture that series as code 00 / inflation_yoy for every reported
  month. INE's COICOP-division IPC index lives in separate monthly bulletins not
  exposed by this database.
