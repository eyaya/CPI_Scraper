country: Mauritania
iso3: MRT
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Agence Nationale de la Statistique et de l'Analyse Démographique et Économique (ANSADE)
frequency: monthly
verify_ssl: false

# --- discover ---
# ansade.mr is a SPA over a WordPress backend (admin.ansade.mr); the monthly INPC
# note is a media item. We query the media API and take the newest dated PDF.
discover:
  method: wp_media_latest
  api_url: "https://admin.ansade.mr/wp-json/wp/v2/media?search=indice&per_page=60&orderby=date&order=desc"
  name_contains: "Indice-National-des-Prix"
  # ANSADE's published name is ~90 chars; in this deep OneDrive path the full path
  # hits 260 (> Windows MAX_PATH) and the retained PDF won't open. Save it short.
  save_as: mauritania_inpc.pdf

parser: mauritania_ansade
geography: National
expect_divisions: 13          # Indice général + 12 COICOP-1999 functions

notes: >
  Monthly INPC note. 'Tableau 2 : Evolution de l'indice par fonction' gives the 12
  COICOP-1999 functions (function 02 is 'Tabac et stupéfiants' — no alcohol) +
  Indice général, each with weight, five monthly indices and four variations
  (monthly, 3-month, year-on-year, 12-month). Indices are the unsigned figures,
  variations the signed ones; every printed month is emitted, dated from the
  report month and checked against the printed 1/3/12-month variations; MoM and
  YoY are variations 1 and 3. Sub-item rows (prefixed 'v') are skipped. Report
  month = latest month named in the note; base read per issue (empty if unstated).

# BACK ISSUES (added 2026-10-14): every monthly note in ANSADE's media library,
# 2016-01 .. 2026-08 (wp-json/wp/v2/media?search=INPC). Three layouts (base 2014
# to 2022-07, base 2019 after) read by one reader; each printed month is dated
# from the report month and checked against the printed variations. Not listed:
# 2020-05 and 2020-10 (their 3-month and annual variations do not match their own indices;
# its months are reprinted by the 2020-06 and later notes), 2023-07 (a scanned
# image, no text) and 2025-06 (function table is an image). Saved short: MAX_PATH.
extras_cache: true
