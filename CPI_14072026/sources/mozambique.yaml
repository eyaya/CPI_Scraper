country: Mozambique
iso3: MOZ
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Banco de Moçambique (BM) — republishing the INE CPI workbook
frequency: monthly
verify_ssl: false

# --- discover ---
# The NSO (INE) portal is an auth-gated Liferay; the central bank republishes INE's
# CPI workbook. The statistics landing page links the newest monthly IPC page,
# which in turn links the .xls.
discover:
  method: two_hop_scrape
  index_url: "https://www.bancomoc.mz/pt/areas-de-actuacao/estatisticas/dominios-e-indicadores-estatisticos/"
  page_link_contains:
    - "indice-de-precos-ao-consumidor-"
  file_link_contains:
    - "ipc"
    - ".xls"

parser: mozambique_bm
geography: National
expect_divisions: 13          # Total + 12 COICOP-1999 divisions

notes: >
  Central-bank source. The Banco de Moçambique republishes INE's official CPI
  workbook without re-estimating it (INE's own portal is an auth-gated Liferay).
  Sheet 'Publicação pag3 a 7' → 'Quadro 8. Índices de Preços por Divisão e Grupos',
  base 2023 = 100: a wide monthly index (Jan 2016–) by COICOP-1999 division + Total.
  Columns start with 'Pond.' weights then a 'Mon.YY' monthly index block; we take
  the first (national) block, 2-digit division codes + Total (0 → 00), skipping
  3-digit sub-groups.
