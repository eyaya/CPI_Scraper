country: Somalia
iso3: SOM
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Somali National Bureau of Statistics (SNBS)
frequency: monthly

# --- discover ---
# nbs.gov.so is WordPress; the monthly CPI report is a media item. The category
# page (/category/consumer-price-index/) links the same PDFs, but the media API
# lists them all in one JSON call. Filenames carry an English month + year in a
# word order that varies between issues ('May-CPI-Report-2026.pdf',
# 'CPI-December-2025.pdf'), so we date them by name, not by upload date — two
# issues are often uploaded on the same day.
discover:
  method: wp_media_latest
  api_url: "https://nbs.gov.so/wp-json/wp/v2/media?search=CPI&per_page=100"
  name_contains: "cpi"
  lang: en

# --- back issues ---
# Every report on the January-2025 base (COICOP 2018) from the media API, each a
# 3-month window; the parser keeps the newest issue's figure where windows
# overlap. January 2025 printed no month header and is skipped by the parser.
# Reports before 2025 are on the old Mogadishu base in another layout (not read).
extras_cache: true
