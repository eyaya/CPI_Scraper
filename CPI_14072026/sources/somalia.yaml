parser: somalia_snbs
geography: National
expect_divisions: 14          # CPI TOTAL + 13 COICOP-2018 divisions

notes: >
  Rebased in January 2025 on the 2022 SIHBS: COICOP 2018 (13 divisions), 537 items,
  index reference 2022, covering Mogadishu + all Federal Member States. RATES ONLY —
  the index level appears solely as a chart (Graph 1), so no index series is
  captured; base_period is left blank. Each report carries a rolling 3-month window
  in four tables, keyed by caption rather than table number: 'Division level
  annual/monthly' (COICOP divisions + CPI TOTAL, national) and 'State level
  annual/monthly' (the six FMS as `geography`, all-items only; the state tables'
  CPI TOTAL row repeats the national figure and is dropped). Puntland indices are
  estimated by SNBS. The report month is the last column header, so the parser is
  self-dating. Long division labels overrun the first value column and pdfplumber
  merges the glyphs ('MAINTEN6A.N3C%E'), so values are read at character level from
  the value zone with alphabetic characters dropped. Opens the Horn of Africa.
