country: Mali
iso3: MLI
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique (INSTAT)
frequency: monthly

# --- discover ---
# INSTAT posts the monthly IHPC note as 'ihpc<MMYY>_pub.pdf', newest-first, on its
# IHPC publications page. We scrape the first such link (newest month) — but only
# after checking it resolves: INSTAT advertises issues it has not actually uploaded
# (July 2026's 'ihpc0726_pub.pdf' is linked and 404s while June's is fine), so
# `require_ok` walks on to the newest link that really serves a file.
discover:
  method: page_scrape
  page_url: "https://www.instat-mali.org/fr/publications/indice-harmonise-des-prix-a-la-consommation-ihpc"
  link_contains:
    - "ihpc"
    - "_pub.pdf"
  require_ok: true            # INSTAT links notes it has not uploaded (see notes)
  lookback: 6

parser: mali_instat_ihpc
geography: National
expect_divisions: 14          # INDICE NATIONAL (All items) + 13 COICOP-2018 divisions


# --- back issues (2026-10-13) ---
# INSTAT keeps every monthly note online (Jan 2009 onward). Each note prints the
# month a year earlier + the last 4 months, so the notes together cover
# 2008-01 -> today with two gaps. 9 notes the page links 404
# (0124, 0310, 0523, 0716, 0726, 0809, 0909, 1009, 1214) and are left out; the
# Nov 2024 note (1124) is listed but its division table is incomplete, so the
# parser skips it with a message. ~98 MB on first run, cached thereafter.
extras_cache: true
extra_urls:
  - "https://www.instat-mali.org/laravel-filemanager/files/shares/pub/ihpc0926_pub.pdf"
