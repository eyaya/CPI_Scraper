notes: >
  WAEMU/UEMOA harmonised CPI (IHPC, base 2023 = 100). INSTAT publishes only a
  monthly PDF note (Tier 3). Its national table reads cleanly as text: per
  COICOP-2018 division (01..13) and the 'INDICE NATIONAL' row (00), a weight, a
  handful of monthly index columns and 1-/3-/12-month variations. We emit the
  index level for every dated column shown (so one note yields several months,
  newest included). French labels (from a fixed COICOP map).
  BASES AND COVERAGE, READ FROM EACH NOTE (never assumed, never chained):
  base 1996 (notes to Oct 2009) and base 2008 (Nov 2009 - Apr 2018) cover BAMAKO
  only -- the all-items row reads 'INDICE DE BAMAKO' -- and are filed under
  geography 'Bamako'; base 2014 starts May 2018, still Bamako-only in several
  2018-19 notes, national from 2019 (genuinely different series: 2018-12 = 105.0
  Bamako vs 103.5 national); base 2023 (COICOP-2018, 13 divisions) from Jan 2025.
  COICOP-1999 labels for the older bases are taken from the row as printed. Where
  a newer note re-prints a month on a newer base (its year-ago column), the
  newer note wins for that month and the row carries that base. Published
  inconsistency kept: Oct 2024 all-items = 106.71 in the Jan 2025 note, 110.66
  in the Oct 2025 note (whose 12-month rate, -4.7%, matches 110.66); newest wins. The note also carries
  a by-region (Bamako, Kayes, …) table and secondary nomenclatures for later.
