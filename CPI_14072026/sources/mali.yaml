country: Mali
iso3: MLI
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Institut National de la Statistique (INSTAT)
frequency: monthly

# --- discover ---
# INSTAT posts the monthly IHPC note as 'ihpc<MMYY>_pub.pdf', newest-first, on its
# IHPC publications page. We scrape the first such link (newest month).
discover:
  method: page_scrape
  page_url: "https://www.instat-mali.org/fr/publications/indice-harmonise-des-prix-a-la-consommation-ihpc"
  link_contains:
    - "ihpc"
    - "_pub.pdf"

parser: mali_instat_ihpc
geography: National
expect_divisions: 14          # INDICE NATIONAL (All items) + 13 COICOP-2018 divisions

notes: >
  WAEMU/UEMOA harmonised CPI (IHPC, base 2023 = 100). INSTAT publishes only a
  monthly PDF note (Tier 3). Its national table reads cleanly as text: per
  COICOP-2018 division (01..13) and the 'INDICE NATIONAL' row (00), a weight, a
  handful of monthly index columns and 1-/3-/12-month variations. We emit the
  index level for every dated column shown (so one note yields several months,
  newest included). French labels (from a fixed COICOP map). The note also carries
  a by-region (Bamako, Kayes, …) table and secondary nomenclatures for later.
