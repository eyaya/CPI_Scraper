country: Zambia
iso3: ZMB
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Zambia Statistics Agency (ZamStats)
frequency: monthly
verify_ssl: false            # ZamStats serves an incomplete TLS certificate chain

# --- discover ---
# ZamStats posts a monthly bulletin ('The Monthly', Vol NNN) newest-first on its
# monthly-bulletin page; the CPI-by-division table lives inside it.
discover:
  method: page_scrape
  page_url: "https://www.zamstats.gov.zm/monthly-bulletin/"
  link_contains:
    - "monthly"
    - ".pdf"

# December bulletins in the PRE-2023 layout, each printing its own year and
# the two before on the 2009 basket (base 2009 = 100): 2011..2022 together.
# Read by parsers/zambia_zamstats_legacy.py; the 2021 issue carries no table
# with month rows and is covered by the 2020 and 2022 issues. Back issues never
# change, so complete copies on disk are reused.
extras_cache: true
extra_urls:
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-117-2012-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-140-2014-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-152-2015-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-164-2016-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-176-2017-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-189-2018-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-201-2019-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-213-2020-The-Monthly-December.pdf"
  - url: "http://www.zamstats.gov.zm/wp-content/uploads/2023/12/Vol-237-of-2022-The-Monthly-December.pdf"

parser: zambia_zamstats
geography: National
expect_divisions: 13          # All items + 12 COICOP-1999 divisions

notes: >
  'The Monthly' bulletin (a ~48-page general release) carries 'Table 1.2: Consumer
  Price Index by Division' — a wide monthly index series (from 2022) with the
  divisions as columns and months as rows. Divisions are COICOP-1999 (12 + All
  items) in a non-standard column order, so columns are matched to codes by a
  header keyword (a header wrap even leaves a phantom empty column, skipped). The
  year sits on each January row and is carried forward. Index levels only; base as
  published by ZamStats (not restated in the bulletin table).
