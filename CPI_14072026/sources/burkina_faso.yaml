country: Burkina_Faso
iso3: BFA
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Institut National de la Statistique et de la Démographie (INSD)
frequency: monthly
verify_ssl: false            # INSD serves an incomplete TLS certificate chain

# --- discover ---
# INSD publishes the monthly IHPC note as Excel (NOTE_IHPC_Base_2023_de_<MONTH>_
# <YEAR>.xlsx / .xls). The 2026 site redesign dropped these from the home page —
# they now live only on the price-statistics page, which is NOT in date order and
# mixes the Excel notes with PDF ones and with the ICC (construction cost) note,
# so we pick the newest by the French month + year in the filename and keep to the
# Excel notes the parser reads.
discover:
  method: latest_named_month_link
  page_url: "https://www.insd.bf/fr/statistiques/statistiques-economiques/statistiques-des-prix"
  lang: fr
  link_contains:
    - "note_ihpc"
    - ".xls"

# BACK ISSUES (added 2026-10-12): every IHPC note on INSD's price-statistics
# listing (pages 0-6), 2020 onward. Excel notes are read by the workbook
# reader; PDF notes by the shared WAEMU-note reader (parsers/ihpc_note_pdf.py).
# Several base-2014 PDFs print the division table as an IMAGE -- those are
# skipped with a message, never OCR'd. Complete copies are reused.
extras_cache: true
