country: South_Africa
iso3: ZAF
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Statistics South Africa (Stats SA)
publication_code: P0141
frequency: monthly

# --- discover ---
# The listing page (?page_id=1847) sits behind an Incapsula anti-bot WAF, but
# the file itself is directly downloadable. The filename carries the latest
# data month, e.g. "... (202605).zip", so we probe the direct URL backward from
# the current month until the newest published file is found.
discover:
  method: probe_monthly
  url_template: "https://www.statssa.gov.za/timeseriesdata/Excel/P0141 - CPI(COICOP) from Jan 2008 ({tag}).zip"
  tag_format: "%Y%m"
  lookback_months: 6
  inner_suffix: ".xlsx"

parser: statssa_cpi_coicop
geography: Total country      # national headline; provinces available but excluded in v1
expect_divisions: 14          # All items + 13 COICOP-2018 divisions

notes: >
  Stats SA publishes a zipped historical Excel time series (Jan 2008 -> latest)
  of CPI index numbers. We extract the national "Total country" series at
  All-items + COICOP division level. Sub-groups, provinces, and analytical
  series are present in the source and can be enabled later.
