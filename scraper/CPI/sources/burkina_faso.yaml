country: Burkina_Faso
iso3: BFA
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Institut National de la Statistique et de la Démographie (INSD)
frequency: monthly
verify_ssl: false            # INSD serves an incomplete TLS certificate chain

# --- discover ---
# INSD publishes the monthly IHPC note as Excel (NOTE_IHPC_Base_2023_de_<MONTH>_
# <YEAR>.xlsx / .xls) and surfaces the newest on its home page. We scrape the
# first 'NOTE_IHPC' file link (newest month).
discover:
  method: page_scrape
  page_url: "https://www.insd.bf/"
  link_contains:
    - "note_ihpc"

parser: burkina_insd
geography: National
expect_divisions: 14          # INDICE GLOBAL (All items) + 13 COICOP-2018 divisions

notes: >
  WAEMU/UEMOA harmonised CPI (IHPC, base 2023 = 100). INSD publishes the monthly
  note as Excel, whose 'page1' sheet is 'Tableau 1' — the UEMOA division table
  (INDICE GLOBAL + Roman-numeral divisions I..XIII). We emit the current-month
  index plus the '/1mois' (MoM) and '/12mois' (YoY) variations. Reads both .xlsx
  and .xls. One workbook = one month; history accumulates across runs. Shares the
  Roman-numeral COICOP-2018 map with the Togo PDF parser (togo_inseed).
