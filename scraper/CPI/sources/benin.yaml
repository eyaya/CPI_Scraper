country: Benin
iso3: BEN
indicator: CPI
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Institut National de la Statistique et de la Démographie (INStaD)
frequency: monthly

# --- discover ---
# INStaD posts the connected IHPC series ('Indices_division_global_raccordés')
# in the current-year folder on its monthly-prices page. We scrape that .xlsx;
# when INStaD extends/renames it the scrape still matches ('raccord' + .xls).
discover:
  method: page_scrape
  page_url: "https://instad.bj/publications/publications-mensuelles/prix"
  link_contains:
    - "raccord"
    - ".xls"

parser: waemu_ihpc            # shared UEMOA IHPC parser (same as Senegal)
geography: National
expect_divisions: 14          # All items (Global) + 13 COICOP-2018 divisions

notes: >
  Harmonised CPI (IHPC, WAEMU/UEMOA base 2023 = 100), same PHÉNIX-UEMOA
  methodology and parser as Senegal. INStaD's 'série de données' is a single-sheet
  wide monthly index series by COICOP-2018 division (01..13) + 'global' (All
  items, 00). NOTE: the published connected series currently ends Dec 2024 (it is
  the one-time splice to the 2023 base; 2025+ months are so far only in the
  monthly note PDFs). The discovery re-scrapes each run, so a refreshed/extended
  file is picked up automatically. French labels kept as published.
