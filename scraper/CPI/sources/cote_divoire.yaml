country: Cote_dIvoire
iso3: CIV
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Agence Nationale de la Statistique (ANStat)
frequency: monthly
verify_ssl: false            # anstat.ci serves an incomplete TLS certificate chain

# --- discover ---
# anstat.ci is a SPA; its searchPublicationByCritere endpoint returns publication
# cards, each with a thumbnail Imageval_indicateur<ID>.png. The PDF lives at the
# parallel path File_val_indicateur<ID>.pdf, so we map the newest IHPC card's id.
discover:
  method: anstat_ci_ihpc
  search_url: "https://anstat.ci/publication/searchPublicationByCritere"
  file_base: "https://anstat.ci/assets/publications/files"
  title_contains: "INDICE HARMONISE DES PRIX"
  save_as: IHPC_ANStat_CoteDIvoire.pdf

parser: ci_anstat
geography: National
expect_divisions: 14          # INDICE GLOBAL + COICOP-2018 divisions 01–13

notes: >
  UEMOA/WAEMU harmonised CPI (IHPC) under the new COICOP-2018 nomenclature (14
  categories: INDICE GLOBAL + divisions 01–13), rebased 100 = 2023. The national
  table gives each division with (weight +) five monthly indices then 1-/3-/12-month
  variations, so current index = nums[-4], MoM nums[-3], YoY nums[-1]. Division
  codes come from the 'NN -' prefix; divisions 04 and 05 wrap so the code is read
  from the line above. Sub-items are skipped. Report month from the header text.
