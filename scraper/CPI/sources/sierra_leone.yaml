country: Sierra_Leone
iso3: SLE
indicator: CPI
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: Statistics Sierra Leone (Stats SL)
frequency: monthly
verify_ssl: false            # Stats SL serves an incomplete TLS certificate chain

# --- discover ---
# Stats SL links the latest monthly 'CPI Press Release' PDF from its home page.
discover:
  method: latest_dated
  page_url: "https://www.statistics.sl/"
  link_contains:
    - "press_release"
    - ".pdf"

parser: sierraleone_stats
geography: National
expect_divisions: 13          # All items + 12 COICOP-1999 divisions

notes: >
  'Table 1: National CPI and rates of inflation by main COICOP functions
  (December 2021 = 100)'. The letter-spaced header is unreadable, but each row's
  trailing three numbers are the 1-/3-/12-month % changes, so the current index is
  nums[-4], MoM nums[-3], YoY nums[-1]. We emit index + inflation_mom +
  inflation_yoy for the report month (from the filename). One PDF = one month.
