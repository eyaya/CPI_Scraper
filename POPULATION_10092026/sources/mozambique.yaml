parser: ine_mozambique_population
geography: Total country

notes: >
  INE projections 2017-2050 (IV RGPH 2017 base), one workbook for the country
  and one per province: five-year age groups 0-4 .. 80+ and Total by sex, the
  TOTAL residence block only (no urban/rural column in this schema). The
  "Grupos etários seleccionados" block (overlapping sums) is not collected.
  Checked every run: bands = Total per sex, Homens + Mulheres = Total, Quadro
  resumo = year sheets, provinces sum to the national figure.

  CAPTION SLIPS HANDLED: Sofala 2050 captioned "Indicadores"; Manica 2034's
  Total row labelled "Q19"; sheet names vary ("2017", " 2017", "Q1_2017").

  NOT COLLECTED: each workbook's "Indicadores" sheet (life expectancy, infant
  mortality, fertility by year) -- a further source for the mortality /
  fertility indicators.

  CROSS-CHECK: 2017 27,864,265; 2025 34,090,466 (= Anuário 2025 Quadro 2.1.1);
  Niassa 2050 4,773,510.
