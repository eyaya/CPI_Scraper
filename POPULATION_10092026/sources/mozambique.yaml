country: Mozambique
iso3: MOZ
indicator: Population
tier: 2
source_type: excel
agency: Instituto Nacional de Estatística (INE Moçambique)
publication_code: Projecções da População 2017-2050 (base IV RGPH 2017)
frequency: annual
verify_ssl: false

# --- discover ---
# INE's Liferay document library, folder 92163 "Projecções da população 2017 -
# 2050" (reached from the Censo 2017 page, NOT under Estatísticas >
# Demográficas -- which is why Mozambique was recorded as rejected). The folder
# page shows one entry at a time and the headless API answers 403, so the
# twelve download paths were read off each file's view_file/<id> page
# (92376 national; 92233..92359 provinces) and are pinned. ine.gov.mz times
# out intermittently: retry before concluding a file is gone.
discover:
  method: static_url
  url: "https://www.ine.gov.mz/documents/20119/92163/Mocambique%20publicacao.xls/950b4bd1-1e5d-3f19-5ae6-36cc90d97a76?download=true"
  save_as: INE_MZ_Projeccoes_Mocambique.xls
  download_timeout: 300

