notes: >
  Projections (series_type projection) for the nation, its 7 regions and 20
  prefectures (Bangui is both the prefecture and the Bas-Oubangui region):
  2021 both sexes (page 190) and 2024 by sex plus density per km2 (page 199,
  "ICASEES, projections démographiques 2024"; page 190's 2024 column is only
  cross-checked). Prefecture spellings differ between the pages and are
  mapped to one label. Communes (pages 207, 211) not read.

  PUBLISHED, PINNED: page 190 prints Yadé region 2021 as 910 945 -- its
  prefectures sum to 1 208 849, and with that figure the regions add up to
  the RCA total exactly. Filed as printed. Pages 190/199 differ by 1 for
  Plateaux and Kagas 2024.

  CROSS-CHECK: RCA 2021 6 091 097; 2024 6 470 307 (H 3 208 814 / F 3 261 493).
