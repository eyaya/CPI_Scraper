geography: Total country

notes: >
  Projections from the 2008 census for the fifteen states of today's Sudan,
  2009-2018 (series_type projection): each state by five-year age band x
  sex (Tables 2b-30k), and SUDAN (their sum) both sexes from Table 1. State
  and age labels follow sudan.yaml. National age x sex is not printed and
  not derived; 2008 "enumerated"/"smoothed" tables and single-age young
  population tables not read.

  PUBLISHED, PINNED IN THE PARSER: Red Sea 2009 -- male bands sum 99 below
  the male total and M + F misses Total by 3-12 in twelve bands; Blue Nile
  2013 -- Total 965 573 against M + F 965 673.

  CROSS-CHECK: SUDAN 2009 31 898 536; 2018 41 984 512; Khartoum 2018
  7 993 851.
