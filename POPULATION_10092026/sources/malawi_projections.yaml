notes: >
  NSO Malawi Population Projections 2018-2050. Annex 1: national projection by
  five-year age group (0-4 .. 95+) and NSO's special age groups (Less than 1,
  1-4, 6-13, 14-17, 0-14, 15-24, 15-44, 15-49, 15+, 18+, 50+, 60+) x sex,
  2018-2050 (2018 total 17,563,749 = census; 2050 33,619,332). Annex 2: 32
  districts/cities by age group x sex, 2018-2043 (district names as printed in
  this report: "Lilongwe Rural", "Blantyre Rural"). Mangochi 2042-2043 is
  printed without year headers and is skipped. Table 4.1 (indicators) deferred.
