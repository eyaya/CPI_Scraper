# A SECOND Burkina Faso descriptor beside burkina_faso.yaml (the 2019 census
# report): INSD's 5e RGPH Volume 4, "Projections démographiques 2020-2035",
# édition 2, janvier 2023 (11 MB, 520 pages).
discover:
  method: static_url
