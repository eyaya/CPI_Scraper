notes: >
  INSTAT Madagascar RGPH-3 2018 national population by five-year age group and sex
  (Tableau 69 = urban + rural; the national figure is their sum). Total 25,674,196
  (M 12,658,945 / F 13,015,251); the age bands sum to 25,654,489, the ~19.7k residual
  being age-not-stated (kept as published). Tier-3: the table interleaves French
  space-grouped counts with comma-decimal percentages, so counts are recovered by a
  token walk (comma tokens delimit counts). series_type = census. Deferred: the
  urban/rural split itself and the province tables.
