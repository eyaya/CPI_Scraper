# A SECOND Seychelles descriptor beside seychelles.yaml (2026 ERP by age).
# nbs.gov.sc now serves a SiteGround CAPTCHA (sgcaptcha), which is not
# bypassed; this is the Wayback Machine's unmodified (id_) copy of NBS's OWN
# workbook nbs.gov.sc/files/Population-Vital-Statistics.xlsx, captured
# 2022-03-02 (it revises a 2016 capture of the same series: 1977 61 789 ->
# 61 786).
discover:
  method: static_url
  url: "https://web.archive.org/web/20220302052545id_/https://www.nbs.gov.sc/files/Population-Vital-Statistics.xlsx"
  save_as: NBS_Seychelles_Population_Vital_Statistics.xlsx
  impersonate: ["chrome124", "safari17_0"]
  download_timeout: 300

parser: nbs_seychelles_timeseries
geography: Total country

notes: >
  National mid-year population estimates, 1971-2016 (series_type estimate),
  as published -- including NBS's own rebasings on the 1987, 1994, 2002 and
  2010 censuses and adjustments for misreported births (workbook notes 3-11);
  nothing re-chained. Births, deaths and vital rates not read (no schema
  measure).

  CROSS-CHECK: 1971 54 695; 2010 89 770; 2016 94 677.
