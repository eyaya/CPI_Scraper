notes: >
  Persons (and, nationally / by urban category, households) below the FOOD
  poverty line ("Extremely Poor"), 1998 and the 1992/93 Household Economic
  Survey as republished: 7 divisions, 3 urban categories, 11 socioeconomic
  groups + national (Tables 4.3.4.1, 4.3.5.1, 4.3.5.2, 4.2.1.1). Integer
  percentages as printed. The OVERALL-line headcount is printed only as its
  complement ("Non Poor") -- deriving it would be recomputation, so it is
  not emitted. Lines per AEU per year 1998: overall D5,538.78 (Greater
  Banjul), D3,898.15 (other urban), D3,087.55 (rural); regional, so no single
  line_value. Per the report, persons are assigned their household's status.

  CROSS-CHECK: 51% of persons / 37% of households extremely poor (1998); 15%
  (1992); Upper River 73; Rural 71; large groundnut farmers 1992 36.
