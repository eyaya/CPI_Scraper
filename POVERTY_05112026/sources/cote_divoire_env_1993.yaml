geography: Total country

notes: >
  The ORIGINAL ENV 1993 and ENV 1995 estimates (national P0 0,313 / 0,339; the
  2002 and 2008 reports republish re-estimates 32,3 / 36,8). P0 P1 P2 printed
  as FRACTIONS -- unit index, kept as printed; contributions printed as
  percentages. Overall and extreme lines (101 340 / 144 800; 64 465 / 94 600
  FCFA). Tables 2.1.1 (1985 only), 2.1.3 (1986-1988 only, percent), 2.2, 2.1.2,
  2.4.1a/b and 2.4.2a/b (socio-economic group), 2.5.1.1-2.5.1.3 (stratum x sex
  of head). Not collected: 2.1.0 (a 92 340 FCFA extreme line used nowhere else),
  2.1.2's 1995 contributions (inconsistent with its rates), Tableau 3
  (nationality: no schema topic), Tableau 4 (housing); one cell "3.O1O".
  CROSS-CHECK: 1993 0,313 / 0,087; 1995 0,3391 / 0,0837 / 0,0315; extreme 1995
  0,0993; Forêt Ouest 1995 0,4714; 1986 6,9; female heads 1995 0,2674.
