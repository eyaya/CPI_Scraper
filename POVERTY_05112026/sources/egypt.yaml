notes: >
  National-line poverty rate (HIECS 2015, 2017/18, 2019/20): SDG report 2023
  Tableaux 2-4 (national, sex, six age groups) and the Egypt in Figures
  regional table (urban governorates, urban/rural Lower and Upper Egypt; the
  frontier governorates are not printed). The $2.15 PPP table is World Bank
  data and not collected; the 1999/2000-2012/13 rounds appear only in a
  trend chart whose labels cannot be paired with years from the text layer,
  and as images in the HIECS 2019/20 poverty-indicators file. CROSS-CHECK:
  27,8 / 32,5 / 29,7; men 30,4, women 29,1 (2019/20); Upper Rural 56,7
  (2015), 51,9, 42,8.
