notes: >
  IOF 2010 poverty profile (French; footer "PNUD/INE", published on INE's
  site). Official absolute cost-of-basic-needs line 10 975 730 STD per person
  per year: P0/P1/P2 and contributions by the 7 districts over households and
  persons (Tableau 4), by sex within districts (5), and by sex, household type
  and quintile (6). Also the RELATIVE measure (2/3 of mean expenditure per
  head) for 2000 and 2010 (Tableau 3), line_type relative.

  This is the original IOF 2010 estimate; the IOF 2017 report's "2010" (68,4)
  is a survey-to-survey re-estimate and keeps its own survey label.

  CROSS-CHECK: 66,2 / 24,8 / 12,0; households 54,4; Caué 84,5; relative 2000
  53,8, 2010 49,6.
