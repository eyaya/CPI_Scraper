notes: >
  Fay-Herriot small-area estimates of P0 with 95% CI for 216 districts
  (GLSS 7 direct district estimates + PHC 2010 covariates), upper line. Some
  districts carry a degenerate CI (Bia East 17.2 17.2 17.2): their estimate is
  purely synthetic (one EA sampled) -- kept as printed. Table 1's GLSS 7 DIRECT
  regional 95% CIs are added under survey "GLSS 7 (2016/17)"; their point
  estimates equal the GLSS 7 profile's and are not re-emitted.

  CROSS-CHECK: Ahanta West 23.6 (4.5-42.7); Chereponi 93.5 (86.9-100.0);
