notes: >
  PS II 1993 ch. 10: EXTREME poverty headcount only (Tables 10.2 province x residence, 10.4 strata, 10.5 sex of head and household size). Extreme line K5,910 per adult equivalent per month (moderate K8,480). The overall headcount is not tabulated (only extreme + moderate, not summed here); Table 10.8's P1/P2 are averaged over the poor only, so are not FGT measures. CROSS-CHECK: extreme 76; rural 89; urban 56; North-Western 90; urban high cost 44.
