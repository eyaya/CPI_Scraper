country: Tunisia
iso3: TUN
indicator: Poverty
tier: 3
source_type: pdf
agency: Institut National de la Statistique (INS)
publication_code: Enquête Nationale sur le Budget, la Consommation et le Niveau de vie des ménages 2021, Volume A (arabe)
frequency: ad_hoc
verify_ssl: false
expect_metrics: 4
