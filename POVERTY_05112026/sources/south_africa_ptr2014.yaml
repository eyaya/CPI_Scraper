notes: >
  PTR 2014, a superseded edition: IES 2005/06, LCS 2008/09, IES 2010/11 on
  its own line series (Table 2, March prices: FPL 210/305/321, LBPL
  300/416/443, UBPL 431/577/620 per person per month). Survey labels
  "... (Poverty Trends 2014)". National FPL P0 and gap (Tables 3/4); UBPL
  P0/P1/P2 for persons by sex, age, education (18+), province, settlement
