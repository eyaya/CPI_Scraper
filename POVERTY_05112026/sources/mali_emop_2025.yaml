country: Mali
iso3: MLI
indicator: Poverty
tier: 3
source_type: pdf
agency: Institut National de la Statistique (INSTAT Mali)
publication_code: Résultats annuels de l'EMOP 2025 (chapitre pauvreté)
frequency: annual
expect_metrics: 3
expect_rows: 40

# --- discover ---
# Listed on INSTAT's EMOP publication page
# (https://www.instat-mali.org/fr/publications/enquete-modulaire-et-permanente-aupres-des-menages-emop)
# as ranuel25_eq.pdf. TLS verifies.
discover:
  method: static_url
  url: "https://www.instat-mali.org/laravel-filemanager/files/shares/eq/ranuel25_eq.pdf"
  save_as: mali_ranuel25_eq.pdf
  download_timeout: 900

parser: mali_emop_latest_poverty
geography: Total country

notes: >
  INSTAT's annual EMOP (Enquête Modulaire et Permanente auprès des Ménages)
  poverty chapter for 2025, individual-level (the report: "les principaux
  résultats relatifs aux indices de pauvreté se réfèrent aux individus").
  Own year read from the tables' "Source : EMOP-2025" lines. P0/P1/P2 by region
  (P0 95% CI where printed), by sex of the head, and Tableau 8.7 (education of
  the head, household size, Bamako / Autres villes / Rural) where printed.
  Line value: this report's own Tableau 2-1 row where it prints one.
  EMOP 2013 excludes Gao, Tombouctou, Kidal; 2014-2018 exclude Kidal.
  From this NEWEST report only, Tableau 2.1 / 3.2 add the EMEP 2001 .. EMOP 2024 series as
  republished here (survey "<round> (série républiée, EMOP 2025)"), with each round's line
  and P0 CI (EMOP 2019's printed CI 55,5-60,5 does not bracket 42,0 and is not taken).
  METHOD BREAK 2022: the basket is priced from EMOP cluster prices from 2022 on (line
  186 221 FCFA in 2021 -> 279 574 in 2022).
