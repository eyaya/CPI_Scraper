country: Sao_Tome_and_Principe
iso3: STP
indicator: Poverty
tier: 3
source_type: pdf
agency: Instituto Nacional de Estatística (INE)
publication_code: Inquérito aos Orçamentos Familiares 2017 (IOF 2017), capítulo II
frequency: ad_hoc
verify_ssl: false
expect_metrics: 5
expect_rows: 40

# --- discover ---
# The IOF 2017 report's direct upload path, as unemployment/ fetches it (an
# extra_urls entry there): INE STP's Phoca category
# 63-inquerito-aos-orcamentos-familiares-iof, folder accents percent-encoded.
# ine.st stalls intermittently, hence the long timeout.
discover:
  method: static_url
  url: "https://www.ine.st/phocadownload/userupload/Documentos/Inqu%C3%A9ritos/Inqu%C3%A9rito%20aos%20Or%C3%A7amentos%20Familiares%20-IOF/Inquerito%20aos%20orcamentos%20familiares%202017.pdf"
  save_as: stp_iof2017.pdf
  download_timeout: 300

parser: sao_tome_poverty
geography: Total country

notes: >
  IOF 2017, chapter II. Cost-of-basic-needs line (World Bank methodology)
  STD 19.017,00 per capita per year (52,10 a day), printed as "STD" though
  its magnitude is thousand old dobras (= STN); kept as printed. National P0
  P1 P2 for the total and extreme/food lines; P0 P1 P2 by sex, household type
  and welfare quintile; 2017 P0 confidence interval; 2010 P0/P1/P2 by S2S
  imputation onto 2017 prices and line (survey tagged separately -- not the
  official IOF 2010 estimate of 66,2%, prose only and stated non-comparable).

  NO GEOGRAPHIC BREAKDOWN is tabulated (districts/domains appear only in
  charts). QUIBB 2005 (also retained by unemployment/) carries no poverty
  table -- "pobreza" appears only in prose.

  NOT COLLECTED: Tabela 6 contributions (printed as fractions); Tabela 6
  sections 3-4 (employment status -- person vs head not stated); Tabelas 12/13
  2017 rows (29,9 vs Tabela 4's 30.0, published rounding discrepancy);
  standard errors; Tabela 7.

  CROSS-CHECK: P0 66.7 / P1 30.0 / P2 17.3; extreme 47.0 / 18.4 / 9.9;
  men 66.7, women 66.5; 2010 S2S P0 68.4 (CI 66.0-70.7), P1 35,3, P2 22,5.
