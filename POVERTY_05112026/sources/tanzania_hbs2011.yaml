notes: >
  HBS 2011/12 (Oct 2011 - Oct 2012) poverty key findings: Tables 1-3 --
  basic-needs and food P0 by area, poverty gap by area, P0 and distribution
  of the poor by children aged 0-6 and household size. NEW METHOD and lines
  (TZS 36,482 / 26,085 per adult equivalent per month): NBS states 2007 and
  2011/12 are not strictly comparable. The 2011/12 MAIN report (with the
  re-estimated 2007 of 34.4) was not found on NBS's site or in its Wayback
  index; NBS's 2020 trend leaflet prints 34.4 only in a chart.
  CROSS-CHECK: 28.2 / food 9.7 / gap 6.7; Dar es Salaam 4.2; 7+ members 38.9.
