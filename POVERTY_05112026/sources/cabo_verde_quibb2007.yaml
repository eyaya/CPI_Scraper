notes: >
  QUIBB 2007 on the IDRF 2001/02 RELATIVE line (comparable with 36,7% in
  2001/02): Quadros IX-1/IX-2 (P0, P1, P2 for urban / rural / national by
  milieu, 6 study domains, 22 concelhos and head characteristics) and
  X-1/X-2 (population share, number of poor, contribution). Filed
  line_type relative, so it never shares an ID with the 2015-method
  absolute series that re-estimates 2007 at 45,4. The same Quadro IX-1 is
  also published as a workbook (publication 1441). Within-milieu shares
  (urban/rural columns of X-1/X-2) are not read: different denominator.

  CROSS-CHECK: 26,6 / 8,1 / 3,4; urban 13,2, rural 44,3; 117.219 poor
  (concelhos sum exactly); Paúl 54,1; Santa Catarina do Fogo 59,0;
  female head 33,0.
