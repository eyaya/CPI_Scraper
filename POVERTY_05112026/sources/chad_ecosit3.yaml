country: Chad
iso3: TCD
indicator: Poverty
tier: 3
source_type: pdf
agency: Institut National de la Statistique, des Études Économiques et Démographiques (INSEED)
publication_code: ECOSIT3 Rapport principal sur la pauvreté, Tchad 2011 (version publiée)
frequency: ad_hoc
verify_ssl: true
expect_metrics: 4
expect_rows: 280

# --- discover ---
# inseed.td (INSEED's former site, Joomla jdownloads) is gone; the new
# inseed.ssn-tchad.td API lists only ECOSIT4. Wayback `id_` copy of
# inseed.td's own file, found through the CDX index (2021-08-14 capture).
discover:
  method: static_url
  url: "https://web.archive.org/web/20210814195458id_/https://www.inseed.td/index.php/blog-with-right-sidebar/document/send/9-documents-et-publications-socioculturelle/86-ecosit3-rapport-principal-sur-la-pauvrete-tchad-2011-version-publiee"
  save_as: INSEED_ECOSIT3_rapport_pauvrete_2011.pdf
  download_timeout: 900

parser: chad_ecosit3_poverty
geography: Total country

notes: >
  ECOSIT3 2011 poverty profile: Tableaux 4.6-4.8 (P0/P1/P2 and share of the
  poor by milieu, 20 regions and characteristics of the head) and the
  ECOSIT2 2003 comparison of Tableaux 4.9-4.11 (national P0/P1/P2; P0 by
  head characteristics and milieu). Lines 237 942 (2011) and 144 570 (2003)
  FCFA per person per year. INSEED states ECOSIT2 and ECOSIT3 are comparable;
  ECOSIT4 2018 uses a different method.

  4.11's 2003 region rows are NOT collected: their values repeat across
  groups of today's regions (the coarser 2003 strata copied onto successor
  regions). 4.8's split text-layer rows are rejoined in the parser.

  CROSS-CHECK: 2011 46,7 / 26,3 / 15,9; 2003 55,0 / 21,6 / 10,8; Mandoul
  70,9; N'Djaména 11,0 (2003 20,8); 2003 Primaire 64,1.
