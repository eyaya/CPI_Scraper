  download_timeout: 900

parser: rwanda_eicv5_poverty
geography: Total country

notes: >
  EICV5 poverty profile (Oct 2016 - Oct 2017), same line as EICV4 (RWF
  159,375 / 105,064, January 2014 prices). Table 1: P0 and gap EICV3-EICV5.
  Table 16: total and extreme P0 by urban/rural and province, EICV4 and
  EICV5. Table 17: distribution of the poor and of the population. Table 26:
  P0 of adult men/women and boys/girls under 16. Not read: Table 3 (earlier
  print of Table 16, EICV4 rural 43.8 vs 43.7), Table 18 (P0 x share), panel
  matrices, characteristics of the poor.

  THE 2016/17 ROUND EXISTS TWICE: 38.2 here (EICV4 line) and NISR's re-
  prediction on the EICV7 basis (rwanda.yaml, own survey label and line).

  CROSS-CHECK: 38.2 / gap 11.7; extreme 16.0; urban 15.8, rural 43.1; Kigali
  City 13.9 (2013/14 20.9); boys 44.2; distributions of the poor sum to 100.0.
