country: Sudan
iso3: SDN
indicator: Poverty
tier: 3
source_type: pdf
agency: Central Bureau of Statistics (CBS)
publication_code: National Baseline Household Survey 2009, tabulation report
frequency: ad_hoc
expect_metrics: 2
expect_rows: 100

# --- discover ---
# cbs.gov.sd does not resolve. Wayback `id_` copy of CBS's own file (found
# through the CDX index of cbs.gov.sd/*; the same report is also archived as
# /POVERTY%202009.pdf and /files/Sudan%20National%20Baseline.pdf -- byte-
# identical). The route unemployment/ and labour/ use for Sudan.
discover:
  method: static_url
  url: "https://web.archive.org/web/20140206213403id_/http://cbs.gov.sd:80/files/Sudan%20National%20Baseline.pdf"
  save_as: CBS_NBHS_2009_National_Baseline.pdf
  impersonate: ["chrome124", "safari17_0"]
  download_timeout: 900

parser: sudan_poverty
geography: Total country

notes: >
  NBHS 2009, the 15 states of NORTHERN Sudan (pre-secession; today's Sudan).
  Line SDG 113,8 per person per month (p. 27). Table 9.1: P0 and poverty gap
  for Northern Sudan and six regions (filed "<name> region" so they never land
  on a state of the same name). Annex B3: share poor, urban / rural / total,
  by age group and by the 15 states (whole numbers); its national total (46)
  is Table 9.1's 46,5 rounded and is not taken twice.

  Not collected: "Non poor" columns, MDG 1.3 (inequality), MDG 1.6 (poverty
  of the employed), and the 2014/15 NHBPS food-security and poverty analysis
  (archived at cbs.gov.sd/resources/uploads/files/pdf/; charts only).

  CROSS-CHECK: P0 46,5, gap 16,2; Khartoum region 26,0 / 6,4; Darfur 62,7 /
  24,6; urban 27, rural 57; Red Sea state 58 (rural 80); Northern Darfur 71.
