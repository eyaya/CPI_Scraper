notes: >
  HCP indicator pages (Revenu & conditions de vie > Pauvreté et
  vulnérabilité): absolute poverty by milieu for ENNVM 2007, ENCDM 2014, ENSR
  2019 and ENNVM 2022/23 (2001 is collected from morocco_encdm2001); P0 for the
  12 regions in 2001/2014/2022 (2022 has no 'Régions du Sud' row); relative
  poverty (50% of median INCOME) 2020. HCP labels the ENSR 2019 survey year
  '2020'; dated 2019 (HCP's 2024 note: '1,7% en 2019'). Vulnerability
  (Tableau 12) is not a poverty measure and is not collected.
  CROSS-CHECK: 8,9 / 4,8 / 1,7 / 3,9 national; rural 2022 6,9; Fès-Meknès 2022
  9,0; relative 12,7.
