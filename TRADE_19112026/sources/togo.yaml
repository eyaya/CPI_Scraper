notes: >
  INSEED Togo quarterly bulletins (https://inseed.tg/echanges-exterieurs/ lists 42
  issues, 2016-T1..2026-T2; download ids in extra_urls). Each issue prints five
  quarters. Read: Tableau 1 exports FOB, imports CIF, balance (millions of FCFA)
  and quantities (tonnes); exports / imports by SITC section (sitc1) and division
  (sitc2), value (millions FCFA) and net weight (tonnes); by partner country (ISO
  alpha-2 + name printed; non-country codes -> group) and by geographic / economic
  zone (labels printed with the zone code, "11 Union Europeenne" -> group); and,
  in the issues from ~2023, Tableaux 87/88/89 exports / imports / balance by month,
  quarter and year since 2008 (billions of FCFA; semesters skipped). Newest issue
  wins per observation; a finer print wins within an issue. SPAN: monthly
  2008-01..2026-06, quarterly headline 2008-Q1..2026-Q2, annual 2008-2025 (balance
  2026 partial year as printed); quarterly SITC / partner / zone cuts 2015-Q1..2026-Q2.
  GAPS: issue ids 2143 and 2146 (2017-T2/T4 listings) answer 404; 2131, 2133, 4880,
  5105 downloaded truncated (inseed.tg drops long transfers) and were left out -- their
  quarters are covered by neighbouring issues (each prints five quarters). Rows with
  no label (page numbers caught on a table line) are dropped. Not read: HS-section
  tables (no schema class), shares, growth rates, customs-regime and top-ten tables,
  the 2016-T1 price-index issue (2199).
  CROSS-CHECK (verbatim, 2026-T2 issue): Tableau 89 balance juin 2026 -56,7 =
  148,3 - 205,0 (Tableaux 87/88); annual 2025 exports 1 011,5 imports 2 003,5
  balance -992,0; Tableau 1 imports 2026-T2 562 120,6, balance -266 392,5; exports
  to "23 Pays de l'Afrique de l'Ouest" 2026-T2 145 770,2. Identity guard passes on
  all quarterly and monthly cells.
