notes: >
  NISR Formal External Trade in Goods (customs data), US$ million.
  INVENTORY: monthly reports with Excel annex (each prints the month a year earlier
  (revised), the previous month and the month) -- Excel annexes posted for Dec 2022,
  Dec 2023, Jan 2024 - Aug 2026; monthly PDFs without Excel exist for Oct-Dec 2020,
  Jan/Mar/Apr/Jul/Aug/Dec 2022 and Jan-Nov 2023 (not parsed; the 2023 months come back
  as revised columns of the 2024 annexes). Quarterly reports with Excel annex (a
  rolling 14-16 quarter window): 2022Q4, 2023Q4, 2024Q2-2026Q2 on the live site,
  2017Q4 from a Wayback id_ copy of the NSO's own file (file/6473).
  COLLECTED: monthly 2021-12 .. 2026-08 (total exports f.o.b., domestic exports,
  re-exports, imports c.i.f., total trade, balance; SITC sections for domestic exports,
  imports and re-exports; top-10 partners + Rest of the World by flow); quarterly
  2014-Q1 .. 2017-Q4 and 2019-Q1 .. 2026-Q2 (domestic exports, imports, re-exports,
  total, balance; SITC sections; top-20 partners; EAC members; blocs CEPGL, COMESA,
  Commonwealth, ECOWAS, SADC, EU; continents).
  GAPS: quarterly 2018-Q1..2018-Q4 (needs the 2018Q4-2021Q4 annexes, file/7629, 8712,
  9557, 11794 -- Wayback answered 429 all session); quarterly before 2014 (2013Q3 and
  2014 annex .xls on the old /system/files/ path, same reason); monthly before 2021-12
  (PDF-only issues not parsed).
  NOTE: NISR's quarterly "Exports" are DOMESTIC exports (Total Trade = Exports + Imports
  + Re-exports). Where the EAC sheet and the top-20 partner sheets disagree (revised
  tea and coffee destinations) the partner sheet is kept.
  CROSS-CHECK (verbatim workbook cells): Aug 2026 total exports f.o.b. 386.0890276953348,
  imports c.i.f. 641.4043457142052, balance -255.3153180188704 (202608 annex); 2023-Q1
  exports 402.14468784688006, imports 1476.5099483773447, re-exports 156.25277435433534,
  total 2034.90741057856, balance -918.1124861761293 (2026Q2 annex); 402.14 + 1476.51 +
  156.25 = 2034.91 and 402.14 + 156.25 - 1476.51 = -918.11.
