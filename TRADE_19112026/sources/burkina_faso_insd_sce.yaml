notes: >
  INSD quarterly notes on foreign trade ("ICE_BF_<year>_Trimestre<n>" 2010-2018, "SCE"
  2019-2026). Each prints five quarters. Read: the balance table (Tableau 07 / 1.7
  "Evolution de la balance commerciale" or "Evolution du commerce extérieur"): exports FOB,
  imports CIF, BC (balance, signed), billions of FCFA, QUARTERLY 2009-Q4..2026-Q2; Tableaux
  03/1.3 and 06/1.6 the main partner countries (top 10 each quarter, labels as printed --
  spelling varies by issue), exports FOB / imports CIF, billions of FCFA, 2012-Q1..2026-Q2.
  Newest issue wins per quarter. A quarter header that breaks the run of consecutive
  quarters (3T2021 prints "1 T 20" for 1T21) is dropped, not corrected. Gaps: the
  2010-T2/T3 and 2012 issues use another layout (not read; their quarters come from later
  issues), no 1T2025 or 1T2019 issue on the listing (covered by later issues). Not
  collected: principal products (CTCI codes, top 10), weights (thousand tonnes, labels
  not on the value line), unit-value / quantity / terms-of-trade indices.
  CROSS-CHECK (verbatim): 2T2026 Tableau 1.7 exports 2T26 2 334,4, imports 1 128,7, BC
  1 205,8 (= 2 334,4 - 1 128,7); 2T25 exports 1 555,5; Tableau 1.3 ÉMIRATS ARABES UNIS
  2T26 1 158,0, SUISSE 863,4; Tableau 1.6 CHINE 2T26 269,9, GHANA 162,4. 2T2019 Tableau 07:
  BC 2T18 -121,2 (exports 438,1 - imports 559,3). SUM: 2024 quarters = annual (exports
  3 421,3; imports 3 901,5 vs 3 901,1).
