notes: >
  OFFICIAL COMPILER: SARS (Customs) compiles and publishes South Africa's merchandise
  trade statistics; Stats SA does not. Monthly preliminary releases January 2010 -
  September 2026 (196 PDFs on the SARS reports page). COVERAGE: releases up to the
  September 2013 figures cover South Africa EXCLUDING the BLNS countries (2010 annual
  exports R590.0bn in the December 2011 release vs R666.4bn summed from SARS's 2010
  bilateral workbook including BLNS; the AFRICA zone jumps from R13.2bn in Aug 2013 to
  R22.0bn in Sep 2013); from the October 2013 release the national figures include
  BLNS ("including BLNS/BELN" printed). Only releases stating "including BLNS/BELN"
  are read (151 of 196), so nothing here mixes coverages or shares a key with an
  excluding-BLNS figure; the 45 earlier releases (Jan 2010 - Sep 2013 figures) are
  NOT collected (no coverage field in the schema). Four 2022-23 releases with
  image-only tables yield nothing either. Taken from each release: page 1 exports,
  imports and trade balance (rand) for the reporting month and the previous month
  when labelled "(Revised)" -- always all three together, so each month's triplet is
  one release's vintage and satisfies balance = exports - imports; the monthly
  statement by HS section (R million; national classification, roman numeral code);
  world zones before 2014; December releases' January-December section totals.
  Where page 1 covers a month, statement Total rows for that month are dropped.
  RUN ORDER: south_africa_sars (Excel) FIRST, then this descriptor, so the monthly
  export/import totals of the page-1 vintage (not the Excel's later revision) sit
  beside the page-1 balance. Revisions between a release's previous month and the
  Excel workbook (e.g. March 2024: R162.3bn exports in the April 2024 release vs
  R165.2bn in the Excel) are why the two vintages cannot be mixed in one month.
  Verbatim cross-checks: September 2026 release p1 exports R 190 591 057 729, imports
  R 170 794 521 991, trade balance R 19 796 535 738; April 2024 release March 2024
  (Revised) R 162 333 535 110 / R 153 169 295 417 / R 9 164 239 693; April 2015
  release March 2015 (Revised) balance R -9 035 916; Sept 2026 section V Mineral
  products exports 46 031.2 Rm.
