country: Egypt
iso3: EGY
indicator: Trade
tier: 2                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: excel
agency: Central Agency for Public Mobilization and Statistics (CAPMAS)
publication_code: Foreign Trade (Monthly Bulletin) -- CAPMAS publication 22
frequency: monthly
expect_rows: 300             # per issue: Table 1 + BEC + partners (~350)
# TLS verifies with the default CA store (checked 2026-11-12); no verify_ssl override.

# --- discover ---
# CAPMAS's SPA is backed by a JSON API on port 8080 (the route the CPI/PPI
# descriptors use). Publication 22 is the monthly foreign-trade bulletin;
# GET /api/Publication/22 returns the newest issue's Excel URL.
discover:
  method: capmas_publication
  api_base: "https://www.capmas.gov.eg:8080"
  publication_id: 22
  prefer: excel
  save_as: capmas_trade_latest.xlsx

parser: egypt_capmas_trade
geography: National

# BACK ISSUES: every monthly workbook from January 2021 (the first Excel
# issue), resolved through /api/Publication/SearchPublicationDetail?
# PublicationId=22&Year=Y&Month=M (2026-11-12). Earlier issues (2006-2020) are
# PDF only and not read. ADD each new month here when the primary moves on
# (merge-on-write keeps rows already collected either way).
extras_cache: true
