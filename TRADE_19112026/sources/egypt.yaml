notes: >
  OFFICIAL COMPILER: CAPMAS (the NSO) compiles and publishes Egypt's merchandise
  trade statistics under the general trade system (since January 2008) from
  Customs Authority (imports), GOEIC (non-petroleum exports), the Ministry of
  Petroleum and the Ministry of Electricity. INVENTORY: monthly bulletin
  (publication 22) since January 2006 -- Excel from January 2021 (68 issues to
  August 2026), PDF only before (2008-2018 scanned images; 2019-2020 a text
  layer of reversed Arabic glyphs) -- not read; an annual bulletin
  (publication 100, PDF only, 1994-2023) is not read. COLLECTED, per monthly
  issue: Table 1 (US$ million) -- total exports, total imports, trade volume
  (total), trade balance, and the petroleum breakdown as national product lines
  (crude oil, LNG from 2022, petroleum products, exports/imports except crude
  oil and its products / non-petroleum, labels as printed) for the month and the
  same month a year earlier (validated data); Tables 6-A/6-B exports/imports by
  BEC category (17 codes, US$ million), the month; Tables 9-A/9-B exports/imports
  by region and country (US$ thousand), the month and the same month a year
  earlier. December issues add the January-December cumulative = the calendar
  year (2021-2025). Spans: headline monthly 2020-01..2026-08 (2020 from the 2021
  issues' year-ago column), annual 2020-2025; BEC monthly 2021-01..2026-08,
  annual 2021-2025; partners monthly 2020-01..2026-08, annual 2020-2025. GAPS:
  2006-2019 (PDF only); Table 9-B (Arab countries) is missing from the June 2023
  workbook. Year-to-date (January-<month>) blocks are not a schema period and
  are skipped. The newer issue's figure wins where two issues print one month.
  Not collected: ports (Table 2), the product lists of Tables 3-5/7 (national
  lists in US$ thousand), Table 8 (partner x product matrix), changes and shares.
  CROSS-CHECK (verbatim, August 2026 workbook, Table 1, US$ million): total
  exports Aug 2026 4696.928, Aug 2025 4179.633; total imports Aug 2026
  11071.011468; trade volume 15767.939468; crude oil exports 149.015.
  January 2021 workbook Table 1: total exports Jan 2021 2496.942, imports
  5654.196, balance -3157.254, volume 8151.138.
