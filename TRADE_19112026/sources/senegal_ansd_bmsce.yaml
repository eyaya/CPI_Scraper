notes: >
  ANSD BMSCE, 32 monthly issues fevr. 2024 .. sept. 2026 (add each new issue to
  extra_urls and move the primary url forward); each prints five months (month
  under review, the three before, the same month a year earlier), so the span is
  2023-02..2026-09 (2023-02..2023-12 only the months the issues reprint). Read:
  Tableau 1/2 all products value (FCFA) and net weight (kg); Tableaux 19/20
  (exports) and 23/24 (imports) by HS chapter, value in millions of FCFA and
  weight in thousands of kg; Tableaux 27/29 exports/imports by partner country
  and ANSD's regional groupings ("LES PAYS MEMBRES DE LA COMMUNAUTE EUROPEENE",
  "LES PAYS DE L'AFRIQUE DE L'OUEST" ... -> group; "DIVERS (PBE,PBF,OM,nda..)" and
  its parts -> group), millions of FCFA; Tableau 31 trade balance by partner,
  millions of FCFA, signed as printed. The chapter tables print labels only; the
  HS2 code is ANSD's own code for the identical label in its HS2 workbook (one
  label spelt differently, "HUILES ESSENTIELLES ; ... PARFURMERIE", stays
  uncoded). Columns are located by the right edges of the right-aligned figures;
  a page segment whose columns cannot be located is skipped, never guessed (a few
  pages in juin 2024, sept 2025). Newest issue wins per month; within an issue the
  FCFA print of Tableau 1/2 replaces the chapter-table total in millions. Not
  collected: groupes d'utilisation and produits regroupes (national lists; HS2 is
  collected), unit values, shares, growth rates, cumulative columns.
  CROSS-CHECK (verbatim, sept. 2026 issue): exports sept-26 566 034 349 588 FCFA,
  imports 595 574 801 043, balance sept-26 -29 540 (Tableau 31 total, millions;
  exports - imports = -29 540,5); ch.27 exports sept-26 233 133; FRANCE exports
  sept-26 1 939; SUISSE 122 932; PAYS BAS 55 034; LES PAYS MEMBRES DE LA
  COMMUNAUTE EUROPEENE 92 535. SUM: sept. 2026 imports, the regional groupings
  (589 060) + DIVERS (6 515) = 595 575 = Tableau 2 total (595 574,8 million);
  exports 525 719 + 40 315 = 566 034. Chapters 2026-09 sum 566 040 vs 566 034.
  Older BMSCE / "BullComex" back issues 2010-01..2024-01 are on the same page;
  their months are covered by the partner and HS2 workbooks, so they are not read.
