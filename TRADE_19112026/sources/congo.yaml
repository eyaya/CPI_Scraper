notes: >
  INS Congo bulletins of foreign trade (customs data). INVENTORY (publications API,
  sous_secteur stat-commerce-exterieur): quarterly 2022-Q1..2022-Q4, 2023-Q1, 2023-Q2,
  2024-Q1..2024-Q4, 2025-Q1..2026-Q2; annual bulletins 2023, 2024, 2025; Excel versions
  of the 2025-Q4, annual 2025, 2026-Q1 and 2026-Q2 bulletins (used in place of their
  PDFs); 2023-Q3/Q4 not posted. Also the 2018 yearbook chapter "ASN CH22" (not read).
  COLLECTED: headline exports / imports / balance (milliards FCFA): quarterly 2023-Q1 ..
  2026-Q2, annual 2019-2025; top-10 partner countries per quarter / year; top-10
  products and "quelques produits" series (national list); exports and imports by
  geographic and economic zone (groups) -- quarterly 2022-Q1..2026-Q2, annual 2023-2025.
  GAPS: the 2022 bulletins' Tableau 1 (headline 2022 quarters) did not parse; the 2025-Q2
  and 2025-Q3 PDFs gave only 2-3 rows (their caption lines did not parse) -- their periods
  are covered by the 2025-Q4 and 2026 Excel files' 6-quarter windows. The unit column
  "10^9 FCFA" is rendered "109 FCFA" by the text layer and read as 1e9.
  CROSS-CHECK (verbatim): 2024-Q4 exports 1 048,814, imports 760,736, balance 288,08
  (4th-quarter 2024 bulletin Tableau 1 prints the same; 1 048,814 - 760,736 = 288,078);
  2025 exports 4 038,4, imports 2 688,5, balance 1 349,9 (annual 2025 bulletin
  Tableau 1); 2026-Q2 exports 1 463,3, imports 596,6 (2026-Q2 Excel Tableau 1);
  exports to Chine 2025 2 907,9 milliards.
