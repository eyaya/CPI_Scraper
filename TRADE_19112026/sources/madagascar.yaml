notes: >
  INSTAT (the NSO) publishes trade figures (source D S E / INSTAT, from customs
  data) in its Tableau de Bord de l'Economie: Tableau 32 monthly exports FOB and
  Tableau 33 monthly imports CAF, millions of ariary, the last 24 months, total
  and national product lines (exports: biens alimentaires, vanille, crevette,
  café, girofle, produits miniers, zones franches; imports: biens alimentaires,
  riz, sucre, énergie, équipement, ciment). COLLECTED: monthly 2023-01..2026-03
  from TBE 57 (January 2025) and TBE 62 (April 2026); the newer issue wins a
  repeated month. GAPS: before 2023 (older TBE workbooks not located on the
  site; INSTAT's TBE pages list issues 57-63 only); TBE 63 (August 2026) is a
  compressed PDF without workbook -- not read. No partner or HS cut is published
  by INSTAT in these tables; INSTAT's commerce extérieur notes were not found.
  CROSS-CHECK (verbatim, TBE 62): exports total Mar 2026 841567.6636240002,
  Apr 2024 919444.7903820014; vanille Apr 2024 91957.61112599999; imports total
  Mar 2026 2011979.6662290003, riz Apr 2024 54772.971744.
