country: Madagascar
iso3: MDG
indicator: Trade
tier: 2
source_type: excel
agency: Institut National de la Statistique (INSTAT) -- Direction des Statistiques Economiques
publication_code: Tableau de Bord de l'Economie (TBE), Tableaux 32-33
frequency: monthly
expect_rows: 500
# TLS verifies with the default CA store (checked 2026-11-12); the CPI/PPI
# descriptors' verify_ssl: false is NOT mirrored.

discover:
  method: static_url
