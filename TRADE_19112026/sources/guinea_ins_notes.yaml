geography: National

notes: >
  INS Guinee monthly note on foreign trade, annex tables: Tableau 1/2 "Principaux
  produits exportes / importes en <mois> <annee>" -- the 20 leading products (HS
  heading descriptions printed WITHOUT codes -> commodity_classification hs4, code
  blank), value in billions of GNF ("VALEURS (en milliards de GNF)"), and "Total
  general" = all products (the monthly headline exports / imports); Tableau 4/5
  "Principaux pays clients / fournisseurs" -- the 20 leading partners, "Autres pays"
  (partner_type group) and "Total general", billions of GNF. MONTHLY 2022-07..2026-08
  from the notes listed (the newest note wins per month). GAPS: 2022-08 (only a
  differently laid-out "Bulletin"), 2022-11, 2024-02, 2024-04, 2025-07 (tables not
  laid out one cell per line -- skipped, never guessed), and tables missing from
  single notes (e.g. 2024-10 partners, 2023-12 suppliers). Earlier: NCE notes
  2014-10..2015-03 print only price indices and contributions (not collected), the
  monthly series 2015-2022 is not on the site. Dropped by rule: a table whose title
  names another month than the note's own (INS copies titles: "Mars 2023" inside the
  December 2023 note). NOT collected: net weights -- the column is captioned "(en
  tonne)" but some notes print thousands of tonnes under it (bauxite April 2025
  "15 987" vs August 2026 "15 069 218,8"), so the scale cannot be read; shares;
  Tableau 3 (food imports, a subset); the residual product line. Cells printed
  with a decimal point (2025 notes, "7 167.7") are read as decimals. No trade
  balance table (the balance is only in the text).
  CROSS-CHECK (verbatim, aout 2026): exports Total general 14 890,0; imports
  12 489,7; Or 7 232,2; Minerais d'aluminium 5 736,1; Chine (clients) 6 861,8;
  Pays-Bas (fournisseurs) 4 435,0; Autres pays (fournisseurs) 908,3. SUM: the 20
  suppliers + Autres pays = 12 489,6 vs Total general 12 489,7.
