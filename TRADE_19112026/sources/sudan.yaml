notes: >
  COMPILER: the Central Bureau of Statistics (cbs.gov.sd) has no reachable site;
  Sudan's merchandise-trade statistics are compiled and published by the Central
  Bank of Sudan from Customs (and Ministry of Energy & Petroleum) records, so CBoS
  is the official compiler under the source policy (as the CPI descriptor already
  uses cbos.gov.sd). Unblocked 2026-11-19 (CBoS answered 522 on 2026-11-12).
  INVENTORY (80 issues listed, 2003-Q3 .. 2026 Jan-Jun): the issues are YEAR-TO-DATE
  (the "4th Quarter" issue = January-December). Not posted / not a PDF: 2003-Q3/Q4,
  all 2010 issues and 2011-Q1 (the links serve a 5-page error document), 2014-Q1,
  2020-Q4 (page has no file), 2022-Q2, all of 2023 (the 2024 and 2025 issues carry
  2023 only as an annual row). PINNED: the newest issue of each year (2004-Q1 for
  its 2003 trade-balance page).
  COLLECTED (US$ thousands, "US.$000'S"; imports CIF, exports FOB as the digest's
  introduction states): trade balance table (annual ~2000-2025 with revisions --
  the newest issue wins -- and monthly 2003-01 .. 2026-06 except 2010 and 2023;
  non-petroleum / petroleum exports as national groups in the 2004-2022 issues);
  exports and imports by commodity (the bank's national list, with group subtotals)
  and by country (with regional and COMESA groups), monthly and, in a January-
  December issue, annual.
  GUARDS: every table row must add up to its own year-to-date Total or it is
  dropped (e.g. 2004 export commodities printed with quantities); a key printed
  twice with different figures in one issue is dropped ("Other" in the 2016 import
  tables; the 2012 issue's second "2011" trade-balance row, which is 2012
  mislabelled); the months of a trade-balance page take the year in ITS caption
  (2004-Q1 reprints the 2003 page); the caption year's annual row is kept only when
  all twelve months are printed. BALANCE SIGN: the 2023-2025 issues draw the
  deficit parentheses as graphics, so the text layer has bare magnitudes; a balance
  is kept only when its sign is explicit or it is a surplus (exports >= imports).
  NOT READ: quantities, the quarterly and two-year comparison tables, by-country-
  and-commodity matrices, government imports (2004-2018 issues).
  CROSS-CHECK (verbatim): 2016 balance (5,216,968) = 3,093,639 - 8,310,607 (2022-Q4
  issue); 2026-01 imports 626,013.00, exports 286,474.28 (2026-Q1 issue); 2025 gold
  exports 1,536,253.42; Egypt 2025 exports 718,874.58, imports 959,689.53.
