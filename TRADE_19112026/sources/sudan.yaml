country: Sudan
iso3: SDN
indicator: Trade
tier: 3
source_type: pdf
agency: Central Bank of Sudan (CBoS), Policies, Research & Statistics Department -- official compiler of merchandise-trade statistics (data Sudan Customs Authority, Ministry of Energy & Petroleum)
publication_code: Foreign Trade Statistical Digest (year-to-date; quarterly / half-year / annual issues)
frequency: monthly
expect_rows: 20000
expect_periods: 200

# The digest list (https://cbos.gov.sd/en/periodicals-publications?field_publication_type_tid_i18n=45)
# is not in date order and each issue sits on its own /en/content/<slug> page, so the
# issues are pinned. Issues are YEAR-TO-DATE, so the newest issue of each year carries
# all its months: the newest issue is the discover target, and one issue per earlier
# year is an extra (the newest figure of a key wins). When CBoS posts a newer issue,
# make it the static_url and move the current one to extra_urls if it closes a year.
discover:
  method: static_url
  url: "https://cbos.gov.sd/sites/default/files/Stat_br_%20jan.-jun._%202026.pdf"
  save_as: CBoS_digest_2026_H1.pdf

extras_cache: true
