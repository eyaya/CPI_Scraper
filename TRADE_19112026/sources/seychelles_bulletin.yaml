notes: >
  NBS quarterly bulletin (text-layer PDF, R'000). COLLECTED: Table 1a annual
  (2008-2025) and quarterly (2016-Q1..2026-Q2, with gaps) imports c.i.f.,
  domestic exports f.o.b., re-exports f.o.b. and balance (identity
  dom + re - imp checked on every row); Table 2a imports by HS section/division
  quarterly 2025-Q1..2026-Q2 (national labels; older issues use another title
  and are not read); Tables 3 / 4b imports / domestic exports by country, full
  year 2017-2024 and Q1 (Jan-Mar columns) 2023; Table 5 re-exports of petroleum
  products / other, annual and quarterly 2017-2026; Table 6 economic
  communities (EU, IOC, COMESA, SADC, ASEAN) full-year. Rows whose figures are
  split by stray spaces (e.g. Table 6 of the Q2 2026 issue) are dropped. GAPS:
  issues 2020-Q1..Q3, 2021-Q1..Q3, 2022, 2023-Q2/Q4, 2024, 2025, 2026-Q1 could
  not be fetched (NBS refuses scripted downloads; Wayback refused connections /
  truncated the 2023-Q4 copy on 2026-11-12) -- re-run when either host allows;
  extra Wayback captures exist for 2023-Q4 and 2024-Q1..Q4.
  CROSS-CHECK (verbatim, Q2 2026 issue Table 1a, R'000): 2025 imports
  22,363,608, domestic exports 5,565,219, re-exports 2,920,587, balance
  -13,877,802; 2026 Q2 imports 5,943,105, domestic exports 1,855,708,
  re-exports 1,181,786, balance -2,905,611. Table 5 2024 petroleum products
  re-exports 2,851,916. Table 3 2024 imports from UAE 7,419,930.
