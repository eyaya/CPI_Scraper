notes: >
  INS (the NSO) compiles Tunisia's merchandise trade from customs records
  (general/offshore regimes combined in the totals read here). The monthly note
  "Commerce extérieur aux prix courants" (PDF + Excel annexes) is CUMULATIVE
  (January to the reference month) and compares three years; only the December
  issue (= calendar year) and the March issue (= first quarter) are schema
  periods. COLLECTED: "Balance par chapitres" exports / imports by HS chapter
  (hs2, 97+ chapters), value in TND and net weight in kg -- annual 2021-2025
  (December 2023/2024/2025 issues) and Q1 2021-2026 (March 2023/2025/2026);
  "Balance par pays" exports / imports by country and bloc (MD) -- annual
  2021-2025, Q1 2021-2026 (PAYS DE UE, PAYS ARABES, PAYS D'AFRIQUE ...,
  AVITAILLEMENT, PAYS NON DETERMINE are groups); Comext "Global" total exports,
  imports and balance (MD) -- annual 2019-2025, Q1 2020-2026; Comext "GP" by
  product group (alimentation, énergie, matières premières et demi-produits,
  biens d'équipement, biens de consommation) -- annual 2021-2025 and Q1
  2020-2026. GAPS: annual chapters/countries before 2021 and the March 2021 /
  December 2019-2021 chapter and country annexes are PDF (not read); the March
  2024 issue has no chapter/country xlsx; the December 2022 publication page
  could not be located (its years are covered by the 2023/2024 issues). Not
  collected: régime général / offshore split, the GSA (sector) and TYPE sheets
  (sector/type cuts are taken from the INS stats pages, tunisia_web.yaml),
  coverage rates and variations.
  CROSS-CHECK (verbatim): Comext_12mois_2025 Global -- see run output; March 2026
  Comext Global exports 3 mois 2026 16266.820824575003, imports 21499.521426994;
  Balance par chapitres 9 mois annex (not collected) chapter 01 exports 2026
  3839099 TND. Balance par pays Année 2025: FRANCE export 2025 14828.085584616001,
  ALLEMAGNE export 2025 9177.758196709001, PAYS DE UE export 2025 44527.81454734702.
