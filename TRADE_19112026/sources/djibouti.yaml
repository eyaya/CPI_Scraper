notes: >
  INSTAD Annuaire statistique, chapter 5.1 "Commerce exterieur" (customs data).
  Editions on the INSTAD API: 2017, 2018, 2020 (file 404), 2021 (= the 2022
  file), 2022, 2023, 2024, 2025. Collected: Tableau 5.1.1 imports by 17 "grands
  groupes" + "Transactions speciales" + "Total importations speciales" (special
  trade), Valeur CAF in millions of FDJ and Volume in tonnes (measure quantity,
  unit tonnes -- net or gross not stated), 2014-2024; Tableau 5.1.2 the
  "Reexportations" row (value, millions FDJ; volume tonnes from the 2022
  edition on), 2014-2024; Tableau 5.1.6 imports by origin country (VALEUR EN
  FDJ, POIDS EN KG as quantity kg), 2016 (2017 edition) and 2017 (2018
  edition). INSTAD prints no export table (Djibouti's domestic exports are not
  tabulated; the re-exports are the export-side flow) and no partner table
  after 2017. Gaps: 2013 (only in the 2017 edition, whose Tableau 5.1.1 page is
  a rotated scan-like layout that does not read in order -- dropped).
  Not collected: 5.1.3 (tax regimes), 5.1.4 (product x origin, volume), 5.1.5
  (a mixed list of HS sections/chapters/headings, 2013-2017 only).
  Check: in every edition the groups add to the Total within 2 (rounding);
  2018 edition 2017 within 22.
  CROSS-CHECK (2025 edition, Tableau 5.1.1): Total importations speciales 2024
  valeur 164 166, volume 1 158 656; Khat 2020 valeur 9 587, volume 9 348;
  Alimentation et boissons 2024 valeur 37 933. Tableau 5.1.2 Reexportations
  2024 valeur 671 286. 2018 edition: Total 2014 valeur 133 157; Reexportations
  2014 920 615. Tableau 5.1.6 (2018 ed.): CHINE 2017 31 499 804 821 FDJ, 67 525 700 kg.
