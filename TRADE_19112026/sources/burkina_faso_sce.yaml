notes: >
  INSD quarterly note "Statistiques du commerce exterieur" (SCE), 27 issues
  2019-T2 .. 2026-T2, each printing five quarters: Tableaux 1.1 / 1.4 / 1.7
  (exports FOB, imports CIF, balance; billions of FCFA) and 1.3 / 1.6 (exports /
  imports by leading partner country, billions of FCFA). QUARTERLY 2018-Q2..2026-Q2.
  Newest issue wins. GAPS: the 2T2024 note (Note_SCE2T2024) is laid out differently
  and contributes nothing; the ICE files on the same page are price indices (not
  collected). No commodity table in the SCE (chapters are annual, in the Annuaire).
