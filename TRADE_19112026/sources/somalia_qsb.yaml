notes: >
  SNBS Quarterly Statistical Bulletin, Trade Statistics section; source line
  "Central Bank of Somalia" (CBS compiles the merchandise trade figures; SNBS
  republishes them on its own site). Table 2 exports by category (Livestock,
  Livestock Product (Meat), Fishery Export [from 2024], Animal Skins, Crops &
  Vegetable Oil, Forest Products, Other) + Total; Table 3 imports by 14
  categories + "Of which khat" + Total. US dollars. Each bulletin prints its
  quarter and the same quarter of the previous year (left column = current
  year). Issues on the site: 2021 Q1-Q4, 2023 Q1 - 2024 Q4 (2022 issues and
  2025+ not published as of 2026-11-12), so the span is 2020-Q1 .. 2024-Q4.
  Gap: 2022-Q2 and 2023-Q2 IMPORTS -- the Q2-2023 Table 3 omits the Clothes and
  Construction rows (its categories do not add up to its Total), so the table
  is dropped (2023-Q2 imports come from the Q2-2024 issue; 2022-Q2 imports have
  no other quarterly source). Category labels normalised to the latest issue's
  spelling ("Oil" -> "Oil & Gas", "Furniture" -> "Furniture Utensils",
  "Animal Skins Products" -> "Animal Skins"). Column headers of some issues are
  misprinted (Q4-2024 headed "2024 Q1 / 2023 Q1"); the bulletin's quarter is
  used. Every table is checked: categories (excluding khat) add to the Total.
  CROSS-CHECK: Q4-2024 exports Total 318,383,349.13 (2024-Q4), 150,004,807.33
  (2023-Q4); Livestock 2024-Q4 173,707,453.20; imports Total 2024-Q4
  2,594,902,561.95, Food 641991786.68. March-2021: imports Total 2021-Q1
  1,116,907,189.71, 2020-Q1 934,336,827.01; Cars & spare parts 2021-Q1 169,525,200.60.
