notes: >
  INVENTORY (theme 37, 2026-11-12): 361 items -- type-2 PDF bulletins and
  type-8 notes, monthly 2021-2023 and quarterly 2012-2026, annual
  "Estatísticas do Comércio Externo" PDFs back to 2001; and type-10 Excel
  "Principais Quadros": 2018 (exports, imports, re-exports), 2019-2021
  (re-exports by section only), 2022, 2023, 2024 (two uploads), 2025. Only
  the Excel workbooks are read here (annual 2018 and 2022-2025 for exports
  and imports, 2018-2025 for re-exports). The PDF bulletins (monthly /
  quarterly headline, partners, products, 2001-2026) are NOT read in this
  pass -- the main remaining gap; a PDF descriptor would add the quarterly
  and monthly headline and 2001-2017 / 2019-2021 annual totals.
  CUTS (thousand escudos, CVE; net weight in tons). Exports (FOB) and imports
  (CIF) by HS section (national, roman-numeral code) and HS chapter (hs2),
  and by partner country (each country's total line of the country x section
  table); re-exports by HS section; totals ("Total Geral"). 2018 and 2022
  export totals and some re-export totals are not found (their total lines
  sit outside the value block read); the section/chapter rows are present.
  The 2024 import partner rows sum to 180,919,4xx vs the printed total
  190,433,8xx: some partner total lines carry text in the second column and
  are skipped rather than guessed.
  CROSS-CHECKS (2024 workbook, verbatim): exports Total Geral 7,939,702.673
  (net weight 9,762.79 t); Secção IV exports 6,535,195.497; chapter 16
  exports 6,268,441.086; Spain exports 5,052,097.562; re-exports Total Geral
  32,656,069.729; China exports 12,288.043. Sum check: 2024 HS2 export
  chapters sum 7,939,702.67 = Total Geral; HS2 import chapters sum
  190,433,8xx = Total Geral.
