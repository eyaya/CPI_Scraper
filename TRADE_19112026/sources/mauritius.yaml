country: Mauritius
iso3: MUS
indicator: Trade
tier: 2
source_type: excel
agency: Statistics Mauritius
publication_code: External Merchandise Trade Statistics -- historical series (Data/Historical Series)
frequency: quarterly
expect_rows: 9000
expect_periods: 150
# TLS verifies with the default CA store (checked 2026-11-12); no verify_ssl override.

discover:
  method: page_scrape
  page_url: "https://statsmauritius.govmu.org/Pages/Statistics/By_Subject/External_Trade/SB_External_Trade.aspx"
  link_contains: ["HS_ExtTrade", ".xlsx"]

parser: mauritius_statsmauritius_trade
geography: National

notes: >
  Statistics Mauritius (the NSO) compiles merchandise trade under the general
  trade system from Customs (MRA) declarations; exports f.o.b., imports c.i.f.
  The historical-series workbook is re-issued every quarter
  (HS_ExtTrade_<q>Qtr<yy>_<date>.xlsx). COLLECTED: Table 1 imports and exports
  of goods (Rs million), annual 1938-2025 and quarterly 1985-Q1..2026-Q2: total
  exports (incl. ship's stores and bunkers), total imports, total value of trade,
  balance of visible trade; exports of goods excl. ship's stores, domestic
  exports and re-exports (filed under the national product "Goods excluding
  ship's stores and bunkers" so that both printed identities hold), ship's stores
  and bunkers (national product). Table 4 / Table 6 exports / imports by SITC
  section (sitc1), quarterly and annual 2000-Q1..2026-Q2. Table 5 / Table 7
  exports / imports by country of destination / origin, annual 1956-2025, with
  continents and per-continent "Other countries" lines (qualified with their
  continent) as groups. Not collected: Tables 2-3 (export/import price indices),
  the "of which" product lines (sugar, fish, apparel ... with quantities) and the
  import sub-sections printed without SITC codes, and "of which: Export Oriented
  Enterprises". Detailed HS x country x month files (Detailed_Trade_Data.aspx,
  2005-2025) are finer than HS2 and not read. Monthly figures: see
  mauritius_monthly.yaml.
  CROSS-CHECK (verbatim, 2nd Qr 2026 workbook): Table 1 2025 total exports
  107,574, total imports 315,464, total trade 423,038, balance -207,890; 2026 Q2
  total exports 28,887, imports 96,403, balance -67,516; domestic exports 2025
  55,745, re-exports 19,280; 1938 exports 38, imports 34. Table 7 2025 imports
  from China 55,316, India 25,836, South Africa 20,597. Table 6 2025 section 3
  (mineral fuels) 71,439.
