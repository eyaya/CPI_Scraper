notes: >
  NSA publishes the monthly trade bulletin (PDF) with an Excel table workbook; 50
  workbooks March 2021 - September 2026 are linked from nsa.org.na/document/... pages
  (found through the site's dlp_document sitemap; TLS verifies, no verify_ssl
  override). Each workbook: exports, imports and trade balance monthly over a
  13-month window (2021 issues: from January 2020, with quarters), the year's
  cumulative table, annual 2018-2022 highlights (Annual-2022 issue); exports,
  re-exports and imports by partner country and by SITC group (3-digit, the only
  commodity level published monthly -> sitc3; in the current month also domestic
  exports / re-exports of each group) and by economic region (groups, overlapping:
  SACU, SADC_excl_SACU, COMESA, EU, OECD, BRIC+ ...) for three months per issue
  (current, previous, same month a year earlier). N$ million (NAD x 1e6); the July
  2022 issue prints its balance table in N$ billion and is emitted as such. Month
  columns are anchored on each table's Total row = the file's headline exports /
  imports (some issues store "Aug-23" as a date in 2024); re-export and region
  tables follow the layout proven in the same file. 2021 period tables print no
  scale: emitted only because their months equal, to the unit, the Total of the
  same file's partner tables printed in "Value (N$ m)" (series_code says so).
  Spans: headline monthly January 2020 - September 2026 (81 months), quarterly
  2020-Q1 - 2022-Q1, annual 2019-2025; partner and SITC3 monthly for 68 months
  between March 2020 and September 2026 (three months per issue; missing
  2020-07/08, 2020-10 - 2021-01, 2021-10/11, 2022-01, 2022-08, 2022-10 -- no Excel
  workbook covers them). Note: revisions can be large (March 2021 exports 6548.4 in
  the March 2021 issue, 4674.2 in later issues; the newest is kept).
  Before 2020: NSA bulletins
  2013-2020 are PDF only on the old site (not collected; gap). Not collected: ISIC
  tables, top-5 products by country (matrix), mode of transport, border posts,
  revisions, commodity of the month, annual product tables without codes.
  Verbatim cross-checks (September 2026 workbook): Table 9 Sep 2026 exports
  12244.386986, imports 16914.9734, trade bal -4670.586414; Table 12 Total Sep 2026
  12244.386986, China 4434.693047, South Africa 2397.090455; Table 14 286:Uranium
  Sep 2026 total export 3394.300855, domestic 3394.300855; Table 22 SACU Sep 2026
  3008.369373; March 2021 workbook Table 1 Mar 2021 export 6548.408009 = Table 3
  Total.
