country: Mauritius
iso3: MUS
indicator: Trade
tier: 2
source_type: excel
agency: Statistics Mauritius
publication_code: Monthly External Merchandise Trade Statistics
frequency: monthly
expect_rows: 5000
expect_periods: 120

discover:
