notes: >
  Statistics Mauritius monthly bulletin, one workbook per month. Each prints the
  current month, the previous month and the same month a year earlier (revised):
  (1) summary -- total exports f.o.b. (incl. ship's stores), domestic exports,
  re-exports, ship's stores and bunkers, total imports c.i.f., total
  international trade, trade deficit (signed as printed); (2)/(3) imports /
  exports by SITC section (sitc1); (4) main trading partners of the month (top
  six export destinations and import origins, plus "Other" as a group). Domestic
  exports and re-exports are filed under the national product "Goods excluding
  ship's stores and bunkers" (see mauritius.yaml). Span: 2015-08..2026-08
  monthly (the August 2016 issue's year-ago column reaches August 2015); the
  newer issue's figure is kept where two issues print one month. GAP: 2014-01..
  2015-07 (PDF-only issues not read). The partner cut is the top six of each
  month only, not the full partner list.
  CROSS-CHECK (verbatim, August 2026 issue, Rs Mn): Aug 2026 total exports 9,331,
  domestic exports 4,328, re-exports 990, ship's stores 4,013, total imports
  30,038, total trade 39,369, deficit -20,707; Jul 2026 imports 30,385; imports
  SITC 3 Aug 2026 10,359; exports to United States Aug 2026 792; imports from
  China Aug 2026 5,072.
