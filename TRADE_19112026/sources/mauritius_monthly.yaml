  page_url: "https://statsmauritius.govmu.org/Pages/Statistics/Monthly/Monthly-Trade.aspx"
  link_contains: ["Trade_M_", ".xlsx"]

parser: mauritius_statsmauritius_trade_monthly
geography: National

