notes: >
  BSC (the NSO) compiles and publishes Libya's external-trade statistics (oil
  exports from the National Oil Corporation). COLLECTED: Table 1 exports and
  imports, annual 1999-2025 (thousand LYD; each bulletin reprints the series,
  the newest wins); Table 3 exports / imports by HS section (national) and HS
  chapter (hs2), LYD, annual 2019-2025 (one year per bulletin); Table 4 exports
  / imports by country under regional headings (region "Total" lines emitted as
  groups; "Grand total" skipped), LYD, 2019-2025. Not collected: Table 2
  (sections, repeated in Table 3), Table 5 (product x country matrix), Tables
  8-9 (HS-detail value and quantity), % changes, unit-value indices.
  CROSS-CHECK (verbatim, 2025 bulletin): Table 1 2025 imports 139 584 809,
  exports 145 246 488 (thousand LYD; surplus 5 661.6 million as printed in the
  summary); 1999 imports 1 928 588, exports 3 682 182. Table 4: Italy imports
  11536418026 / exports 51799523649 LYD; UAE 17432859323 / 13963333732; Grand
  total 139584808568 / 145246488117. Sum check: 2025 HS chapters' exports sum to
  145 246.5 million LYD = Table 1; imports chapters 138 591.7 million vs Table 1
  139 584.8 (a chapter row is not read).
