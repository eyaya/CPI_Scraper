notes: >
  INSBU "Bulletin du Commerce Extérieur de Marchandises" (OBR customs data), millions
  of BIF. INVENTORY (api.insbu.bi publications): quarterly bulletins 2020-Q1..2022-Q4,
  2023-Q1, 2023-Q4, 2024-Q1..Q3, 2025-Q1..Q3, 2026-Q1, 2026-Q2 (2023-Q2/Q3, 2024-Q4 and
  2025-Q4 not posted); annual reports 2018, 2020-2024 (downloaded, not parsed); "Indices
  du commerce extérieur" (unit-value indices, not collected).
  COLLECTED: headline quarterly 2015-Q1..2026-Q2 and annual 2015-2025 from Tableau 1
  (imports, domestic exports, re-exports, total trade, balance; the 2020 bulletins'
  single export column as "export"); HS chapters (hs2) of imports and exports by quarter
  2019-Q1..2026-Q2 (+ annual where all four quarters print); continents, blocs (UE,
  COMESA, EAC, CEEAC, CEPGL, SADC) and the countries printed in them, imports and
  exports, 2019-Q1..2026-Q2.
  NOTE: "Total des exportations (2)+(3)" includes temporary exports (2026-Q2 bulletin,
  2021-Q3: 39 276,3 + 4 169,9 + 4 289,9 = 47 736,1), so where domestic exports are
  printed it is not emitted. A Tableau 1 whose exports - imports does not give the
  printed balance for more than a quarter of its rows is dropped (2021-Q1, 2021-Q2,
  2024-Q2, 2025-Q2 bulletin layouts); single inconsistent periods lose their balance and
  total. A cell printed differently in two zone tables of one bulletin (RDC imports
  2025-Q4: 85 910,5 COMESA vs 28 993,7 CEEAC/CEPGL) is dropped.
  GAPS: top-20 partner rankings (side-by-side tables) and temporary exports not read;
  partner and HS2 detail before 2019 (the 2020 bulletins' windows start 2019).
  CROSS-CHECK (verbatim, 2026-Q2 bulletin Tableau 1, millions BIF): 2022-Q1 imports
  576 050,3, domestic exports 107 787,0, re-exports 3 836,1, total trade 692 590,4,
  balance -459 510,2; 2025-Q4 imports 980 824,3, balance -720 985,6.
