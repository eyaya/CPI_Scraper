country: Seychelles
iso3: SYC
indicator: Trade
tier: 2
source_type: excel
agency: National Bureau of Statistics (NBS) Seychelles
publication_code: Merchandise Trade Statistics Series (monthly, HS section and division)
frequency: monthly
expect_rows: 50000
expect_periods: 150

# NBS (nbs.gov.sc/downloads/<id>-merchandise-trade-statistics-series/download)
# refuses requests' own User-Agent (403) and drops the browser-style one
# mid-handshake (2026-11-12), so the NSO's own workbook is read from its Wayback
# `id_` copy (capture 2025-08-11 of edition 1780, the newest captured).
# Wayback answers the browser-style UA with 429, hence client_default.
discover:
  method: static_url
  url: "https://web.archive.org/web/20250811220423id_/https://www.nbs.gov.sc/downloads/1780-merchandise-trade-statistics-series/download"
  save_as: NBS_Merchandise_Trade_Statistics_Series_1780.xls
  user_agent: client_default

parser: seychelles_nbs_trade_series
geography: National

notes: >
  NBS (the NSO) compiles merchandise trade under the general trade system from
  customs administrative records; imports c.i.f., exports and re-exports f.o.b.
  The "Merchandise Trade Statistics Series" workbook (one sheet per flow,
  thousand rupees) gives MONTHLY values January 2009 - May 2025: imports,
  domestic exports (sheet "Exports", titled "VALUE OF DOMESTICS EXPORTS") and
  re-exports, each as TOTAL (all products), by HS chapter (hs2, ~95 chapters,
  two-digit code printed) and by the NSO's ten grouped "HS sections" (national,
  no code). The Exports sheet's repeated page headers date its last two columns
  differently (Apr/May vs May/Jun 2025), so those two columns are dropped:
  domestic exports end 2025-03. Later months, the annual/quarterly summary and
  the partner cuts come from the quarterly bulletins (seychelles_bulletin.yaml).
  Total exports and the balance are not in this workbook.
  CROSS-CHECK (verbatim, Imports sheet): TOTAL Jan 2009 1142064.1073999999,
  Feb 2009 791713.9901699999; Exports TOTAL Jan 2009 225464.22552; Re-Exports
  TOTAL Jan 2009 209121.63168; Imports 01 Live animals Jan 2009 49.47211; 03
  Fish ... Jan 2009 149624.24504. SUM CHECK: imports, the HS chapters sum to the
  TOTAL (Dec 2024 1,528,730 thousand) and so do the ten sections; domestic
  exports chapters fall ~3,100 short of the total in Dec 2024 (a chapter line
  without a code is not read), the sections sum exactly.
