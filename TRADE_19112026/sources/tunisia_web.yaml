notes: >
  INS web tables (Unité: millions de dinars). COLLECTED: page 50 balance
  commerciale -- annual exports, imports, balance 2017-2025 and monthly
  2026-01..2026-09 (live), with monthly windows of earlier years from Wayback
  captures of the same page (2021-2025, months shown at capture time); page 52
  exports / imports by groupement sectoriel d'activité (9 sectors, national),
  last twelve months live (2025-09..2026-08) plus captures (from 2020-11); page
  53 by type d'utilisation, annual 2017-2025; page 54 by continent (groups),
  annual 2017-2025; page 55 principal products exported / imported, annual
  2017-2025 (a header printing one year twice drops both columns). CVS
  (seasonally adjusted) tables are not read. GAPS: December of a year appears
  only where a capture was taken between its release and the next January's
  release; months before 2021 are not on any captured page.
  CROSS-CHECK (verbatim, page 50 live 2026-11-12): balance 2025 -21800.3,
  exports 2025 63695.1, imports 2025 85495.4; September 2026 exports 5728.3,
  imports 8871.5, balance -3143.2; January 2026 exports 5298.7.
