country: Tunisia
iso3: TUN
indicator: Trade
tier: 2
source_type: html
agency: Institut National de la Statistique (INS)
publication_code: Statistiques > Commerce extérieur (web tables, Millions de dinars)
frequency: monthly
expect_rows: 1000

discover:
  method: static_url
  url: "https://www.ins.tn/statistiques/50"
  save_as: ins_statistiques_50.html

parser: tunisia_ins_trade
geography: National

# The other INS trade pages, plus Wayback `id_` captures of pages 50 and 52
# (each capture holds the window the page showed that day: page 50 the current
# year's months, page 52 the last twelve months). Captures chosen from the CDX
# index (2026-11-12) near each year end. Wayback answers the browser-style UA
# with 429, hence client_default for the extras.
extras_cache: false
