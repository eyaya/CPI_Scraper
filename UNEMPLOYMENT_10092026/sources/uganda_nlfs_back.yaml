country: Uganda
iso3: UGA
indicator: Unemployment
tier: 3
source_type: pdf
agency: Uganda Bureau of Statistics (UBOS)
publication_code: National Labour Force Survey 2016/17
frequency: ad_hoc
verify_ssl: false            # as uganda.yaml (www.ubos.org serves an incomplete TLS chain)

# --- discover ---
# The BACK-SERIES: UBOS's "Report on the National Labour Force Survey 2016/17",
# listed on https://www.ubos.org/publications/statistical/ . Its front matter
# carries the 2016/17 selected labour market indicators and a comparison page
# with the 2011/12 NLF & Child Activities Survey. The current Uganda rows (the
# Labour Market Survey 2025) are read by uganda.yaml.
discover:
  method: static_url
  url: "https://www.ubos.org/wp-content/uploads/publications/10_2018Report_national_labour_force_survey_2016_17.pdf"
  save_as: "UBOS_NLFS_2016_17_report.pdf"

parser: uganda_nlfs_back
geography: Total country

notes: >
  UBOS NLFS 2016/17 report front matter (pp. ii-iv): Male | Female | Rural |
  Urban | Total. This descriptor reads the headline rows: working-age population, employed, labour force, EPR, LFPR (and youth 18-30), LU1-LU4, youth LU1/LU4 and youth NEET for 2016/17; working-age population, labour force, LFPR and unemployment rate for 2011/12. Base 14-64; youth 18-30;
  split-year surveys filed at their end year (2017, 2012) with the span in
  reference_period. THE 2011/12 COLUMNS ARE ON THE PRE-REVISION EMPLOYMENT
  DEFINITION (the page's own note: not directly comparable) and every 2011/12
  label says so. The page-iv reprint of 2016/17 is checked against pp. ii-iii,
  not filed twice. Not read: Tables 4.2/4.3's reprints of UNHS 2012/13 and NLF
  2011/12 (Table 4.2's 2011/12 rural and urban own-account shares are printed
  swapped: the rows sum to 70.7 and 129.4).
