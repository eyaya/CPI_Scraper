notes: >
  CAPMAS quarterly Labour Force Survey bulletin (بحث القوى العاملة - الربع
  سنوي) -- about 27 tables covering labour force size, employment,
  unemployment, the participation rate, employment status, occupation and
  economic activity, broken down by sex, urban/rural (حضر/ريف), all 27
  governorates, age group and educational status. Sample is 1,875 clusters and
  22,500 households per quarter.

  THE WORKBOOK IS ARABIC. The layout matches both the Arabic row labels and any
  English gloss, so it survives either: قوة العمل (labour force), المشتغلون
  (employed), المتعطلون (unemployed), معدل البطالة (unemployment rate),
  معدل المساهمة (participation rate).

  UNVERIFIED: the workbook's internal sheet and cell structure could not be
  opened during this build, so the layout scans every sheet and locates the
  period header row and label column by structure rather than by address.
  Narrow `sheet_excludes` / add `sheet_contains` in parsers/excel_layouts.py
  after the first successful run, and check the cross-check below before
  trusting the output.

  SCHEDULING: the API returns `nextPublishDate` (2026-11-15 at time of writing)
  and distinguishes `releaseDate` from `publishDate` -- Q1 2026 was released
  2026-06-15 but only published 2026-07-28. Poll on publishDate.

  Base is 15+ for labour-force measures; the unemployment tables focus 15-64.
  Levels are in thousands.

  CROSS-CHECK (Q1 2026): unemployment rate 6.0%. Recent quarters for context:
  Q4 2025 6.2%, Q3 2025 6.4%, annual 2024 6.6%.
