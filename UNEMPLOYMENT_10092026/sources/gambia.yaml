country: Gambia
iso3: GMB
indicator: Unemployment
tier: 3
source_type: pdf
agency: Gambia Bureau of Statistics (GBoS)
publication_code: Gambia Labour Force Survey (GLFS) findings reports
frequency: annual
verify_ssl: false
expect_topics: 10

# --- discover ---
# REUSED VERBATIM from labour/sources/gambia.yaml: the same three GLFS reports.
# GBoS data portal; each round has its own download category and files are
# served at /downloads-file/<id>-<slug> -- the FULL SLUG is required (the bare
# id returns an empty body). The portal is SLOW (about three minutes per
# report). The 2025 findings report is not fetched: the 2026 report reprints
# 2025 beside 2026 (Tables 2.2, 2.3).
discover:
  method: static_url
  url: "https://www.gbosdata.org/downloads-file/627-the-gambia-labour-force-survey-findings-report"
  save_as: gambia_glfs_2026.pdf
  download_timeout: 600

extra_urls:
  - url: "https://www.gbosdata.org/downloads-file/480-2022-23-gambia-labour-force-survey-report-glfs"
    save_as: gambia_glfs_2022_23.pdf
  - url: "https://www.gbosdata.org/downloads-file/479-the-2018-gambia-labour-force-survey-glfs-2018-"
    save_as: gambia_glfs_2018.pdf

parser: gambia_unemployment
geography: Total country

notes: >
  GLFS 2026 (Q1) annex Tables 0.3 (15+) and 0.4 (youth 15-35): counts and
  rates (participation, employment ratio, time-related underemployment, LU1-LU4,
  informal employment, NEET 15-35 / 15-24) by sex, residence, LGA and adults
  36+. GLFS 2025 (Q1) from the 2026 report's Tables 2.2/2.3 (2026 halves
  proved equal to the annex). GLFS 2022-23 ("2023 (Q1)") Table 3.1. GLFS 2018
  (15-64): Table 4.3 participation and Table 7.1 unemployed counts only.

  READ BY POSITION, PROVED BY ARITHMETIC in every column (LF = E + U;
  population = LF + outside; LU1, participation and employment ratio from the
  counts; underutilisation = U + TRU + PLF).

  PUBLISHED DEFECTS: 2022-23 urban/rural participation (62,6 / 37,4 vs 44,3 /
  42,5 from the counts) not collected; two 2022-23 underutilisation counts omit
  the time-related underemployed (check-only, never emitted); 2025 youth/adult
  unemployment by sex repeats the total (not collected); 2026 Table 0.3's
  youth column contradicts Table 0.4's total (both kept, told apart by
  series_label). The 2018 report's "Unemployment Rate" tables (7.3-7.5, 9.2,
  9.7, 9.8) are DISTRIBUTIONS of the unemployed/employed summing to 100 -- not
  rates -- and are refused.

  CROSS-CHECK: 2026 LU1 6,2, LFPR 54,5, youth LU1 8,7 (0.4) / 8,6 (0.3);
  2025 LU1 8,3; 2022-23 labour force 609 410, LU1 7,6; 2018 LFPR 53,0,
  unemployed 15-64 234 725.
