country: Cote_dIvoire
iso3: CIV
indicator: Unemployment
tier: 3
source_type: pdf
agency: Agence Nationale de la Statistique (ANStat, formerly INS)
publication_code: EHCVM 2021 profil de pauvreté + ENSETE 2013
frequency: ad_hoc
expect_topics: 6
verify_ssl: false

# --- discover ---
# anstat.ci answers every client with a Cloudflare challenge (403), so both
# documents are Wayback Machine `id_` captures -- the NSO's OWN files, original
# bytes, not an aggregator. The EHCVM copy is the one labour/sources/
# cote_divoire.yaml uses, verbatim. The archive sometimes answers `requests`
# with 429; a browser fingerprint gets through.
discover:
  method: static_url
  url: "https://web.archive.org/web/20260327133040id_/https://www.anstat.ci/assets/projet/ehcvm2021.pdf"
  save_as: ANStat_EHCVM2021_profil_pauvrete.pdf
  impersonate: ["chrome124", "safari17_0"]
  download_timeout: 300

extra_urls:
  # INS's ENSETE 2013 descriptive report on employment (19th-ICLS, Feb 2014).
  - url: "https://web.archive.org/web/20151113143428id_/http://www.ins.ci/n/templates/docss/enq_emploi2013.pdf"
    save_as: INS_ENSETE2013_rapport_emploi.pdf

parser: cote_divoire_unemployment
geography: Total country

notes: >
  EHCVM 2021 ch.4 (base 16+): participation and labour-force counts (4-2),
  employment ratio (4-3), unemployment rate by group x age and unemployed
  (4-8). ENSETE 2013 (base 14+, Feb 2014): participation, unemployment rate,
  employment ratio by milieu/sex/age/education, and five self-consistent
  national levels. NOT ILOSTAT's 2.3% -- ANStat's own rates are 5,3 (2014) and
  3,1 (2021/22). Published contradictions kept (4-2 main d'œuvre != employed +
  unemployed); 4-8's education counts refused (sum 606 058 vs 296 059).
  STILL TO WATCH: ENE 2019 / 2024 reports once anstat.ci is reachable.
