country: Nigeria
iso3: NGA
indicator: Unemployment
tier: 3                      # 1=API/SDMX, 2=structured file, 3=PDF/DOC scrape
source_type: pdf
agency: National Bureau of Statistics (NBS)
publication_code: NLFS
frequency: quarterly
expect_topics: 5

# --- discover ---
# The NBS e-library renders a server-side HTML table, newest first, each row a
# link to /elibrary/read/<id>. We take the first "Nigeria Labour Force Survey"
# entry and follow it to its download.
#
# DO NOT probe /download/<id> by incrementing the id: an unused id returns the
# literal string "Invalid Download Request" with a 200, which a naive fetcher
# would happily save as a PDF.
# THE E-LIBRARY IS A DATATABLE, so the title and the link are in DIFFERENT
# CELLS of the same row and the link's own text is a glyph icon:
#
#   <tr><td>Nigeria Labour Force Survey Q2 2024</td> ...
#       <td><a href=".../elibrary/read/1241594"><i class="glyphicon"></i></a></td></tr>
#
# A link-text scrape therefore matched nothing at all while fifteen labour
# force entries sat on the page. `table_row_link` matches the ROW and then
# takes its link.
#
# "socio-economic" is what separates the DATA releases from the reference
# documents filed beside them -- the methodology note, the FAQ, the press
# release and the 2023 framework re-design all carry "labour force survey" in
# their titles too, and one of them is newer than the newest data release.
#
# Rows render newest-first, so the first match is the current quarter.
discover:
  method: table_row_link
  index_url: "https://nigerianstat.gov.ng/elibrary"
  row_contains:
    - "nigeria labour force survey"
    - "socio-economic"
  href_contains:
    - "/elibrary/read/"
  file_link_contains:
    - "download"
  save_as: nigeria_nlfs.pdf

parser: nigeria_pdf
geography: Total country

notes: >
  NBS Nigeria Labour Force Survey. The headline table "Labour Market Indicators
  by Sex and Place of Residence" is a nine-column grid:
  [Total | Urban | Rural] x [Total | Male | Female].

  DENOMINATORS DIFFER BY ROW and the table does not say so. "Labour force
  population", "Employed population" and "Outside the labour force population"
  are shares of the WORKING-AGE population — that is, the participation rate
  and the employment-to-population ratio — while "Unemployed population" is the
  unemployment rate, a share of the LABOUR FORCE. Verified arithmetically on
  the published Q2 2024 figures: 79.5 − 76.1 = 3.4 and 3.4 / 79.5 = 4.3. The
  layout maps each row to the topic it actually measures, not the one its label
  suggests.

  SERIES IS STALLED: NBS has published no LFS report since Q2 2024 (released
  25 Nov 2024). The microdata catalogue is titled "NLFS (Q2 2024 – Q2 2025)"
  and was touched in March 2026, but only the Q2 2024 round is public. A
  scheduled run will keep re-collecting the same quarter until NBS resumes —
  that is the source's state, not a scraper fault.

  CROSS-CHECK (Q2 2024, Total column): unemployment 4.3% (M 3.4 / F 5.1 /
  Urban 5.2 / Rural 2.8); LFPR 79.5%; EPR 76.1%; youth 15-24 unemployment 6.5%;
  time-related underemployment 9.2%; informal employment 93.0%;
  LU2 13.0 / LU3 5.9 / LU4 14.5.
